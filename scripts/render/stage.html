<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Proving Grounds — capture stage</title>
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2')
          format('woff2-variations');
        font-weight: 100 800;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        background: #08090b;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module">
      import { SCENES, LOOP, W, H } from '/scripts/render/scenes.js';

      const canvas = document.getElementById('stage');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d', { alpha: false });

      const byId = Object.fromEntries(SCENES.map((s) => [s.id, s]));
      window.__scenes = SCENES.map((s) => ({
        id: s.id,
        code: s.code,
        title: s.title,
        task: s.task,
      }));

      window.__drawAt = (id, t) => {
        byId[id].draw(ctx, t);
      };

      /** Render one full loop and capture it as a webm. */
      window.__record = async (id, fps = 30) => {
        const scene = byId[id];
        const stream = canvas.captureStream(0);
        const track = stream.getVideoTracks()[0];
        const rec = new MediaRecorder(stream, {
          mimeType: 'video/webm;codecs=vp9',
          videoBitsPerSecond: 780_000,
        });
        const chunks = [];
        rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);

        const frames = Math.round(LOOP * fps);
        // Warm the first frame before the recorder starts so frame 0 is clean.
        scene.draw(ctx, 0);
        rec.start();

        for (let f = 0; f < frames; f++) {
          scene.draw(ctx, (f / fps) % LOOP);
          track.requestFrame();
          // Yield so the encoder drains; keeps memory flat on long loops.
          await new Promise((r) => setTimeout(r, 1000 / fps));
        }

        await new Promise((res) => {
          rec.onstop = res;
          rec.stop();
        });

        const blob = new Blob(chunks, { type: 'video/webm' });
        const buf = await blob.arrayBuffer();
        let bin = '';
        const bytes = new Uint8Array(buf);
        const CH = 0x8000;
        for (let i = 0; i < bytes.length; i += CH) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
        }
        return btoa(bin);
      };

      /** Poster frame, chosen at a composed moment in the loop. */
      window.__poster = (id, t, quality = 0.86) => {
        byId[id].draw(ctx, t);
        return canvas.toDataURL('image/jpeg', quality).split(',')[1];
      };

      document.fonts.ready.then(() => {
        window.__ready = true;
      });
    </script>
  </body>
</html>
