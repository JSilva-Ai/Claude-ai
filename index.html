<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050507" />

    <title>New AI Vision Labs — independent technology studio</title>
    <meta name="description" content="New AI Vision Labs is an independent technology studio. We design and build our own products — intelligent applications and original games — and publish them under our own name." />
    <link rel="canonical" href="https://newaivisionlabs.com/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/mark-512.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- The display face is the first thing painted; preloading it removes the
         width-axis reflow on the headline. -->
    <link rel="preload" as="font" type="font/woff2"
          href="/fonts/archivo-latin-wdth-normal.woff2" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="New AI Vision Labs" />
    <meta property="og:title" content="New AI Vision Labs — independent technology studio" />
    <meta property="og:description" content="New AI Vision Labs is an independent technology studio. We design and build our own products — intelligent applications and original games — and publish them under our own name." />
    <meta property="og:url" content="https://newaivisionlabs.com/" />
    <meta property="og:image" content="https://newaivisionlabs.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="New AI Vision Labs — independent technology studio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="New AI Vision Labs — independent technology studio" />
    <meta name="twitter:description" content="New AI Vision Labs is an independent technology studio. We design and build our own products — intelligent applications and original games — and publish them under our own name." />
    <meta name="twitter:image" content="https://newaivisionlabs.com/og.jpg" />
    <!--
      Organization structured data.

      Hand-written rather than generated, because it is small, it changes about
      once a year, and a build step to emit twelve lines of JSON would be more
      moving parts than the thing it produces. Every claim in it appears
      somewhere on the site in prose as well — there is nothing here that a
      visitor could not read for themselves, which is the line that keeps
      structured data honest rather than a second, quieter set of claims.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "New AI Vision Labs",
        "legalName": "New AI Vision Labs LLC",
        "url": "https://newaivisionlabs.com/",
        "logo": "https://newaivisionlabs.com/brand/mark-512.png",
        "email": "support@newaivisionlabs.com",
        "telephone": "+1-404-597-3852",
        "description": "An independent technology studio building intelligent applications and original games.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "1926 Barrett Knoll Circle NW",
          "addressLocality": "Kennesaw",
          "addressRegion": "GA",
          "postalCode": "30152",
          "addressCountry": "US"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/home.tsx"></script>
  </body>
</html>
