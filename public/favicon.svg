<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon: the monogram reduced to its two load-bearing parts — the A's peak
  and the i's sphere. The full three-letter monogram is deliberately not used
  here: at 16px each letter gets about four pixels and the result is a grey
  smudge. The peak and the sphere survive the reduction and stay recognisably
  the same mark.

  Drawn entirely in the blue so it needs no prefers-color-scheme branch. The
  blue holds against a dark tab strip and against a light one, where a white
  mark would disappear completely.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="nai-fav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#1E6FFF"/>
    </linearGradient>
  </defs>
  <path d="M4 27 14 7l10 20" stroke="url(#nai-fav)" stroke-width="5"
        stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="6"/>
  <circle cx="27.5" cy="9" r="4" fill="url(#nai-fav)"/>
</svg>
