function _artLoad(a){
  var im=new Image();
  im.onload=function(){a.img=im;a.ready=true;};
  im.onerror=function(){console.warn('Enemy art failed to decode; falling back to the drawn hull.');};
  im.src=a.src;
}
ENEMY_ART.forEach(_artLoad);BOSS_ART.forEach(_artLoad);

/* Drawn at the current transform's origin, scaled from the art's own aspect
   so nothing is squashed if a source image is re-exported at another size. */
function _drawEnemyArt(a,w){
  var h=w*a.img.height/a.img.width;
  ctx.drawImage(a.img,-w/2,-h/2,w,h);
}
function _drawBossArt(a,pulse,rage){
  var w=a.w,h=w*a.img.height/a.img.width;
  /* A soft wash behind the hull, breathing on the same clock the drawn hulls'
     reactor cores used, so a boss still reads as a machine under power. */
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=rGrad(0,0,0,w*.62,[[0,a.glow+(rage?.30:.18)+')'],[1,'rgba(0,0,0,0)']]);
  ctx.beginPath();ctx.arc(0,0,w*.62*pulse,0,TAU);ctx.fill();
  ctx.restore();
  ctx.drawImage(a.img,-w/2,-h/2,w,h);
  /* Rage keeps its tell. The hull is redrawn additively onto itself rather
     than washed with a rectangle of colour, which confines the brightening to
     the hull's own alpha — a rectangle would light up the transparent frame
     around it as well. */
  if(rage){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=.20+Math.sin(gs.t*.18)*.08;
    ctx.drawImage(a.img,-w/2,-h/2,w,h);
    ctx.restore();
  }
}

// ─── BOSS SHAPES ──────────────────────────────────────────────────────────────
/*
  `btype` was set on the boss and then never read by anything that draws, so all
  three bosses looked identical and the variety was invisible. Three bodies now,
  one per type, cycling every fifteen waves.
*/
/*
  Three more hulls, on his instruction to use a set of reference renders —
  his own art, New AI Vision Labs' — as the model for new enemy ships. Drawn
  from the same visual families across all sixteen: a molten red/orange
  hull with swept claw-wings and trailing engine flames, a violet crown hull
  with wide blade-wings and a single light-trailing spike, and a blue/gold
  version of that same crown silhouette with glowing nodes along each wing.
  Every existing hull in this file reads "front" as the core/glow sitting
  near the top of local space and the silhouette tapering toward the
  bottom — the wedge enemy's apex is up, the Manta's core sits at (0,-6) —
  so these three follow the same rule rather than trying to import a
  travel-direction convention this game's bosses do not actually have; a
  boss patrols side to side at a fixed height, it does not fly toward the
  player the way a normal enemy or the player's own ship does.
*/
var BOSS_TYPES=6;
var BOSS_NAMES=['DREADNOUGHT','MANTA','HIVE CORE','WARLORD','VOID CROWN','GILDED WARDEN'];
// Half-widths, so each hull turns at its own edge. The clamp used to be a flat
// 80 for all three and the Manta — which is 80 to a side — hung off the screen.
var BOSS_HW=[75,77,70,67,75,75];
function _drawBossBody(e){
  var bt=(e.btype||0)%BOSS_TYPES;
  var rage=e._raged?1:0;
  var pulse=.82+Math.sin(gs.t*.11)*.18;
  var bart=BOSS_ART[bt];
  if(bart&&bart.ready){_drawBossArt(bart,pulse,rage);return;}
  if(bt===3){
    // SPIDER QUEEN — molten red/orange, twin-clawed swept wings, three engine flames.
    // A zigzag polygon, not bezier bulges — the first draft rounded the
    // claws into a soft lobe, caught by screenshot, redrawn with real angles.
    ctx.fillStyle=rGrad(0,-6,4,56,[[0,'rgba(255,150,80,.95)'],[.5,'rgba(160,20,10,.9)'],[1,'rgba(40,0,0,.55)']]);
    ctx.beginPath();
    ctx.moveTo(0,-46);
    ctx.lineTo(16,-30);ctx.lineTo(44,-40);ctx.lineTo(56,-14);
    ctx.lineTo(38,-6);ctx.lineTo(44,16);ctx.lineTo(24,10);
    ctx.lineTo(14,32);ctx.lineTo(0,52);ctx.lineTo(-14,32);
    ctx.lineTo(-24,10);ctx.lineTo(-44,16);ctx.lineTo(-38,-6);
    ctx.lineTo(-56,-14);ctx.lineTo(-44,-40);ctx.lineTo(-16,-30);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,170,90,.5)';ctx.lineWidth=1.4;ctx.stroke();
    ctx.save();ctx.globalCompositeOperation='lighter';
    [[56,-14],[44,16],[-56,-14],[-44,16]].forEach(function(px){
      ctx.fillStyle=rGrad(px[0],px[1],0,8,[[0,'rgba(255,220,150,.9)'],[.4,'rgba(255,120,40,.6)'],[1,'rgba(0,0,0,0)']]);
      ctx.beginPath();ctx.arc(px[0],px[1],8,0,TAU);ctx.fill();
    });
    [[-9,42],[0,52],[9,42]].forEach(function(fp){
      var fl=lGrad(fp[0],fp[1]-2,fp[0],fp[1]+16,[[0,'rgba(255,255,220,.95)'],[.4,'rgba(255,150,50,.8)'],[1,'rgba(255,60,0,0)']]);
      ctx.fillStyle=fl;ctx.beginPath();
      ctx.moveTo(fp[0]-2.5,fp[1]);ctx.quadraticCurveTo(fp[0]-3,fp[1]+9,fp[0],fp[1]+17);
      ctx.quadraticCurveTo(fp[0]+3,fp[1]+9,fp[0]+2.5,fp[1]);ctx.fill();
    });
    ctx.restore();
    ctx.fillStyle=rGrad(0,-10,0,19,[[0,'rgba(255,240,200,'+(.9+rage*.1)+')'],[.5,'rgba(255,100,30,.7)'],[1,'rgba(0,0,0,0)']]);
    ctx.beginPath();ctx.arc(0,-10,19*pulse,0,TAU);ctx.fill();
  }else if(bt===4||bt===5){
    /*
      VOID CROWN and GILDED WARDEN share one silhouette — a violet hull and
      a blue-gold one, matching the two colour families the reference art
      used for the same crown shape. Also a zigzag polygon this time, for
      the same reason as Spider Queen: the bezier-curve first draft came out
      as a rounded blob rather than a bladed crown once actually rendered.
    */
    var gold=bt===5;
    ctx.fillStyle=gold
      ?rGrad(0,-6,4,58,[[0,'rgba(140,200,255,.95)'],[.5,'rgba(20,90,190,.9)'],[1,'rgba(30,20,0,.55)']])
      :rGrad(0,-6,4,58,[[0,'rgba(230,150,255,.95)'],[.5,'rgba(130,20,190,.9)'],[1,'rgba(30,0,50,.55)']]);
    ctx.beginPath();
    ctx.moveTo(0,-58);
    ctx.lineTo(13,-38);ctx.lineTo(36,-46);ctx.lineTo(58,-28);
    ctx.lineTo(48,-8);ctx.lineTo(28,0);
    ctx.lineTo(13,6);ctx.lineTo(6,34);ctx.lineTo(0,60);ctx.lineTo(-6,34);
    ctx.lineTo(-13,6);ctx.lineTo(-28,0);
    ctx.lineTo(-48,-8);ctx.lineTo(-58,-28);ctx.lineTo(-36,-46);ctx.lineTo(-13,-38);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=gold?'rgba(255,200,90,.6)':'rgba(230,170,255,.45)';ctx.lineWidth=1.6;ctx.stroke();
    if(gold){
      ctx.save();ctx.globalCompositeOperation='lighter';
      [[22,-18],[42,-30],[-22,-18],[-42,-30]].forEach(function(np){
        ctx.fillStyle=rGrad(np[0],np[1],0,6,[[0,'rgba(255,255,255,.9)'],[.4,'rgba(120,200,255,.7)'],[1,'rgba(0,0,0,0)']]);
        ctx.beginPath();ctx.arc(np[0],np[1],6,0,TAU);ctx.fill();
      });
      ctx.restore();
    }
    ctx.fillStyle=gold
      ?rGrad(0,-14,0,20,[[0,'rgba(255,255,255,'+(.9+rage*.1)+')'],[.5,'rgba(140,200,255,.7)'],[1,'rgba(0,0,0,0)']])
      :rGrad(0,-14,0,20,[[0,'rgba(255,255,255,'+(.9+rage*.1)+')'],[.5,'rgba(220,140,255,.7)'],[1,'rgba(0,0,0,0)']]);
    ctx.beginPath();ctx.arc(0,-14,20*pulse,0,TAU);ctx.fill();
    var sg=lGrad(0,18,0,60,gold
      ?[[0,'rgba(255,255,255,.9)'],[.5,'rgba(150,210,255,.65)'],[1,'rgba(80,160,255,0)']]
      :[[0,'rgba(255,255,255,.9)'],[.5,'rgba(200,110,255,.65)'],[1,'rgba(150,50,255,0)']]);
    ctx.fillStyle=sg;ctx.beginPath();ctx.moveTo(-5,18);ctx.lineTo(0,60);ctx.lineTo(5,18);ctx.closePath();ctx.fill();
  }else if(bt===1){
    // MANTA — a wide swept wing, violet, with two lit engine pods
    ctx.fillStyle=rGrad(0,0,5,70,[[0,'rgba(200,120,255,.95)'],[.5,'rgba(96,20,190,.9)'],[1,'rgba(20,0,50,.6)']]);
    ctx.beginPath();
    ctx.moveTo(0,-44);
    ctx.bezierCurveTo(34,-40,74,-6,80,18);
    ctx.bezierCurveTo(52,12,34,18,20,34);
    ctx.lineTo(0,44);ctx.lineTo(-20,34);
    ctx.bezierCurveTo(-34,18,-52,12,-80,18);
    ctx.bezierCurveTo(-74,-6,-34,-40,0,-44);
    ctx.closePath();ctx.fill();
    [-46,46].forEach(function(px){
      ctx.fillStyle=rGrad(px,14,0,15,[[0,'rgba(255,255,255,.9)'],[.4,'rgba(190,120,255,.7)'],[1,'rgba(0,0,0,0)']]);
      ctx.beginPath();ctx.arc(px,14,15,0,TAU);ctx.fill();
    });
    ctx.fillStyle=rGrad(0,-6,0,20,[[0,'rgba(255,240,180,'+(.85+rage*.15)+')'],[.5,'rgba(210,90,255,.6)'],[1,'rgba(0,0,0,0)']]);
    ctx.beginPath();ctx.arc(0,-6,20*pulse,0,TAU);ctx.fill();
  }else if(bt===2){
    // HIVE CORE — concentric rings with counter-rotating spokes
    var spin=gs.t*.012;
    ctx.fillStyle=rGrad(0,0,4,62,[[0,'rgba(120,255,220,.9)'],[.45,'rgba(0,130,120,.85)'],[1,'rgba(0,25,25,.55)']]);
    ctx.beginPath();ctx.arc(0,0,48,0,TAU);ctx.fill();
    [[38,1,'rgba(80,255,210,'],[27,-1.6,'rgba(160,255,235,']].forEach(function(rg){
      ctx.save();ctx.rotate(spin*rg[1]);
      ctx.strokeStyle=rg[2]+(.5+rage*.3)+')';ctx.lineWidth=2.2;
      ctx.shadowBlur=10;ctx.shadowColor='rgba(0,255,200,.6)';
      for(var i=0;i<8;i++){
        var a=i/8*TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*(rg[0]-11),Math.sin(a)*(rg[0]-11));
        ctx.lineTo(Math.cos(a)*rg[0],Math.sin(a)*rg[0]);
        ctx.stroke();
      }
      ctx.beginPath();ctx.arc(0,0,rg[0],0,TAU);ctx.stroke();
      ctx.restore();
    });
    ctx.fillStyle=rGrad(0,0,0,18,[[0,'rgba(255,255,255,.95)'],[.4,'rgba(0,255,190,.7)'],[1,'rgba(0,0,0,0)']]);
    ctx.beginPath();ctx.arc(0,0,18*pulse,0,TAU);ctx.fill();
  }else{
    // DREADNOUGHT — the original armoured dodecagon
    ctx.fillStyle=rGrad(0,0,5,65,[[0,'rgba(255,80,60,.95)'],[.5,'rgba(180,20,0,.88)'],[1,'rgba(50,0,0,.55)']]);
    ctx.beginPath();ctx.moveTo(0,-52);ctx.lineTo(28,-36);ctx.lineTo(52,-18);ctx.lineTo(60,8);ctx.lineTo(52,32);ctx.lineTo(28,48);ctx.lineTo(0,52);ctx.lineTo(-28,48);ctx.lineTo(-52,32);ctx.lineTo(-60,8);ctx.lineTo(-52,-18);ctx.lineTo(-28,-36);ctx.closePath();ctx.fill();
    ctx.fillStyle=rGrad(0,0,0,18,[[0,'rgba(255,220,100,.9)'],[.5,'rgba(255,80,0,.65)'],[1,'rgba(0,0,0,0)']]);
    ctx.beginPath();ctx.arc(0,0,18*pulse,0,TAU);ctx.fill();
  }
}
function drawEnemy(e){
  if(!e.alive)return;
  ctx.save();ctx.translate(e.x,e.y);
  var c=EC[e.type%EC.length];
  var pulse=.82+Math.sin(gs.t*.1)*.18;
  if(e.boss){
    _drawBossBody(e);
    // Boss HP
    var bw=96,bh=5;
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(-bw/2-1,62,bw+2,bh+2);
    var hp_r=e.hp/e.maxhp;
    ctx.fillStyle=hp_r>.5?'rgba(0,255,100,.88)':hp_r>.25?'rgba(255,178,0,.88)':'rgba(255,38,38,.88)';
    ctx.fillRect(-bw/2,63,bw*hp_r,bh);
    ctx.font='bold 8px Share Tech Mono';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.7)';
    ctx.fillText(BOSS_NAMES[(e.btype||0)%BOSS_TYPES],0,63+bh+11);
  } else {
    var eart=ENEMY_ART[e.type%ENEMY_ART.length];
    if(eart&&eart.ready){
      _drawEnemyArt(eart,ENEMY_DRAW_W);
    }else{
    /*
      A flat gradient wedge, hexagon or disc, drawn once and left there, reads
      as a coloured icon rather than a machine. A reactor core and a rim
      highlight are cheap enough to draw on every enemy on screen and are what
      turn a silhouette into something that looks like it is under power.
    */
    var shapePath=function(){
      ctx.beginPath();
      if(e.type%4===0){ctx.moveTo(0,-14);ctx.lineTo(11,8);ctx.lineTo(-11,8);ctx.closePath();}
      else if(e.type%4===1){for(var i=0;i<6;i++){var a=i/6*TAU;ctx.lineTo(Math.cos(a)*14,Math.sin(a)*14);}}
      else if(e.type%4===2){ctx.arc(0,0,12,0,TAU);}
      else{
        // reactor orb — a core ringed by four short claws
        for(var ci=0;ci<4;ci++){
          var ca=ci/4*TAU+Math.PI/4,cx1=Math.cos(ca)*7,cy1=Math.sin(ca)*7,cx2=Math.cos(ca)*15,cy2=Math.sin(ca)*15;
          var cw=Math.cos(ca+Math.PI/2)*2.4,ch=Math.sin(ca+Math.PI/2)*2.4;
          ctx.moveTo(cx1+cw,cy1+ch);ctx.lineTo(cx2,cy2);ctx.lineTo(cx1-cw,cy1-ch);
        }
        ctx.arc(0,0,8,0,TAU);
      }
    };
    ctx.fillStyle=rGrad(-3,-4,2,15,[[0,c+'ff'],[.45,c+'bb'],[1,c+'33']]);
    shapePath();ctx.fill();

    // Reactor core — a small hot point near centre, the one thing that
    // reads as "on" rather than "painted"
    ctx.save();ctx.globalCompositeOperation='lighter';
    var core=rGrad(-1,-1,0,6,[[0,'rgba(255,255,255,.9)'],[.4,c+'cc'],[1,'rgba(0,0,0,0)']]);
    ctx.fillStyle=core;ctx.beginPath();ctx.arc(-1,-1,5.5,0,TAU);ctx.fill();
    ctx.restore();

    // Rim highlight along the upper-left edge, catching light from the same
    // direction the player's own ship and the title's moon are lit from
    ctx.save();shapePath();ctx.clip();
    var rim=lGrad(-13,-13,7,10,[[0,'rgba(255,255,255,.55)'],[.35,'rgba(255,255,255,0)']]);
    ctx.fillStyle=rim;ctx.fillRect(-16,-16,32,32);
    ctx.restore();

    shapePath();
    ctx.shadowBlur=10;ctx.shadowColor=c;
    ctx.strokeStyle=c;ctx.lineWidth=.9;ctx.globalAlpha=.65*pulse;ctx.stroke();
    }
    if(e.maxhp>1){
      var pw=5,pgap=3,tw=e.maxhp*(pw+pgap);
      for(var pi=0;pi<e.maxhp;pi++){
        ctx.globalAlpha=1;ctx.fillStyle=pi<e.hp?c:'rgba(60,60,60,.4)';
        ctx.fillRect(-tw/2+pi*(pw+pgap),17,pw,3);
      }
    }
  }
  ctx.restore();
}

var BCOLS={normal:'rgba(0,195,255,.88)',spread:'rgba(0,210,185,.88)',laser:'rgba(255,200,0,.9)',plasma:'rgba(210,0,245,.9)',missile:'rgba(255,178,58,.9)',beam:'rgba(155,225,255,.9)'};
function drawBullet(b){
  ctx.save();
  if(b.enemy){
    ctx.shadowBlur=7;ctx.shadowColor=b.col||'#ff88aa';ctx.fillStyle=b.col||'#ff88aa';
    ctx.beginPath();ctx.moveTo(b.x,b.y-5);ctx.lineTo(b.x+2.5,b.y+2);ctx.lineTo(b.x,b.y+5);ctx.lineTo(b.x-2.5,b.y+2);ctx.closePath();ctx.fill();
  } else {
    var c=BCOLS[b.type]||BCOLS.normal;
    ctx.shadowBlur=11;ctx.shadowColor=c;ctx.fillStyle=c;
    if(b.type==='plasma'){ctx.beginPath();ctx.arc(b.x,b.y,6,0,TAU);ctx.fill();}
    else if(b.type==='beam'){ctx.fillRect(b.x-2.5,b.y-18,5,20);}
    else{ctx.fillRect(b.x-1.8,b.y-9,3.5,12);}
  }
  ctx.restore();
}

function drawPowerup(pu){
  ctx.save();ctx.translate(pu.x,pu.y);
  var c=PU_COLS[pu.type];var lab=PU_LABS[pu.type];
  var spin=gs.t*.04,bob=Math.sin(gs.t*.07)*3;
  ctx.translate(0,bob);ctx.save();ctx.rotate(spin);
  ctx.strokeStyle=c;ctx.lineWidth=1.4;ctx.shadowBlur=9;ctx.shadowColor=c;ctx.globalAlpha=.55+Math.sin(gs.t*.09)*.2;
  ctx.beginPath();ctx.arc(0,0,13,0,TAU);ctx.stroke();
  ctx.restore();
  var gg=rGrad(0,0,0,9,[[0,'rgba(255,255,255,.95)'],[.3,c+'ee'],[.8,c+'66'],[1,'rgba(0,0,0,0)']]);
  ctx.fillStyle=gg;ctx.shadowBlur=15;ctx.shadowColor=c;
  ctx.beginPath();for(var i=0;i<6;i++){var a=i/6*TAU+spin*.5;if(!i)ctx.moveTo(Math.cos(a)*9,Math.sin(a)*9);else ctx.lineTo(Math.cos(a)*9,Math.sin(a)*9);}
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.88)';ctx.font='bold 6px Share Tech Mono';ctx.textAlign='center';ctx.globalAlpha=1;
  ctx.fillText(lab,0,16);
  ctx.restore();
}

var PU_COLS=['#00ffaa','#ff8800','#4488ff','#ff2244','#ffee00','#ff44ff','#ffaa00','#ccffff'];
var PU_LABS=['SPREAD','LASER','SHIELD','BOMB','SPEED','PLASMA','MISSLE','BEAM'];

/*
  The HUD's tappable areas used to be an inline `pos.x>W-55&&pos.y>H-50` repeated
  in both the touch and the click handler. They are declared once here so the
  drawing and the hit-testing cannot drift apart, which matters now that there
  are three of them.
*/
/*
  Bar heights. The bottom bar was 46 units tall and its three buttons were 36,
  which on a 390pt-wide iPhone — where the canvas is scaled to 0.75 — is a 27pt
  target against Apple's 44pt minimum. The bar is 62 now and the buttons are 60
  square, which lands at 45pt on that phone and above 44 on anything wider.

  It costs 16 units of play area. The ship's lower travel limit moves up by the
  same amount so it never sits underneath a button, which is what keeps a tap
  near the bottom corner unambiguous.
*/
/*
  Bar heights and the type scale.

  Every label in the HUD used to be 7-9px and every value 11-15px. The canvas is
  520 wide and scales to 0.75 on a 390pt iPhone, so those rendered at 5-7pt and
  8-11pt — against Apple's 11pt floor for anything a person has to read. Almost
  nothing in the interface cleared it.

  The fix is not a uniform multiplier, which would not fit. It is a hierarchy:
  three values a player actually reads mid-fight (score, wave, credits) get real
  size, the captions under them shrink to the smallest thing that still reads as
  a label, and two captions are deleted outright — an eight-digit gold number is
  a score without being told, and a row of ship pips is lives.
*/
var HUD_TOP=62,HUD_BOT=62,BTN=60;

// Game units. Multiply by 0.75 for pt on a 390pt-wide iPhone.
var TYPE={
  hero  :22,   // 16.5pt — the score
  value :17,   // 12.8pt — wave, credits
  strong:15,   // 11.3pt — weapon name, combo
  label :10,   //  7.5pt — static captions that never change and are read by position
};

var HUDZ={
  pause:{x:8,         y:H-BTN-1,w:BTN,h:BTN},
  bomb :{x:W-BTN*2-16,y:H-BTN-1,w:BTN,h:BTN},
  vol  :{x:W-BTN-8,   y:H-BTN-1,w:BTN,h:BTN}
};

/*
  The title screen draws its mute glyph inset from the corner bracket rather
  than in the corner, so its tap zone is its own rather than the in-game one.
*/
var TITLE_VOL={x:W-BTN-14,y:H-BTN-24,w:BTN,h:BTN};
function _titleVolHit(pos){
  return pos.x>=TITLE_VOL.x&&pos.x<=TITLE_VOL.x+TITLE_VOL.w&&
         pos.y>=TITLE_VOL.y&&pos.y<=TITLE_VOL.y+TITLE_VOL.h;
}
function _hudHit(pos){
  for(var k in HUDZ){
    var z=HUDZ[k];
    if(pos.x>=z.x&&pos.x<=z.x+z.w&&pos.y>=z.y&&pos.y<=z.y+z.h)return k;
  }
  return null;
}
function _hudBtn(z,glyph,label,col,on){
  ctx.save();
  ctx.globalAlpha=on?.92:.34;
  ctx.fillStyle='rgba(0,8,26,.62)';ctx.fillRect(z.x,z.y,z.w,z.h);
  ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.strokeRect(z.x,z.y,z.w,z.h);
  ctx.textAlign='center';
  ctx.font='20px serif';ctx.fillStyle=col;
  ctx.fillText(glyph,z.x+z.w/2,z.y+(label?32:38));
  if(label){
    ctx.font='bold '+TYPE.label+'px Share Tech Mono';ctx.fillStyle=col;
    ctx.fillText(label,z.x+z.w/2,z.y+48);
  }
  ctx.restore();
}

function drawHUD(){
  // Top bar
  ctx.fillStyle='rgba(0,3,16,.82)';ctx.fillRect(0,0,W,HUD_TOP);
  var tl=ctx.createLinearGradient(0,HUD_TOP,W,HUD_TOP);tl.addColorStop(0,'rgba(0,0,0,0)');tl.addColorStop(.3,'rgba(0,160,255,.3)');tl.addColorStop(.7,'rgba(0,160,255,.3)');tl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.strokeStyle=tl;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(0,HUD_TOP);ctx.lineTo(W,HUD_TOP);ctx.stroke();

  // Score — the hero number. Its caption is gone: eight gold digits are a score.
  ctx.save();ctx.shadowBlur=10;ctx.shadowColor='rgba(255,200,0,.55)';
  ctx.font='bold '+TYPE.hero+'px Orbitron';ctx.textAlign='left';ctx.fillStyle='rgba(255,218,48,.96)';
  ctx.fillText(String(gs.score).padStart(8,'0'),14,30);ctx.restore();

  /*
    Lives sit under the score rather than beside it. They used to be a captioned
    row starting at x=120 that ran under the centred WAVE readout at 8 lives.
    Below the score they have the whole left third to themselves and no cap is
    needed for layout — only as insurance against a value the game cannot
    currently produce.
  */
  var livesShown=Math.min(Math.max(0,gs.lives),CAP.lives);
  for(var i=0;i<livesShown;i++){
    ctx.save();ctx.translate(20+i*15,48);ctx.scale(.24,.24);
    ctx.fillStyle='rgba(90,160,255,.9)';ctx.shadowBlur=8;ctx.shadowColor='rgba(90,165,255,.75)';
    ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(8,-4);ctx.lineTo(15,10);ctx.lineTo(0,14);ctx.lineTo(-15,10);ctx.lineTo(-8,-4);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  if(gs.lives>livesShown){
    ctx.font='bold '+TYPE.label+'px Share Tech Mono';ctx.fillStyle='rgba(120,180,255,.85)';ctx.textAlign='left';
    ctx.fillText('+'+(gs.lives-livesShown),20+livesShown*15,52);
  }

  // Wave and sector
  ctx.save();ctx.shadowBlur=10;ctx.shadowColor='rgba(150,0,255,.55)';
  ctx.font='bold '+TYPE.value+'px Orbitron';ctx.textAlign='center';ctx.fillStyle='rgba(190,110,255,.95)';
  ctx.fillText('WAVE '+gs.wave,W/2,30);ctx.restore();
  ctx.font=TYPE.label+'px Share Tech Mono';ctx.fillStyle='rgba(140,80,200,.7)';ctx.textAlign='center';
  ctx.fillText('SECTOR '+sectorOf(gs.wave),W/2,48);

  // Credits
  ctx.save();
  ctx.font='bold '+TYPE.value+'px Orbitron';ctx.textAlign='right';
  ctx.fillStyle='rgba(255,220,50,.92)';ctx.shadowBlur=8;ctx.shadowColor='rgba(255,190,0,.55)';
  ctx.fillText(String(gs.credits),W-14,30);ctx.restore();
  ctx.font=TYPE.label+'px Share Tech Mono';ctx.fillStyle='rgba(210,175,40,.7)';ctx.textAlign='right';
  ctx.fillText('CREDITS',W-14,48);
  // Bottom bar
  ctx.fillStyle='rgba(0,3,16,.82)';ctx.fillRect(0,H-HUD_BOT,W,HUD_BOT);
  var bl=ctx.createLinearGradient(0,H-HUD_BOT,W,H-HUD_BOT);bl.addColorStop(0,'rgba(0,0,0,0)');bl.addColorStop(.3,'rgba(0,160,255,.25)');bl.addColorStop(.7,'rgba(0,160,255,.25)');bl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.strokeStyle=bl;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(0,H-HUD_BOT);ctx.lineTo(W,H-HUD_BOT);ctx.stroke();
  // Weapon
  var wmap={normal:'#88ffff',spread:'#00ffaa',laser:'#ff8800',plasma:'#ff44ff',missile:'#ffaa00',beam:'#ccffff'};
  var wc=wmap[gs.weapon]||'#88ffff';
  ctx.font=TYPE.label+'px Share Tech Mono';ctx.fillStyle='rgba(0,140,190,.6)';ctx.textAlign='left';ctx.fillText('WEAPON',78,H-42);
  ctx.save();ctx.shadowBlur=7;ctx.shadowColor=wc;ctx.font='bold '+TYPE.strong+'px Share Tech Mono';ctx.fillStyle=wc;ctx.fillText(gs.weapon.toUpperCase(),78,H-22);ctx.restore();
  if(gs.weaponT>0){
    // was `/600` against a duration that upgrades push past 600, so a fresh
    // powerup drew a bar wider than its own track
    var wr=clamp(gs.weaponT/(gs.weaponTMax||600),0,1);
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(78,H-17,96,3);
    ctx.fillStyle=wc;ctx.fillRect(78,H-17,96*wr,3);
  }
  // Shield bar
  if(gs.player.shield>0){
    // same overflow as the weapon gauge: SHIELD+ takes the charge to 640
    var sr=clamp(gs.player.shield/(gs.player.shieldMax||320),0,1);
    ctx.font=TYPE.label+'px Share Tech Mono';ctx.textAlign='center';ctx.fillStyle='rgba(0,190,255,.7)';ctx.fillText('SHIELD',W/2,H-44);
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(W/2-44,H-38,88,3);
    ctx.fillStyle='rgba(0,175,255,.8)';ctx.fillRect(W/2-44,H-38,88*sr,3);
  }
  /*
    Combo. This was centred in the bottom bar at the same coordinates as the
    shield gauge and drew straight over it. Moving it into the play field traded
    that for an overlap with the ship's own shield ring — the player can fly
    anywhere, so no position in the field is safe. It sits in the bar instead,
    on its own row below the shield gauge, where nothing else can reach it.
  */
  if(gs.combo>1){
    ctx.save();ctx.translate(W/2,H-16);ctx.textAlign='center';
    var big=gs.combo>=5;
    ctx.font='bold '+(big?TYPE.hero-4:TYPE.strong)+'px Orbitron';
    var cg=ctx.createLinearGradient(-52,0,52,0);
    cg.addColorStop(0,'#ff8800');cg.addColorStop(.5,'#ffff00');cg.addColorStop(1,'#ff8800');
    ctx.fillStyle=cg;ctx.shadowBlur=big?16:10;ctx.shadowColor='rgba(255,200,0,.65)';
    ctx.fillText('x'+gs.combo+' COMBO',0,0);
    ctx.restore();
  }
  // On-canvas controls. These are the only controls a phone has, so they are
  // drawn at a thumb-sized target rather than as icon glyphs.
  _hudBtn(HUDZ.pause,'⏸','PAUSE','rgba(0,190,240,.9)',true);
  _hudBtn(HUDZ.bomb,'💣','x'+(gs.bombs||0),'rgba(255,140,60,.95)',(gs.bombs||0)>0);
  _hudBtn(HUDZ.vol,_muted?'🔇':'🔊','',_muted?'rgba(255,90,110,.8)':'rgba(0,190,240,.8)',true);
}

// ─── TITLE SCREEN ─────────────────────────────────────────────────────────────
/*
  Shrink a font size until the text fits the width it is given. Canvas has no
  equivalent of CSS's max-width, so the alternative is a hardcoded size that is
  correct for exactly one string in exactly one font — and wrong the moment the
  webfont has not loaded yet, which is every first paint.
*/
function _fitPx(text,weight,family,maxW,startPx){
  var px=startPx;
  ctx.font=weight+' '+px+'px '+family;
  while(px>12&&ctx.measureText(text).width>maxW){
    px-=1;
    ctx.font=weight+' '+px+'px '+family;
  }
  return px;
}

// ─── TITLE SCREEN ─────────────────────────────────────────────────────────────
var _titleEn=[];
/*
  Two depth bands rather than one evenly-spaced row. The old flyby was six
  ships in a single line at one size and one speed — a conveyor belt. A near
  band of four, brighter and faster, flying a shallow V, with a far band of
  five smaller and dimmer trailing above them, reads as a squadron with depth
  instead of a loop.
*/
function initTitleEn(){
  _titleEn=[];
  var near=[[-40,2],[40,2],[-98,28],[98,28]];
  near.forEach(function(o,i){
    _titleEn.push({x:-140-i*80,ox:o[0],oy:o[1],y:0,type:i%6,alive:true,boss:false,maxhp:1,hp:1,band:'near',ph:rand(0,TAU)});
  });
  var far=[-150,-90,-30,30,90];
  far.forEach(function(ox,i){
    _titleEn.push({x:-280-i*60,ox:ox,oy:-44,y:0,type:(i+2)%6,alive:true,boss:false,maxhp:1,hp:1,band:'far',ph:rand(0,TAU)});
  });
}
initTitleEn();

/*
  Embers drifting up from the wordmark and off the hero ship's engine. Kept
  entirely separate from gs.parts: update() only advances particles while
  gs.phase==='playing', so anything pushed into gs.parts while the title is up
  would sit frozen forever. This one is self-contained — spawned, stepped and
  drawn right here, every frame, regardless of phase.
*/
var _titleEmbers=[];
function _titleEmberTick(x,y,col,vyBias){
  if(_titleEmbers.length>40)return;
  _titleEmbers.push({x:x+rand(-4,4),y:y+rand(-2,2),vx:rand(-.3,.3),vy:(vyBias||0)+rand(-1.3,-.5),r:rand(.8,2.2),col:col,life:1,dec:rand(.006,.012)});
}
function _drawTitleEmbers(){
  var alive=[];
  _titleEmbers.forEach(function(p){
    p.x+=p.vx;p.y+=p.vy;p.vy*=.994;p.life-=p.dec;
    if(p.life>0){
      ctx.save();ctx.globalAlpha=Math.min(1,p.life*1.7);ctx.fillStyle=p.col;ctx.shadowBlur=6;ctx.shadowColor=p.col;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();ctx.restore();
      alive.push(p);
    }
  });
  _titleEmbers=alive;
}

/*
  Small icon chips for the feature list, styled like the game's own HUD
  buttons (filled panel, coloured stroke, glyph) rather than a plain bulleted
  line — the list should read as part of the same product as the game under
  it, not as a README rendered on top of art.
*/
var FEAT_CHIPS=[
  {glyph:'✦',label:function(){return '6 WEAPON TYPES';},col:'#00ffaa'},
  {glyph:'▲',label:function(){return FORMS.length+' ENEMY FORMATIONS';},col:'#ffb347'},
  {glyph:'☠',label:function(){return BOSS_TYPES+' BOSS TYPES';},col:'#ff5064'},
  {glyph:'⚡',label:function(){return 'COMBO SYSTEM';},col:'#22d3ff'},
  {glyph:'★',label:function(){return ACHS.length+' ACHIEVEMENTS';},col:'#c882ff'}
];

function drawTitle(){
  // Vignette
  ctx.fillStyle=rGrad(W/2,H/2,80,W*.75,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,22,.65)']]);
  ctx.fillRect(0,0,W,H);

  // Corner brackets
  var ba=.38+Math.sin(gs.t*.04)*.12;
  [[16,16,W-16,H-16,26],[24,24,W-24,H-24,16]].forEach(function(bk,ii){
    ctx.strokeStyle='rgba(0,195,255,'+(ba*(ii?0.45:1))+')';ctx.lineWidth=1.4;
    var x1=bk[0],y1=bk[1],x2=bk[2],y2=bk[3],s=bk[4];
    ctx.beginPath();ctx.moveTo(x1+s,y1);ctx.lineTo(x1,y1);ctx.lineTo(x1,y1+s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x2-s,y1);ctx.lineTo(x2,y1);ctx.lineTo(x2,y1+s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x1+s,y2);ctx.lineTo(x1,y2);ctx.lineTo(x1,y2-s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x2-s,y2);ctx.lineTo(x2,y2);ctx.lineTo(x2,y2-s);ctx.stroke();
  });

  /*
    Background squadron — small, dim, well above where the wordmark and hero
    ship sit, so it reads as depth rather than competing with them. The near
    band is brighter and quicker than the far one, which is the whole cue.
  */
  var formY=H*.108;
  _titleEn.forEach(function(e){
    var near=e.band==='near';
    e.x+=near?.62:.4;
    if(e.x>W+180)e.x=-320-rand(0,90);
    e.ph+=near?.018:.012;
    e.y=formY+e.oy+Math.sin(e.ph)*(near?5:3.5);
    var savedX=e.x; e.x=savedX+e.ox;
    ctx.save();ctx.globalAlpha=near?.58:.26;
    drawEnemy(e);
    ctx.restore();
    e.x=savedX;
  });

  /*
    The wordmark is fitted rather than fixed. It was two lines of `900 72px
    Orbitron`, and "STRIKER" at that size is wider than the 520-unit canvas —
    the final R was cut off by the edge. It also has to survive the first paint
    before the webfont loads, when the fallback serif is wider still.
  */
  var markW=W-52;
  var vPx=_fitPx('VOID','900','Orbitron',markW,72);
  var sPx=_fitPx('STRIKER','900','Orbitron',markW,72);
  var markTopY=H*.27-vPx*.78, markBottom=H*.27+sPx*1.06;

  // A faint hex halo breathing behind the lockup — cheap, and it gives the
  // glow somewhere to radiate from instead of just haloing the letterforms.
  ctx.save();
  var hexA=.10+Math.sin(gs.t*.02)*.04;
  ctx.strokeStyle='rgba(80,180,255,'+hexA+')';ctx.lineWidth=1.2;
  [1,.72].forEach(function(sc,hi){
    var hr=(markW*.62)*sc, rot=gs.t*(hi?-.0026:.0018);
    ctx.beginPath();
    for(var i=0;i<=6;i++){var a=i/6*TAU+rot;var px=W/2+Math.cos(a)*hr,py=(markTopY+markBottom)/2+Math.sin(a)*hr*.62;if(!i)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
    ctx.closePath();ctx.stroke();
  });
  ctx.restore();

  ctx.save();
  ctx.shadowColor='rgba(0,210,255,.9)';ctx.shadowBlur=52+Math.sin(gs.t*.04)*16;
  ctx.textAlign='center';
  ctx.font='900 '+vPx+'px Orbitron';
  ctx.fillStyle=lGrad(W/2-markW/2,0,W/2+markW/2,0,[[0,'#0088ee'],[.35,'#00d8ff'],[.5,'#fff'],[.65,'#00d8ff'],[1,'#0088ee']]);
  ctx.fillText('VOID',W/2,H*.27);
  ctx.restore();

  ctx.save();
  ctx.shadowColor='rgba(140,40,255,.9)';ctx.shadowBlur=52+Math.sin(gs.t*.05+1)*15;
  ctx.textAlign='center';
  ctx.font='900 '+sPx+'px Orbitron';
  ctx.fillStyle=lGrad(W/2-markW/2,0,W/2+markW/2,0,[[0,'#4400cc'],[.3,'#9922ff'],[.5,'#bb88ff'],[.7,'#9922ff'],[1,'#4400cc']]);
  ctx.fillText('STRIKER',W/2,markBottom);
  ctx.restore();

  /*
    A holographic sweep: a bright diagonal band crossing the whole lockup once
    every few seconds. Clipped to the wordmark's own box and composited with
    'lighter' so it brightens the letters it crosses instead of painting over
    them — the difference between a projection and a sticker.
  */
  ctx.save();
  ctx.beginPath();ctx.rect(0,markTopY-6,W,markBottom-markTopY+16);ctx.clip();
  ctx.globalCompositeOperation='lighter';
  var sweepT=(gs.t%210)/210;
  var sx=-W*.3+sweepT*(W*1.6);
  var sg=lGrad(sx-46,0,sx+46,0,[[0,'rgba(150,220,255,0)'],[.5,'rgba(190,235,255,.5)'],[1,'rgba(150,220,255,0)']]);
  ctx.fillStyle=sg;ctx.fillRect(sx-46,markTopY-6,92,markBottom-markTopY+16);
  ctx.restore();

  // A slow trickle of embers off the base of the lockup
  if(gs.t%3===0)_titleEmberTick(W/2+rand(-markW*.3,markW*.3),markBottom-4,Math.random()<.5?'#5fd8ff':'#b98cff',-.2);

  // Tagline
  var ta=Math.sin(gs.t*.06)*.16+.62;
  ctx.font=TYPE.label+'px Share Tech Mono';ctx.textAlign='center';
  ctx.fillStyle='rgba(0,185,255,'+ta+')';ctx.shadowBlur=8;ctx.shadowColor='rgba(0,180,255,.4)';
  ctx.fillText('★  DEEP SPACE EDITION  ★',W/2,markBottom+22);ctx.shadowBlur=0;

  /*
    Hero ship. The gap between the tagline and the TAP button used to be dead
    air — roughly a third of the screen with nothing in it. The player's own
    ship sits there now, large, banking gently, thrust flowing down toward the
    button below it: the one piece of "key art" the composition was missing,
    built from the same drawShipBody() the live game uses rather than a
    separate asset that could drift from what the ship actually looks like.
  */
  var heroY=markBottom+88, heroScale=1.7, tilt=Math.sin(gs.t*.011)*.04-.015;
  ctx.save();
  ctx.translate(W/2,heroY);
  ctx.save();ctx.globalCompositeOperation='lighter';
  var heroGlow=rGrad(0,-6,0,86,[[0,'rgba(100,160,255,.32)'],[.5,'rgba(70,110,255,.12)'],[1,'rgba(0,0,0,0)']]);
  ctx.fillStyle=heroGlow;ctx.beginPath();ctx.arc(0,-6,86,0,TAU);ctx.fill();
  ctx.restore();
  ctx.rotate(tilt);
  ctx.scale(heroScale,heroScale);
  drawShipBody(gs.t*.22);
  ctx.restore();
  // Engine embers, spawned at the (rotated, scaled) world position of the
  // thruster tip rather than at the ship's own translate origin.
  var engLocalY=27*heroScale;
  var engX=W/2-Math.sin(tilt)*engLocalY, engY=heroY+Math.cos(tilt)*engLocalY;
  if(gs.t%2===0)_titleEmberTick(engX,engY,Math.random()<.6?'#bfe6ff':'#6fb8ff',1.1);

  _drawTitleEmbers();

  /*
    Feature chips. Five lines of 9px bullet text, centred with a bullet each so
    they zig-zagged, is a README rendered on a canvas. These are small filled
    chips in the same visual language as the game's own HUD buttons — a
    coloured stroke, a glyph, a label — so the title screen and the game it is
    the door to look like one product.
  */
  var chipW=Math.min(320,W-72), chipH=25, chipGap=6;
  var chipX=W/2-chipW/2, chipY=heroY+72;
  ctx.save();
  ctx.fillStyle='rgba(0,8,22,.42)';
  ctx.fillRect(chipX-10,chipY-10,chipW+20,FEAT_CHIPS.length*(chipH+chipGap)-chipGap+20);
  ctx.strokeStyle='rgba(0,150,200,.28)';ctx.lineWidth=1;
  ctx.strokeRect(chipX-10,chipY-10,chipW+20,FEAT_CHIPS.length*(chipH+chipGap)-chipGap+20);
  ctx.restore();
  FEAT_CHIPS.forEach(function(f,i){
    var cy=chipY+i*(chipH+chipGap);
    var pulse=.7+Math.sin(gs.t*.05+i*.7)*.22;
    ctx.save();
    ctx.fillStyle='rgba(4,12,26,.6)';ctx.fillRect(chipX,cy,chipW,chipH);
    ctx.strokeStyle=f.col+'';ctx.globalAlpha=.55;ctx.lineWidth=1;ctx.strokeRect(chipX,cy,chipW,chipH);
    ctx.globalAlpha=1;
    ctx.fillStyle=f.col;ctx.globalAlpha=.85;ctx.fillRect(chipX,cy,4,chipH);
    ctx.globalAlpha=1;
    ctx.shadowBlur=6*pulse;ctx.shadowColor=f.col;
    ctx.font='13px Share Tech Mono';ctx.textAlign='center';ctx.fillStyle=f.col;
    ctx.fillText(f.glyph,chipX+24,cy+chipH/2+5);
    ctx.shadowBlur=0;
    ctx.font=(TYPE.strong-2)+'px Share Tech Mono';ctx.textAlign='left';ctx.fillStyle='rgba(210,230,255,.92)';
    ctx.fillText(f.label(),chipX+42,cy+chipH/2+4);
    ctx.restore();
  });
  var chipsBottom=chipY+FEAT_CHIPS.length*(chipH+chipGap)-chipGap+10;

  // Personal best, compact, sitting right above the button — this is the
  // room that was missing when it was drawn below the button instead: the
  // stacked wordmark, ship and chip panel already spend most of the canvas's
  // 720 units, and the button has to be the last thing before the margin.
  var bestY=chipsBottom+22;
  if(_best&&_best.s>0){
    ctx.save();ctx.textAlign='center';
    ctx.font=TYPE.label+'px Share Tech Mono';ctx.fillStyle='rgba(255,215,60,.85)';ctx.shadowBlur=6;ctx.shadowColor='rgba(255,190,0,.4)';
    ctx.fillText('YOUR BEST   '+String(_best.s).padStart(8,'0')+'  ·  WAVE '+_best.w,W/2,bestY);
    ctx.restore();
  }

  // Tap prompt — a real button, at the game's own control height
  var pa=Math.sin(gs.t*.08)*.26+.74;
  ctx.save();
  var bw=236,bh=50,bx=W/2-bw/2,by=Math.max(H*.79,bestY+18);
  ctx.fillStyle='rgba(0,10,28,.6)';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='rgba(0,195,255,'+(pa*.6)+')';ctx.lineWidth=1.4;ctx.strokeRect(bx,by,bw,bh);
  var scanX=((gs.t*2.5)%bw);ctx.fillStyle='rgba(0,200,255,.08)';ctx.fillRect(bx+scanX-24,by,24,bh);
  ctx.font='bold '+TYPE.strong+'px Orbitron';ctx.textAlign='center';
  ctx.fillStyle='rgba(0,235,255,'+pa+')';ctx.shadowBlur=14;ctx.shadowColor='rgba(0,200,255,.7)';
  ctx.fillText('TAP TO START',W/2,by+33);
  ctx.restore();

  /*
    Volume and menu. Both used to sit at the very corners, on top of the
    animated corner brackets — the mute glyph and the bottom-right bracket drew
    through each other. They are inset past the brackets now.
  */
  ctx.save();ctx.font='20px serif';ctx.textAlign='right';ctx.globalAlpha=.6;
  ctx.fillText(_muted?'🔇':'🔊',W-42,H-44);ctx.restore();
  ctx.save();ctx.font='bold '+TYPE.label+'px Share Tech Mono';ctx.fillStyle='rgba(0,170,210,.6)';
  ctx.textAlign='right';ctx.fillText('☰  MENU',W-46,56);ctx.restore();
}

  {id:'pierce',name:'CHAIN SHOT',   desc:'Bullets pierce +1',    icon:'🔗',  col:'#aa44ff', basePrice:70,  apply:function(){gs.pierce=Math.min(CAP.pierce,(gs.pierce||0)+1);}},

];

// Track how many times each upgrade has been bought to scale price
var _upgBought={};

function getUpgradePrice(upg){
  /*
    `times` was computed here and then left out of the return, so every repeat
    purchase cost the same and stacking one upgrade was strictly the best play.
    It now escalates 35% per repeat, which is what the comment always claimed.
  */
  var times=_upgBought[upg.id]||0;
  return Math.round(upg.basePrice*Math.pow(1.05,gs.wave-1)*Math.pow(1.35,times));
}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function getUpgrades(){return shuffle(ALL_UPG.slice()).slice(0,3);}

function drawUpgradeShop(){
  // Dark overlay
  ctx.fillStyle='rgba(0,2,18,.96)';ctx.fillRect(0,0,W,H);

  // Header
  ctx.save();
  ctx.shadowBlur=20;ctx.shadowColor='rgba(0,200,255,.7)';
  ctx.font='bold 20px Orbitron';ctx.textAlign='center';ctx.fillStyle='#00e5ff';
  ctx.fillText('UPGRADE STATION',W/2,54);ctx.restore();

  ctx.save();
  ctx.font='bold '+TYPE.value+'px Orbitron';ctx.textAlign='center';
  ctx.fillStyle='#ffdd44';ctx.shadowBlur=10;ctx.shadowColor='rgba(255,200,0,.6)';
  ctx.fillText(gs.credits+' CREDITS',W/2,82);ctx.restore();

  ctx.font=TYPE.label+'px Share Tech Mono';ctx.textAlign='center';ctx.fillStyle='rgba(0,155,200,.6)';
  ctx.fillText('WAVE '+gs.wave+' COMPLETE  ·  TAP A CARD TO BUY',W/2,100);

  /*
    One column, always. There used to be two layouts — three columns, falling
    back to a stack once the canvas was scaled below 0.82 — and the three-column
    version put the upgrade name at 7px and its description at 6.5px, which is
    5pt on a phone. The stack was strictly the more readable of the two on every
    size the game is actually played at, so it is the only one now.
  */
  var m=18,rh=96,rgap=14,ry=Math.floor(H*.20);
  gs._upgCards=[];

  gs.upgChoices.forEach(function(c,i){
    var x=m,y=ry+i*(rh+rgap),w=W-m*2;
    gs._upgCards.push({x:x,y:y,w:w,h:rh});
    var price=getUpgradePrice(c),canAfford=gs.credits>=price;
    var pulse=.75+Math.sin(gs.t*.09+i*1.4)*.18,alpha=canAfford?1:.45;

    ctx.save();ctx.globalAlpha=alpha;
    ctx.shadowBlur=canAfford?(16+pulse*8):6;ctx.shadowColor=c.col;
    ctx.fillStyle='rgba(0,5,20,.97)';ctx.strokeStyle=c.col;ctx.lineWidth=canAfford?2:1;
    ctx.fillRect(x,y,w,rh);ctx.strokeRect(x,y,w,rh);
    ctx.fillStyle=c.col;ctx.globalAlpha=canAfford?.7:.25;
    ctx.fillRect(x,y,5,rh);ctx.globalAlpha=alpha;

    // Index and icon, stacked in their own column on the left
    ctx.shadowBlur=10;ctx.shadowColor=c.col;
    ctx.font='bold 24px Orbitron';ctx.textAlign='center';ctx.fillStyle=c.col;
    ctx.fillText(String(i+1),x+38,y+40);
    ctx.shadowBlur=0;ctx.font='28px serif';
    ctx.fillText(c.icon,x+38,y+78);

    ctx.textAlign='left';
    ctx.font='bold '+(TYPE.value-1)+'px Orbitron';ctx.fillStyle=c.col;
    ctx.shadowBlur=5;ctx.shadowColor=c.col;
    ctx.fillText(c.name,x+74,y+42);
    ctx.shadowBlur=0;ctx.font=(TYPE.strong-2)+'px Share Tech Mono';
    ctx.fillStyle='rgba(195,220,255,.88)';
    ctx.fillText(c.desc,x+74,y+68);

    ctx.textAlign='right';
    ctx.font='bold '+(TYPE.hero-4)+'px Orbitron';ctx.fillStyle=canAfford?'#ffdd44':'#ff4466';
    ctx.shadowBlur=canAfford?7:0;ctx.shadowColor='rgba(255,210,0,.6)';
    ctx.fillText(price+' CR',x+w-18,y+46);
    if(!canAfford){
      ctx.shadowBlur=0;ctx.font=TYPE.label+'px Share Tech Mono';ctx.fillStyle='rgba(255,70,90,.85)';
      ctx.fillText('NOT ENOUGH',x+w-18,y+70);
    }
    ctx.restore();
  });

  /*
    Skip. This was a 28-unit strip of 8px text at 35% opacity — a 21pt-tall,
    3pt, nearly invisible target for the one control that lets a player leave
    the screen. It is a real button now, at the same 60-unit height as the rest
    of the game's controls.
  */
  var skipH=56,skipW=W*.62,skipX=(W-skipW)/2,skipY=H-skipH-26;
  ctx.save();
  ctx.fillStyle='rgba(0,10,26,.8)';ctx.fillRect(skipX,skipY,skipW,skipH);
  ctx.strokeStyle='rgba(0,170,215,.5)';ctx.lineWidth=1.4;ctx.strokeRect(skipX,skipY,skipW,skipH);
  ctx.textAlign='center';
  ctx.font='bold '+TYPE.strong+'px Orbitron';ctx.fillStyle='rgba(120,215,255,.92)';
  ctx.fillText('CONTINUE  →',W/2,skipY+24);
  ctx.font=TYPE.label+'px Share Tech Mono';ctx.fillStyle='rgba(0,160,200,.6)';
  ctx.fillText('KEEP YOUR CREDITS',W/2,skipY+42);
  ctx.restore();

  gs._skipCard={x:skipX,y:skipY,w:skipW,h:skipH};
}

function _closeShop(){
  gs.upgradePhase=false;gs.upgChoices=null;gs._upgCards=null;gs._skipCard=null;
  // Drop the shop's floats so they don't drift up through the wave banner.
  gs.floats=[];
  setTimeout(function(){
    if(gs.phase!=='playing')return;
    gs.enemies=makeEnemyWave(gs.wave);gs.waveClearT=gs.t;gs.waveEnding=false;
  },400);
}

function selectUpgrade(idx){
  if(idx==='skip'){_closeShop();return;}
  var c=gs.upgChoices[idx];if(!c)return;
  var price=getUpgradePrice(c);
  if(gs.credits<price){
    addFloat(W/2,H*.6,'NOT ENOUGH CREDITS','#ff4466',false);
    SFX.shield();return;
  }
  gs.credits-=price;
  _upgBought[c.id]=(_upgBought[c.id]||0)+1;
  c.apply();SFX.upgrade();
  addFloat(W/2,H*.45,c.name+' ACTIVATED',c.col,true);
  // Allow buying again from same shop if credits remain
  // Refresh choices so prices update
  gs.upgChoices=getUpgrades();
  // If can't afford any, auto-close after short delay
  var anyAffordable=gs.upgChoices.some(function(u){return gs.credits>=getUpgradePrice(u);});
  if(!anyAffordable)setTimeout(_closeShop,1200);
}

// ─── FORMATIONS ───────────────────────────────────────────────────────────────
/*
  Regular enemies used to do exactly one thing: drift sideways and reverse at
  the wall. Every wave therefore read the same regardless of its number, and the
  only thing that changed with depth was how fast the wall-bouncing happened.

  Five patterns now cycle by wave. They are movement only — spawn layout, HP and
  fire rate are unchanged — so difficulty still comes from the balance curves
  above and a formation is a change of texture rather than a spike.
*/
var FORMS=['LINE','WEAVE','MARCH','DIVE','ORBIT'];

// Which pattern a wave uses. Waves 1-2 stay flat so the game teaches itself.
function formationFor(wave){
  if(wave<3)return 0;
  var order=[1,2,1,3,2,4,3,1,4,2,3,4];
  return order[(wave-3)%order.length];
}

function _moveEnemy(e){
  var dc=DCFG[gs.difficulty||1],k=BAL.enemyDrift(gs.wave),p=gs.player;
  if(e.fm===1){                                    // WEAVE — sine about the spawn column
    e.ph+=.022*k;
    e.x=clamp(e.ax+Math.sin(e.ph)*e.amp,22,W-22);
    e.y=e.ty+Math.sin(e.ph*.6)*9;
  }else if(e.fm===2){                              // MARCH — the rank steps as one, drops at the wall
    e.x=clamp(e.ax+gs.marchX,22,W-22);
    e.y=e.ty+gs.marchDrop;
  }else if(e.fm===3){                              // DIVE — hold station, peel off, loop back to the top
    if(e.diving){
      e.dvy=Math.min(e.dvy+.16,7.5);
      e.x+=clamp((p.x-e.x)*.014,-2.6,2.6)*k;
      e.y+=e.dvy;
      if(e.y>H+50){e.diving=false;e.y=-40;e.x=e.ax;e.dvy=0;e.diveT=Math.round(rand(150,420));}
    }else{
      e.ph+=.02*k;
      e.x=clamp(e.ax+Math.sin(e.ph)*14,22,W-22);
      e.y=lerp(e.y,e.ty,.06);
      if(--e.diveT<=0){e.diving=true;e.dvy=1.2;}
    }
  }else if(e.fm===4){                              // ORBIT — slow circle about the spawn point
    e.ph+=.019*k;
    e.x=clamp(e.ax+Math.cos(e.ph)*e.amp,22,W-22);
    e.y=e.ty+Math.sin(e.ph)*22;
  }else{                                           // LINE — the original bounce
    e.x+=e.dx*k;
    if(e.x<22||e.x>W-22){e.dx*=-1;e.x=clamp(e.x,22,W-22);}
  }
}

/* MARCH is the one pattern with shared state: the whole rank has to turn on the
   same frame, so the bounds are measured once per frame rather than per enemy. */
function _stepMarch(){
  var live=gs.enemies.filter(function(e){return e.alive&&e.entered&&e.fm===2;});
  if(!live.length)return;
  var k=BAL.enemyDrift(gs.wave)*DCFG[gs.difficulty||1].spdM;
  gs.marchX+=gs.marchDir*.5*k;
  var lo=1e9,hi=-1e9;
  live.forEach(function(e){var x=e.ax+gs.marchX;if(x<lo)lo=x;if(x>hi)hi=x;});
  if(hi>W-30&&gs.marchDir>0){gs.marchDir=-1;gs.marchDrop+=12;}
  else if(lo<30&&gs.marchDir<0){gs.marchDir=1;gs.marchDrop+=12;}
}

// ─── WAVE FACTORY ─────────────────────────────────────────────────────────────
function makeEnemyWave(wave){
  var en=[];var dc=DCFG[gs.difficulty||1];
  gs.marchX=0;gs.marchDir=1;gs.marchDrop=0;
  if(wave%5===0){
    // btype cycles the six boss shapes; it drives the drawing as well as the stats.
    var bt=(Math.floor(wave/5)-1)%BOSS_TYPES;
    var tier=Math.floor((wave-1)/15);                 // each full cycle comes back tougher
    var hp=Math.round((36+bt*12+tier*30)*dc.hpM);
    en.push({x:W/2,y:-110,ty:130,type:0,btype:bt,hp:hp,maxhp:hp,alive:true,boss:true,
      entered:false,st:48,ang:0,dx:(1.6+bt*.2)*dc.spdM,patT:0,pat:0,_raged:false});
  }else{
    var fm=formationFor(wave);
    var cols=Math.min(2+wave,7),rows=Math.min(1+Math.floor(wave/3),4);
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        var tp=Math.floor(rand(0,Math.min(EC.length,1+wave*.6)));
        var hp2=tp>3?2:1;hp2=Math.max(1,Math.round(hp2*dc.hpM));
        var ax=52+c*(412/Math.max(cols-1,1)),ty=HUD_TOP+24+r*58;
        en.push({x:ax,y:-40-r*54,ty:ty,ax:ax,
          fm:fm,ph:(c*.7+r*1.1),amp:26+r*8,
          diving:false,dvy:0,diveT:Math.round(rand(90,420)+c*22),
          entered:false,
          type:tp,hp:hp2,maxhp:hp2,alive:true,boss:false,
          st:Math.round((52+rand(0,44))/dc.fireM),dx:rand(-1,1)*dc.spdM});
      }
    }
  }
  return en;
}

// ─── GAME STATE ───────────────────────────────────────────────────────────────

  phase:'title',score:0,wave:1,lives:5,combo:0,comboTimer:0,difficulty:1,

  weapon:'normal',weaponT:0,shootCD:0,
  bullets:[],enemies:[],parts:[],powerups:[],floats:[],
  stars:makeStars(),flareStars:makeFlareStars(),keys:{},t:0,screenShake:0,
  paused:false,bombs:1,cleanWave:true,banner:null,waveEnding:false,
  marchX:0,marchDir:1,marchDrop:0,
  weaponTMax:600,
  mx:W/2,mactive:false,firebtnHeld:false,prevLives:5,
  waveClearT:0,upgradePhase:false,upgChoices:null,_upgCards:null,
  fireBonus:1,wpnBonus:1,scBonus:1,spdBonus:1,pierce:0,magnet:false,missileN:0,
  achWeapons:{normal:1},achShieldBlocks:0,achHomingFired:0,_miles:{},totalKills:0
};

function _startGame(diff){
  closeAllModals();
  gs.difficulty=(diff!==undefined)?diff:(_sel!==undefined?_sel:1);
  var dc=DCFG[gs.difficulty];
  gs.phase='playing';gs.score=0;gs.wave=1;gs.lives=dc.lives;gs.combo=0;gs.comboTimer=0;
  gs.player={x:W/2,y:H-98,inv:0,shield:0,speedT:0};
  gs.weapon='normal';gs.weaponT=0;gs.shootCD=0;
  gs.bullets=[];gs.enemies=makeEnemyWave(1);gs.parts=[];gs.powerups=[];gs.floats=[];
  gs.t=0;gs.screenShake=0;gs.prevLives=dc.lives;gs.waveClearT=0;
  gs.paused=false;gs.bombs=1;gs.cleanWave=true;gs.banner=null;gs.waveEnding=false;
  gs.marchX=0;gs.marchDir=1;gs.marchDrop=0;gs.weaponTMax=600;
  gs.mactive=false;gs.firebtnHeld=false;_steerId=null;
  gs.upgradePhase=false;gs.upgChoices=null;gs._upgCards=null;
  gs.fireBonus=1;gs.wpnBonus=1;gs.scBonus=1;gs.spdBonus=1;gs.pierce=0;gs.magnet=false;gs.missileN=0;
  gs.credits=0;
  _upgBought={};
  gs.achWeapons={normal:1};gs.achShieldBlocks=0;gs.totalKills=0;gs._miles={};
  SFX.wave();
}
/*
  This used to be `musicStop(); setTimeout(musicStart, 80)`. musicStop clears the
  handle immediately but fades the old bus over 1.5s and only frees its
  oscillators at 1.6s, so the restart 80ms later layered a second full track over
  the first and you heard the theme audibly double and lurch at the start of
  every run. The bed is continuous now; only the intensity changes.
*/
function startGame(diff){
  _startGame(diff);
  musicIntensity(1);
  if(_ready&&!_music&&!_muted)musicStart();
}

// ─── GAMEPLAY HELPERS ─────────────────────────────────────────────────────────
/*
  These were closures inside update(). They are hoisted because the bomb is now a
  consumable that both a button and a key can spend, and a closure redefined every
  frame cannot be called from an input handler — which is exactly why the old `Q`
  handler carried its own divergent copy of the bomb code.
*/
function _spawnPU(x,y){
  if(Math.random()>.32)return false;
  gs.powerups.push({x:x,y:y,vy:1.0,type:Math.floor(rand(0,PU_COLS.length)),life:480,r:14});
  return true;
}

function _onKill(e){
  burst(e.x,e.y,EC[e.type%EC.length],e.boss?44:18,6);ring(e.x,e.y,EC[e.type%EC.length]+'aa');
  if(_spawnPU(e.x,e.y)&&e.boss)_spawnPU(e.x+20,e.y);
  SFX.kill(e.type);if(e.boss)SFX.explode(true);else SFX.explode();
  gs.totalKills++;
  if(gs.totalKills===1)unlock('first');
  if(gs.totalKills>=250)unlock('kills250');
  if(gs.combo>=5)unlock('combo5');
  if(gs.combo>=15)unlock('combo15');
  if(gs.score>=50000)unlock('50k');
  if(gs.score>=250000)unlock('250k');
  if(e.boss)unlock('boss');
  var ms=[10000,25000,50000,100000,200000];
  ms.forEach(function(m){if(gs.score>=m&&!gs._miles[m]){gs._miles[m]=1;addFloat(W/2,H*.28,'\u2605 '+m.toLocaleString(),'#ffee00',true);SFX.power();}});
}

function _applyPU(pu){
  var p=gs.player;
  SFX.power();
  if(pu.type===0){gs.weapon='spread';gs.weaponT=Math.round(580*(gs.wpnBonus||1));gs.achWeapons.spread=1;}
  else if(pu.type===1){gs.weapon='laser';gs.weaponT=Math.round(540*(gs.wpnBonus||1));gs.achWeapons.laser=1;}
  else if(pu.type===2){p.shield=320;p.shieldMax=320;SFX.shield();}
  else if(pu.type===3){gs.bombs=Math.min((gs.bombs||0)+1,CAP.bombs);addFloat(p.x,p.y-34,'+1 BOMB','#ff6622',false);}
  else if(pu.type===4){p.speedT=440;}
  else if(pu.type===5){gs.weapon='plasma';gs.weaponT=Math.round(530*(gs.wpnBonus||1));gs.achWeapons.plasma=1;}
  else if(pu.type===6){gs.weapon='missile';gs.missileN=(gs.missileN||0)+8;gs.weaponT=Math.round(620*(gs.wpnBonus||1));gs.achWeapons.missile=1;}
  else if(pu.type===7){gs.weapon='beam';gs.weaponT=Math.round(470*(gs.wpnBonus||1));gs.achWeapons.beam=1;}
  if(gs.weaponT>0)gs.weaponTMax=gs.weaponT;
  if(Object.keys(gs.achWeapons).length>=5)unlock('weapons');
}

/*
  The bomb used to detonate the instant it was picked up, and `Q` was a second,
  free, unlimited copy of the same effect with no cooldown — three presses cleared
  any wave. It is stock now: the powerup grants one, `Q` or the HUD button spends
  one, and you never hold more than CAP.bombs.
*/
function detonateBomb(){
  if(gs.phase!=='playing'||gs.paused||gs.upgradePhase)return false;
  if(!(gs.bombs>0))return false;
  gs.bombs--;
  gs.bullets=gs.bullets.filter(function(b){return!b.enemy;});
  gs.screenShake=22;SFX.bomb();
  ring(W/2,H/2,'rgba(255,100,0,.8)');burst(W/2,H/2,'rgba(255,140,50,.9)',48,11);
  gs.enemies.forEach(function(e){
    if(!e.alive)return;
    e.hp=Math.max(0,e.hp-3);burst(e.x,e.y,EC[e.type%EC.length],10);
    if(e.hp<=0){e.alive=false;gs.score+=100;_onKill(e);}
  });
  return true;
}

function _hitPlayer(){
  var p=gs.player;
  if(p.shield>0){p.shield=0;gs.screenShake=10;SFX.shield();burst(p.x,p.y,'rgba(0,175,255,.88)',14);ring(p.x,p.y,'rgba(0,195,255,.7)');return;}
  gs.lives--;gs.cleanWave=false;p.inv=130;gs.combo=0;gs.screenShake=16;SFX.explode();
  burst(p.x,p.y,'rgba(70,140,255,.88)',24,6);ring(p.x,p.y,'rgba(0,140,255,.5)');
  if(gs.lives<=0){
    gs.phase='gameover';musicStop();SFX.gameover();
    recordBest(gs.score,gs.wave);
    gs.scrapEarned=awardMeta(gs.score,gs.wave);
    setTimeout(function(){openModal('gameover',buildGameoverHtml(),false);},1600);
  }
}

// ─── UPDATE ───────────────────────────────────────────────────────────────────
function update(){
  if(gs.paused)return;   // freeze the clock too, so nothing drifts while paused
  gs.t++;
  if(!_ready&&gs.t===3)initAC();
  if(gs.phase!=='playing')return;
  if(gs.upgradePhase)return;
  if(gs.screenShake>0)gs.screenShake*=.75;

  var p=gs.player,dc=DCFG[gs.difficulty||1];
  var spd=5.5*dc.spdM*(gs.spdBonus||1)*(p.speedT>0?1.4:1);
  if(gs.keys['ArrowLeft']||gs.keys['a'])p.x=clamp(p.x-spd,22,W-22);
  if(gs.keys['ArrowRight']||gs.keys['d'])p.x=clamp(p.x+spd,22,W-22);
  // Kept clear of both bars, so a tap near the bottom corner is unambiguously
  // a button press and never a steering touch the ship was sitting under.
  var yLo=HUD_TOP+20,yHi=H-HUD_BOT-26;
  if(gs.keys['ArrowUp']||gs.keys['w'])p.y=clamp(p.y-spd*.75,yLo,yHi);
  if(gs.keys['ArrowDown']||gs.keys['s'])p.y=clamp(p.y+spd*.75,yLo,yHi);
  if(gs.mactive)p.x=lerp(p.x,gs.mx,.14);

  if(p.inv>0)p.inv--;if(p.shield>0)p.shield--;if(p.speedT>0)p.speedT--;
  if(gs.weaponT>0){gs.weaponT--;if(!gs.weaponT)gs.weapon='normal';}
  if(gs.shootCD>0)gs.shootCD--;
  if(gs.comboTimer>0){gs.comboTimer--;if(!gs.comboTimer)gs.combo=0;}

  // Fire
  var fire=gs.keys[' ']||gs.keys['z']||gs.firebtnHeld;
  if(fire&&gs.shootCD===0){
    var sp=function(vx,vy,type,pi){
      gs.bullets.push({x:p.x+(vx?14*Math.sign(vx):0),y:p.y-18,vx:vx,vy:vy,type:type||gs.weapon,r:type==='plasma'?11:type==='beam'?12:8,pierce:pi||gs.pierce||0});
    };
    if(gs.weapon==='spread'){sp(-2.8,-11,'spread');sp(0,-13,'spread');sp(2.8,-11,'spread');gs.shootCD=Math.round(8/dc.fireM*(gs.fireBonus||1)*wpnLevelMul('spread'));}
    else if(gs.weapon==='laser'){sp(0,-20,'laser');gs.shootCD=Math.round(4/dc.fireM*(gs.fireBonus||1)*wpnLevelMul('laser'));}
    else if(gs.weapon==='plasma'){sp(-3,-10,'plasma');sp(0,-14,'plasma');sp(3,-10,'plasma');gs.shootCD=Math.round(14/dc.fireM*(gs.fireBonus||1)*wpnLevelMul('plasma'));}
    else if(gs.weapon==='missile'){
      if(gs.missileN>0){
        var tgt=null,bestD=9999;
        gs.enemies.forEach(function(e){if(e.alive){var d=dist(e.x,e.y,p.x,p.y);if(d<bestD){bestD=d;tgt=e;}}});
        gs.bullets.push({x:p.x,y:p.y-18,vx:0,vy:-9,type:'missile',r:9,target:tgt,hstr:.18,pierce:0});
        gs.missileN--;gs.shootCD=Math.round(14/dc.fireM*(gs.fireBonus||1)*wpnLevelMul('missile'));
      }else{sp(0,-14,'normal');gs.shootCD=Math.round(9/dc.fireM*(gs.fireBonus||1));}
    }
    else if(gs.weapon==='beam'){sp(0,-24,'beam');gs.shootCD=Math.round(3/dc.fireM*(gs.fireBonus||1)*wpnLevelMul('beam'));}
    else{sp(0,-14,'normal');gs.shootCD=Math.round(9/dc.fireM*(gs.fireBonus||1));}
    SFX.shoot(gs.weapon);
    if(gs.t%3===0)trail(p.x,p.y+14,'rgba(70,130,255,.6)');
  }

  // Bullet movement
  var bAlive=[];
  gs.bullets.forEach(function(b){
    if(b.target&&b.target.alive){
      var ddx=b.target.x-b.x,ddy=b.target.y-b.y,dd=Math.sqrt(ddx*ddx+ddy*ddy)||1;
      b.vx=lerp(b.vx,ddx/dd*12,b.hstr);b.vy=lerp(b.vy,ddy/dd*12,b.hstr);
    }
    if(b.type==='missile')trail(b.x,b.y,'rgba(255,140,40,.65)');
    b.x+=b.vx;b.y+=b.vy;
    if(b.y>-60&&b.y<H+60&&b.x>-60&&b.x<W+60)bAlive.push(b);
  });
  gs.bullets=bAlive;

  // Enemy bullets are moved by the loop above; they only need culling here.
  gs.bullets=gs.bullets.filter(function(b){return!b.enemy||(b.y<H+30&&b.y>-40);});

  // Powerups
  var puAlive=[];
  gs.powerups.forEach(function(pu){
    if(gs.magnet){var dx=p.x-pu.x,dy=p.y-pu.y,dd=Math.sqrt(dx*dx+dy*dy)||1;if(dd<200){pu.x+=dx/dd*4;pu.y+=dy/dd*4;}}
    pu.y+=pu.vy;pu.life--;
    if(dist(pu.x,pu.y,p.x,p.y)<22){
      _applyPU(pu);burst(pu.x,pu.y,PU_COLS[pu.type],14);ring(pu.x,pu.y,PU_COLS[pu.type]);
    }else if(pu.life>0&&pu.y<H+30)puAlive.push(pu);
  });
  gs.powerups=puAlive;

  // Enemies
  _stepMarch();
  var allDead=true;
  gs.enemies.forEach(function(e){
    if(!e.alive)return;
    allDead=false;
    if(!e.entered){e.y+=2;if(e.y>=e.ty)e.entered=true;return;}

    if(e.boss){
      if(!e._raged&&e.hp/e.maxhp<=.5){e._raged=true;e.dx*=1.7;addFloat(e.x,e.y-55,'RAGE MODE!','#ff2040',true);gs.screenShake=18;SFX.boss();}
      e.patT++;if(e.patT>220){e.pat=(e.pat+1)%3;e.patT=0;}
      var bhw=BOSS_HW[(e.btype||0)%BOSS_TYPES];
      e.x+=Math.sin(gs.t*.016)*e.dx*1.6;e.x=clamp(e.x,bhw,W-bhw);
      e.st--;
      if(e.st<=0){
        e.st=Math.round(BAL.bossFireGap(gs.wave)/dc.fireM)+rand(0,20);
        var sp=BAL.bossBullet(gs.wave)*dc.bulletM;
        if(e.pat===0){var dx=p.x-e.x,dy=p.y-e.y,dd=Math.sqrt(dx*dx+dy*dy)||1;gs.bullets.push({x:e.x,y:e.y,vx:dx/dd*sp,vy:dy/dd*sp,enemy:true,r:7,col:'#ff4488'});}
        else if(e.pat===1){for(var q=-2;q<=2;q++)gs.bullets.push({x:e.x,y:e.y,vx:q*1.4,vy:sp,enemy:true,r:7,col:'#ff8000'});}
        else{for(var q=0;q<8;q++){var qa=q/8*TAU+gs.t*.04;gs.bullets.push({x:e.x,y:e.y,vx:Math.cos(qa)*sp,vy:Math.sin(qa)*sp,enemy:true,r:7,col:'#ff2040'});}}
      }
    }else{
      _moveEnemy(e);
      e.st--;
      if(e.st<=0){
        e.st=Math.round(BAL.enemyFireGap(gs.wave)/dc.fireM)+rand(0,30);
        var dx=p.x-e.x,dy=p.y-e.y,dd=Math.sqrt(dx*dx+dy*dy)||1;
        var sp=BAL.enemyBullet(gs.wave)*dc.bulletM;
        gs.bullets.push({x:e.x,y:e.y,vx:dx/dd*sp,vy:dy/dd*sp,enemy:true,r:7});
      }
      // Player contact
      if(p.inv===0&&dist(e.x,e.y,p.x,p.y)<22){e.alive=false;_hitPlayer();}
    }

    // Bullet vs enemy
    var nBullets=[];
    gs.bullets.filter(function(b){return!b.enemy;}).forEach(function(b){
      var hr=e.boss?42:17;
      if(dist(b.x,b.y,e.x,e.y)<hr+b.r){
        var dmg=b.type==='plasma'?2:b.type==='beam'?3:1;
        e.hp-=dmg;SFX.hit();burst(b.x,b.y,EC[e.type%EC.length],4,2);
        if((b.pierce||0)>0){b.pierce--;nBullets.push(b);}
        else if(b.type==='laser'||b.type==='beam')nBullets.push(b);
        if(e.hp<=0){
          e.alive=false;
          gs.combo++;gs.comboTimer=115;
          var pts=Math.round((e.type+1)*100*(e.boss?12:1)*Math.max(1,gs.combo)*(gs.scBonus||1)*dc.scM);
          gs.score+=pts;
          var ptStr=pts>=1000?(Math.round(pts/100)/10)+'K':String(pts);
          addFloat(e.x,e.y-10,'+'+ptStr,gs.combo>=5?'#ff8800':gs.combo>=3?'#ffee44':'#fff',gs.combo>=3);
          if(gs.combo>1)SFX.comboUp(gs.combo);
          _onKill(e);
        }
      }else{nBullets.push(b);}
    });
    gs.bullets=gs.bullets.filter(function(b){return b.enemy;}).concat(nBullets);
  });

  // Enemy bullets vs player
  if(p.inv===0){
    var ebRemaining=[];
    gs.bullets.filter(function(b){return b.enemy;}).forEach(function(b){
      if(dist(b.x,b.y,p.x,p.y)<15)_hitPlayer();
      else ebRemaining.push(b);
    });
    gs.bullets=gs.bullets.filter(function(b){return!b.enemy;}).concat(ebRemaining);
  }

  // Particles
  var pa=[];
  gs.parts.forEach(function(pt){
    if(pt.type==='ring'){pt.r=lerp(pt.r,pt.maxR,.12);pt.life-=pt.dec;if(pt.life>0)pa.push(pt);}
    else{pt.x+=pt.vx;pt.y+=pt.vy;pt.vx*=.9;pt.vy*=.9;pt.life-=pt.dec;if(pt.life>0)pa.push(pt);}
  });
  gs.parts=pa;

  /*
    `allDead` stays true from the frame the last enemy dies until the next wave
    is spawned a second and a half later, and this ran every one of those ~90
    frames — so one cleared wave advanced the counter by dozens, paid dozens of
    credit awards, and opened the upgrade shop as soon as one of those phantom
    waves happened to land on a multiple of three. `waveEnding` makes the
    transition fire once and stay fired until the next wave actually exists.
  */
  if(allDead&&gs.phase==='playing'&&!gs.waveEnding)_nextWave();

}

function sectorOf(wave){return Math.floor((wave-1)/5)+1;}

function _nextWave(){
  gs.waveEnding=true;
  var clean=gs.cleanWave;
  if(clean&&gs.wave>1)unlock('nohit');
  gs.prevLives=gs.lives;
  gs.cleanWave=true;
  var oldWave=gs.wave;gs.wave++;
  if(gs.wave>=5)unlock('wave5');
  if(gs.wave>=10)unlock('wave10');
  if(gs.wave>=20)unlock('wave20');

  var earned=Math.round(CREDITS_BASE+gs.wave*CREDITS_PER_WAVE);
  if(clean)earned=Math.round(earned*CLEAN_WAVE_BONUS);
  gs.credits+=earned;

  var boss=(gs.wave%5===0);
  SFX.wave();
  // A real transition: a swept banner naming the wave, its sector and what is
  // coming, in place of a score-pop float that scrolled past unread.
  gs.banner={
    t:0,dur:112,
    title:boss?'BOSS INCOMING':'WAVE '+gs.wave,
    sub:'SECTOR '+sectorOf(gs.wave)+'  ·  '+(boss?'PREPARE':FORMS[formationFor(gs.wave)]+' FORMATION'),
    note:'+'+earned+' CREDITS'+(clean?'   CLEAN WAVE +20%':''),
    col:boss?'#ff4060':'#00ffcc'
  };
  if(boss)setTimeout(function(){if(gs.phase==='playing')SFX.boss();},620);

  if(oldWave%3===0){
    gs.upgradePhase=true;gs.upgChoices=getUpgrades();SFX.upgrade();
  }else{
    setTimeout(function(){
      if(gs.phase!=='playing')return;
      gs.enemies=makeEnemyWave(gs.wave);gs.waveClearT=gs.t;gs.waveEnding=false;
    },1500);
  }
}

/* The banner is drawn over the field, not as a modal, so play resumes underneath
   it and the incoming wave is already visible as it fades. */
function drawBanner(){
  var b=gs.banner;if(!b)return;
  b.t++;
  if(b.t>b.dur){gs.banner=null;return;}
  var k=b.t/b.dur;
  // ease in, hold, ease out
  var a=k<.18?(k/.18):k>.72?(1-(k-.72)/.28):1;
  var y=H*.34;
  var sweep=clamp((k<.5?k/.28:1),0,1);
  ctx.save();
  ctx.globalAlpha=a*.85;
  ctx.fillStyle='rgba(0,4,20,.72)';
  ctx.fillRect(0,y-40,W*sweep,86);
  ctx.strokeStyle=b.col;ctx.globalAlpha=a*.75;ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(0,y-40);ctx.lineTo(W*sweep,y-40);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,y+46);ctx.lineTo(W*sweep,y+46);ctx.stroke();
  ctx.globalAlpha=a;
  ctx.textAlign='center';
  ctx.shadowBlur=18;ctx.shadowColor=b.col;
  ctx.font='900 26px Orbitron';ctx.fillStyle=b.col;
  ctx.fillText(b.title,W/2,y);
  ctx.shadowBlur=0;
  ctx.font='9px Share Tech Mono';ctx.fillStyle='rgba(190,220,255,.75)';
  ctx.fillText(b.sub,W/2,y+20);
  ctx.font='9px Share Tech Mono';ctx.fillStyle='rgba(255,210,70,.85)';
  ctx.fillText(b.note,W/2,y+38);
  ctx.restore();
}

// ─── DRAW LOOP ────────────────────────────────────────────────────────────────
function draw(){
  var sx=gs.screenShake>.5?rand(-gs.screenShake,gs.screenShake)*.45:0;
  var sy=gs.screenShake>.5?rand(-gs.screenShake,gs.screenShake)*.35:0;
  ctx.save();if(gs.screenShake>.5)ctx.translate(sx,sy);

  drawBG();

  if(gs.phase==='title'){drawTitle();ctx.restore();return;}
  if(gs.upgradePhase){drawUpgradeShop();ctx.restore();return;}

  // Particles: rings behind
  gs.parts.forEach(function(pt){
    if(pt.type==='ring'){
      ctx.save();ctx.globalAlpha=Math.max(0,pt.life);ctx.strokeStyle=pt.col;ctx.lineWidth=2;ctx.shadowBlur=7;ctx.shadowColor=pt.col;
      ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,TAU);ctx.stroke();ctx.restore();
    }
  });

  if(gs.phase==='playing'||gs.phase==='gameover'){
    gs.powerups.forEach(function(pu){drawPowerup(pu);});
    gs.bullets.forEach(function(b){drawBullet(b);});
    gs.enemies.forEach(function(e){drawEnemy(e);});
    if(gs.phase==='playing')drawShip();
  }

  // Particles: dots on top
  gs.parts.forEach(function(pt){
    if(pt.type!=='ring'){
      ctx.save();ctx.globalAlpha=Math.max(0,pt.life);ctx.fillStyle=pt.col;ctx.shadowBlur=5;ctx.shadowColor=pt.col;
      ctx.beginPath();ctx.arc(pt.x,pt.y,Math.max(.4,pt.r*pt.life),0,TAU);ctx.fill();ctx.restore();
    }
  });

  // Float texts
  gs.floats.forEach(function(ft){
    ctx.save();ctx.globalAlpha=Math.min(1,ft.life*1.8);ctx.shadowBlur=10;ctx.shadowColor=ft.col;ctx.fillStyle=ft.col;
    ctx.font='bold '+ft.sz+'px Orbitron';ctx.textAlign='center';ctx.fillText(ft.txt,ft.x,ft.y);ctx.restore();
    ft.y+=ft.vy;ft.life-=ft.decay;
  });
  gs.floats=gs.floats.filter(function(ft){return ft.life>0;});

  drawBanner();
  drawHUD();
  if(gs.paused){
    // The modal sits over this, but the field still shows around it on a wide
    // screen; dimming makes the paused state unambiguous.
    ctx.fillStyle='rgba(0,2,14,.55)';ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}

// ─── INPUT ────────────────────────────────────────────────────────────────────
window.addEventListener('keydown',function(e){
  gs.keys[e.key]=true;
  if(e.key===' ')e.preventDefault();
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){
    if(gs.phase==='playing'&&!gs.upgradePhase){e.preventDefault();togglePause();}
  }
  if(gs.phase==='title'&&e.key===' '){initAC();openModal('main',buildMainHtml(),false);}
  if(gs.upgradePhase){if(e.key==='1')selectUpgrade(0);if(e.key==='2')selectUpgrade(1);if(e.key==='3')selectUpgrade(2);if(e.key==='4')selectUpgrade('skip');}
  if(e.key==='q'||e.key==='Q'){
    if(!detonateBomb()&&gs.phase==='playing'&&!gs.paused&&!gs.upgradePhase){
      addFloat(gs.player.x,gs.player.y-40,'NO BOMBS','#ff4466',false);
    }
  }
});
window.addEventListener('keyup',function(e){gs.keys[e.key]=false;});

// Touch input
function getCanvasPos(clientX,clientY){
  var r=canvas.getBoundingClientRect();
  return{x:(clientX-r.left)*(W/r.width),y:(clientY-r.top)*(H/r.height)};
}
/*
  Multi-touch.

  All three handlers used to read `e.touches[0]`, which is whichever finger went
  down FIRST and stays first for as long as it is held — not the finger the
  event is about. During play there is always a finger down steering the ship,
  so every subsequent tap was evaluated at the steering finger's position: the
  pause, bomb and volume buttons could not be pressed at all on a touch device.
  `touchend` then cleared the controls unconditionally, so lifting any second
  finger stopped the ship and stopped it firing, and there was no `touchcancel`
  listener at all — a touch cancelled by the system (Control Centre, an incoming
  call) left the ship stuck following and firing with nothing to release it.

  Each finger is now handled on its own terms, from `changedTouches`, and the
  one steering the ship is tracked by identifier so nothing else can disturb or
  release it.
*/
var _steerId=null;

function _touchAt(pos){
  if(gs.paused)return;
  if(gs.phase==='title'){
    if(_titleVolHit(pos)){setMute(!_muted);SFX.menuClick();return;}
    openModal('main',buildMainHtml(),false);return;
  }
  if(gs.phase!=='playing')return;

  if(gs.upgradePhase){
    if(gs._upgCards){
      gs._upgCards.forEach(function(cc,ci){
        if(pos.x>=cc.x-14&&pos.x<=cc.x+cc.w+14&&pos.y>=cc.y-14&&pos.y<=cc.y+cc.h+14)selectUpgrade(ci);
      });
      var sk=gs._skipCard;
      if(sk&&pos.x>=sk.x&&pos.x<=sk.x+sk.w&&pos.y>=sk.y&&pos.y<=sk.y+sk.h)selectUpgrade('skip');
    }
    return 'handled';
  }

  var z=_hudHit(pos);
  if(z==='vol'){setMute(!_muted);SFX.menuClick();return 'handled';}
  if(z==='pause'){pauseGame();return 'handled';}
  if(z==='bomb'){
    if(!detonateBomb())addFloat(gs.player.x,gs.player.y-40,'NO BOMBS','#ff4466',false);
    return 'handled';
  }
  return 'steer';
}

canvas.addEventListener('touchstart',function(e){
  e.preventDefault();initAC();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    var pos=getCanvasPos(t.clientX,t.clientY);
    // A finger that lands on a button presses it and never becomes the steering
    // finger, so tapping one does not yank the ship across the screen.
    if(_touchAt(pos)==='steer'&&_steerId===null){
      _steerId=t.identifier;
      gs.mx=pos.x;gs.mactive=true;gs.firebtnHeld=true;
    }
  }
},{passive:false});

canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(gs.paused||gs.phase!=='playing'||gs.upgradePhase)return;
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier!==_steerId)continue;   // only the steering finger moves the ship
    gs.mx=getCanvasPos(t.clientX,t.clientY).x;gs.mactive=true;
  }
},{passive:false});

function _touchRelease(e){
  if(e&&e.preventDefault)e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier!==_steerId)continue;
    _steerId=null;gs.mactive=false;gs.firebtnHeld=false;
  }
}
canvas.addEventListener('touchend',_touchRelease,{passive:false});
canvas.addEventListener('touchcancel',_touchRelease,{passive:false});

canvas.addEventListener('click',function(ev){
  initAC();
  var pos=getCanvasPos(ev.clientX,ev.clientY);
  if(gs.paused)return;
  if(gs.phase==='title'){
    if(_titleVolHit(pos)){setMute(!_muted);SFX.menuClick();return;}
    openModal('main',buildMainHtml(),false);return;
  }
  if(gs.phase==='playing'){
    if(!gs.upgradePhase){
      var z=_hudHit(pos);
      if(z==='vol'){setMute(!_muted);SFX.menuClick();return;}
      if(z==='pause'){pauseGame();return;}
      if(z==='bomb'){
        if(!detonateBomb())addFloat(gs.player.x,gs.player.y-40,'NO BOMBS','#ff4466',false);
        return;
      }
    }
    if(gs.upgradePhase&&gs._upgCards){
      gs._upgCards.forEach(function(cc,ci){
        if(pos.x>=cc.x-14&&pos.x<=cc.x+cc.w+14&&pos.y>=cc.y-14&&pos.y<=cc.y+cc.h+14)selectUpgrade(ci);
      });
      if(gs._skipCard){var sk=gs._skipCard;if(pos.x>=sk.x&&pos.x<=sk.x+sk.w&&pos.y>=sk.y&&pos.y<=sk.y+sk.h)selectUpgrade('skip');}
    }
  }
});

// expose to onclick attrs, and to the native shim
window.popModal=popModal;
window.pauseGame=pauseGame;
window.resumeGame=resumeGame;
window.togglePause=togglePause;
window.selectDifficulty=function(d){_sel=d;_renderDiffBtns();SFX.menuClick();};
window.startGame=startGame;
window.submitScore=function(){
  var ni=document.getElementById('go-name');var nm=ni?ni.value.trim():'ACE';
  lbAdd(nm,gs.score,gs.wave);SFX.menuClick();
  openModal('lb',buildLBHtml());
};

// ─── LOOP ─────────────────────────────────────────────────────────────────────
buildNebula();
buildMoon();
function loop(){update();draw();requestAnimationFrame(loop);}
loop();

})();
</script>
