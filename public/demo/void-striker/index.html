  border-radius:4px;
  padding:0 52px 44px;
  min-width:320px;max-width:min(480px,90vw);
  max-height:90vh;overflow-y:auto;
  position:relative;text-align:center;font-family:'Share Tech Mono',monospace;
}
/*
  The way out of a screen may not depend on how tall that screen is. Both of
  these used to: the sub-menus put BACK at the very bottom of the content, so
  on a 640-tall phone the Weapons and Achievements screens ended below the
  fold and you had to know to scroll inside the box to find it, and the pilot
  hub had no exit at all — no BACK, and its close button was hidden because it
  opens with closeable:false. This bar is sticky at the top of the scrolling
  box, so whatever the content does, the way out is on screen.
*/
#modal-head{
  position:sticky;top:0;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  /* No negative top margin: it pulls the bar up out of its own flow position
     while `sticky` still pins it to the box's top edge, and the title ends up
     under it. The bar simply is the first row of the box. */
  margin:0 -52px 20px;padding:6px 16px;
  background:#00102a;
  border-bottom:1px solid rgba(0,180,255,0.14);
  min-height:52px;
}
#modal-back{
  display:none;align-items:center;gap:7px;cursor:pointer;
  background:none;border:none;padding:0 12px;margin:0 -12px;
  min-height:44px;min-width:64px;                 /* Apple's 44pt minimum */
  font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:2px;

<div id="wrap"><canvas id="c"></canvas></div>
<div id="modal">
  <div id="modal-box">

<script>
(function(){'use strict';

// ─── CANVAS SETUP ────────────────────────────────────────────────────────────
var W=520,H=720;
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var DPR=Math.min(window.devicePixelRatio||1,3);
canvas.width=W*DPR;canvas.height=H*DPR;
ctx.scale(DPR,DPR);

/*
  The canvas is a fixed 520x720 that gets letterboxed to fit, so a phone does not
  give the game a different layout — it gives it the same layout, smaller. _scale
  records how much smaller, which is what turns a size in game units into a size
  in points: on a 390pt-wide iPhone it is 0.75, so a 60-unit button is 45pt and a
  10-unit caption is 7.5pt. Every type decision in this file is made against it.
*/
var _scale=1;
function resize(){
  _scale=Math.min(window.innerWidth/W,window.innerHeight/H);
  canvas.style.width=Math.floor(W*_scale)+'px';
  canvas.style.height=Math.floor(H*_scale)+'px';
}
resize();
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});

// ─── AUDIO ENGINE ─────────────────────────────────────────────────────────────
var AC=null,_ready=false,_vol=0.65;
var _muted=false;
/*
  Music and effects get their own level. One master slider cannot answer the
  only question that matters when someone says the sound is annoying — which
  half of it — and it cannot let them keep the part they like.
*/
var _volMusic=0.7,_volSfx=0.85;
try{
  _muted=localStorage.getItem('vs_mute')==='1';
  _vol=parseFloat(localStorage.getItem('vs_vol')||'0.65');
  var _sm=localStorage.getItem('vs_vol_music'); if(_sm!==null)_volMusic=parseFloat(_sm);
  var _ss=localStorage.getItem('vs_vol_sfx');   if(_ss!==null)_volSfx=parseFloat(_ss);
}catch(e){}

function initAC(){
  if(_ready)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    _ready=true;
    if(gs.phase==='title')setTimeout(musicStart,200);
  }catch(e){}
}
function _wake(){if(AC&&AC.state==='suspended')AC.resume();}

/* ─── OUTPUT CHAIN ──────────────────────────────────────────────────────────
   Everything used to run into `destination` through a single gain. That is why
   the game turned harsh the moment three things happened at once: the layers
   summed past full scale and the browser clipped them, which is heard as
   grit rather than as loudness. There are three stages now —

       sfx ──> comp ──> shelf ─┐
                               ├──> master ──> limiter ──> destination
       music ──> duck ─────────┘

   a limiter on the end so a bomb landing on a boss's death cannot clip, a
   compressor and a high shelf on the effects so the noise layers stop biting,
   and a duck on the music so an explosion pushes the bed down for a moment
   instead of fighting it.
*/
var _masterGain=null,_sfxBus=null,_musicBus=null,_duck=null;
function _master(){
  if(!_ready)return null;
  if(!_masterGain){
    _masterGain=AC.createGain();
    var lim=AC.createDynamicsCompressor();
    /* A limiter, not a compressor: high ratio, no knee, fast attack. */
    lim.threshold.value=-7;lim.knee.value=0;lim.ratio.value=20;
    lim.attack.value=0.003;lim.release.value=0.25;
    _masterGain.connect(lim);lim.connect(AC.destination);
  }
  _masterGain.gain.value=_muted?0:_vol;
  return _masterGain;
}
function _sfxOut(){
  if(!_master())return null;
  if(!_sfxBus){
    _sfxBus=AC.createGain();_sfxBus.gain.value=0.8*_volSfx;
    var comp=AC.createDynamicsCompressor();
    comp.threshold.value=-19;comp.knee.value=14;comp.ratio.value=3.5;
    comp.attack.value=0.006;comp.release.value=0.14;
    var shelf=AC.createBiquadFilter();
    shelf.type='highshelf';shelf.frequency.value=4200;shelf.gain.value=-5;
    _sfxBus.connect(comp);comp.connect(shelf);shelf.connect(_masterGain);
  }
  return _sfxBus;
}
function _musicOut(){
  if(!_master())return null;
  if(!_musicBus){
    _musicBus=AC.createGain();_musicBus.gain.value=_volMusic;
    _duck=AC.createGain();_duck.gain.value=1;
    _musicBus.connect(_duck);_duck.connect(_masterGain);
  }
  return _musicBus;
}
/* An explosion pulls the bed down and lets it back up. */
function duckMusic(amount,secs){
  if(!_duck)return;
  try{
    var t=AC.currentTime;
    _duck.gain.cancelScheduledValues(t);
    _duck.gain.setValueAtTime(_duck.gain.value,t);
    _duck.gain.linearRampToValueAtTime(Math.max(0.25,1-amount),t+0.04);
    _duck.gain.linearRampToValueAtTime(1,t+0.04+(secs||0.55));
  }catch(e){}
}

/* ─── VOICES ────────────────────────────────────────────────────────────────
   Two things make a shooter tiring to listen to, and neither is the volume.

   The first is that the shot fired eight times a second is identical every
   time, so the ear locks onto it. Every voice is detuned a few percent now,
   which is enough to stop it reading as a machine.

   The second is that nothing was ever refused. Twenty enemies dying together
   started sixty oscillators, and the sum is mud. So a cue repeated inside a
   third of a second comes back quieter each time and recovers after a moment's
   quiet, and there is a hard ceiling on how many voices may sound at once.
*/
var _voices=0,_MAXV=14,_rep={};
function _repGain(key,floor){
  var now=AC?AC.currentTime:0,r=_rep[key];
  if(!r||now-r.t>0.3){_rep[key]={t:now,n:0};return 1;}
  r.n=Math.min(r.n+1,7);r.t=now;
  return Math.max(floor===undefined?0.4:floor,1-r.n*0.1);
}
function _vary(){return 1+(Math.random()*2-1)*0.04;}
function _voice(node,t,dur){
  _voices++;
  /*
    Chrome fires `ended` twice on a buffer source when an explicit stop() lands
    on the buffer's own natural end, which walked the counter negative — and a
    negative counter silently disables the ceiling below, so the one thing meant
    to stop twenty simultaneous deaths turning to mud stopped working. The flag
    makes the decrement happen once per voice however many events arrive.
  */
  var done=false;
  try{node.stop(t+dur);}catch(e){}
  node.onended=function(){
    if(done)return;
    done=true;
    _voices=Math.max(0,_voices-1);
  };
}

function osc(freq,type,dur,vol,freq2){
  if(!_ready||_muted||_voices>=_MAXV)return;_wake();
  var m=_sfxOut();if(!m)return;
  try{
    var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),v=_vary();
    o.type=type;o.frequency.setValueAtTime(freq*v,t);
    if(freq2)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq2*v),t+dur*0.7);
    g.gain.setValueAtTime(Math.max(0.0001,vol),t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(m);
    o.start(t);_voice(o,t,dur+0.02);
  }catch(e){}
}
function noise(dur,vol,cutoff){
  if(!_ready||_muted||_voices>=_MAXV)return;_wake();
  var m=_sfxOut();if(!m)return;
  try{
    var t=AC.currentTime,sr=AC.sampleRate,n=Math.ceil(sr*dur);
    var buf=AC.createBuffer(1,n,sr),d=buf.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    var src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    f.type='lowpass';f.frequency.value=(cutoff||2000)*_vary();f.Q.value=0.6;
    src.buffer=buf;src.connect(f);f.connect(g);g.connect(m);
    g.gain.setValueAtTime(Math.max(0.0001,vol),t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.start(t);_voice(src,t,dur);
  }catch(e){}
}

// ─── MUSIC ────────────────────────────────────────────────────────────────
/*
  What was here was one chord — A minor — held forever under a fixed twenty-
  four note phrase that repeated every twenty seconds with no rests, over a
  kick on every beat. Each part was decent on its own; together they never
  went anywhere, and a loop that never goes anywhere is what makes music
  annoying rather than merely present.

  Three changes:

  A. The harmony moves. Am - F - C - G, two bars each, and the pad oscillators
     glide between the chord tones rather than restarting, so the change is
     felt rather than heard as an edit.
  B. The melody breathes. A six-note hook returns on the first bar of each
     four-bar cycle so the ear has something to hold; the bars between it are
     sparse, and the fourth bar is silent. Silence is the part the old
     arrangement had none of.
  C. The pulse earns its place. It is gated by intensity, so the title screen
     is a bed and a firefight has a floor under it, and it sits on beats one
     and three rather than hammering all four.
*/
var _music=null;
var _wantIntensity=0;   // 0 = ambient (title/menus), 1 = driving (in a run)

/*
  Intensity is remembered outside _music so that a track started later — the
  player unmutes mid-run, or the audio context only unlocks on the first tap —
  comes up at the right intensity rather than as title music over a firefight.
*/
function musicIntensity(v){
  _wantIntensity=v;
  if(_music)_music.setIntensity(v);
}

// A-minor pentatonic, two octaves. Every note of it is consonant against all
// four chords below, which is what lets the melody roam without supervision.
var _PENTA=[220,261.6,293.7,329.6,392,440,523.3,587.3,659.3,784,880];

/* i - VI - III - VII in A minor. Four voices each, kept in the same octave
   band so the glide between them is short and the voicing never inverts. */
var _PROG=[
  {n:'Am', v:[220,261.6,329.6,392],   bass:55.0},
  {n:'F',  v:[174.6,220,261.6,329.6], bass:43.7},
  {n:'C',  v:[196,261.6,329.6,392],   bass:65.4},
  {n:'G',  v:[196,246.9,293.7,392],   bass:49.0}
];

// The hook — six notes, indices into _PENTA. It is the only fixed phrase.
var _HOOK=[4,5,6,5,4,2];
// What the sparse bars may draw from, biased to chord tones of A minor.
var _FILL=[2,3,4,5,6,7,8];

var _BEAT=0.86;          // seconds — 70 BPM
var _STEP=_BEAT/2;       // eighth notes

function musicStart(){
  if(!_ready||_music||_muted)return;
  try{
    var ac=AC;
    var out=_musicOut();if(!out)return;

    var bus=ac.createGain();
    bus.gain.setValueAtTime(0,ac.currentTime);
    bus.gain.linearRampToValueAtTime(0.40,ac.currentTime+3.0);
    bus.connect(out);

    // ── reverb: a 3-second exponential noise impulse ──
    var sr=ac.sampleRate,revLen=Math.ceil(sr*3.0);
    var revBuf=ac.createBuffer(2,revLen,sr);
    for(var ch=0;ch<2;ch++){
      var d=revBuf.getChannelData(ch);
      for(var i=0;i<revLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/revLen,2.2)*0.9;
    }
    var conv=ac.createConvolver();conv.buffer=revBuf;
    var convGain=ac.createGain();convGain.gain.value=0.5;
    conv.connect(convGain);convGain.connect(bus);

    // ── pad: two detuned triangles per chord voice ──
    var padBus=ac.createGain();padBus.gain.value=1;
    var padLP=ac.createBiquadFilter();padLP.type='lowpass';padLP.frequency.value=1700;padLP.Q.value=0.5;
    padBus.connect(padLP);padLP.connect(bus);padLP.connect(conv);

    var breathLFO=ac.createOscillator();breathLFO.type='sine';breathLFO.frequency.value=0.062;
    var breathG=ac.createGain();breathG.gain.value=0.05;
    breathLFO.connect(breathG);breathG.connect(padBus.gain);breathLFO.start();

    var padOscs=[],padVoices=[];
    _PROG[0].v.forEach(function(baseFreq,ci){
      [1.0,1.0046].forEach(function(det){
        var o=ac.createOscillator();
        o.type='triangle';o.frequency.value=baseFreq*det;
        var g=ac.createGain();g.gain.value=(ci===0||ci===3)?0.10:0.085;
        o.connect(g);g.connect(padBus);o.start();
        padOscs.push(o);padVoices.push({o:o,det:det,i:ci});
      });
    });

    // ── bass: root sine plus the octave a small speaker can actually move ──
    var bassBus=ac.createGain();
    var bassLP=ac.createBiquadFilter();bassLP.type='lowpass';bassLP.frequency.value=190;bassLP.Q.value=0.7;
    bassBus.connect(bassLP);bassLP.connect(bus);
    bassBus.gain.setValueAtTime(0,ac.currentTime);
    bassBus.gain.linearRampToValueAtTime(0.46,ac.currentTime+4.0);
    var bassOscs=[];
    [[1,'sine',0.28],[2,'triangle',0.085]].forEach(function(cfg){
      var o=ac.createOscillator();o.type=cfg[1];o.frequency.value=_PROG[0].bass*cfg[0];
      var g=ac.createGain();g.gain.value=cfg[2];
      o.connect(g);g.connect(bassBus);o.start();
      padOscs.push(o);bassOscs.push({o:o,mul:cfg[0]});
    });
    var bassLFO=ac.createOscillator();bassLFO.type='sine';bassLFO.frequency.value=0.045;
    var bassLFOG=ac.createGain();bassLFOG.gain.value=0.2;
    bassLFO.connect(bassLFOG);bassLFOG.connect(bassBus.gain);bassLFO.start();

    // ── melody ──
    var melBus=ac.createGain();melBus.gain.value=1;
    melBus.connect(bus);melBus.connect(conv);

    /* Intensity is a parameter now, not a switch: it rides a gain so the
       transition into a run is a swell rather than a cut. */
    var intG=ac.createGain();intG.gain.value=_wantIntensity;
    var pulseBus=ac.createGain();pulseBus.gain.value=1;
    var pulseLP=ac.createBiquadFilter();pulseLP.type='lowpass';pulseLP.frequency.value=260;
    pulseBus.connect(pulseLP);pulseLP.connect(bus);

    var timers={step:null,shimmer:null};
    var step=0;                      // eighth notes since the track began
    var chordIdx=-1;

    function setChord(k){
      var c=_PROG[k],t=ac.currentTime;
      padVoices.forEach(function(pv){
        pv.o.frequency.setTargetAtTime(c.v[pv.i]*pv.det,t,0.45);
      });
      bassOscs.forEach(function(b){
        b.o.frequency.setTargetAtTime(c.bass*b.mul,t,0.5);
      });
    }

    function note(freq,dur,vel){
      if(_muted)return;
      try{
        var t=ac.currentTime;
        var o=ac.createOscillator();o.type='triangle';
        o.frequency.setValueAtTime(freq*0.997,t);
        o.frequency.linearRampToValueAtTime(freq,t+0.025);
        var vib=ac.createOscillator();vib.type='sine';vib.frequency.value=5.0;
        var vg=ac.createGain();
        vg.gain.setValueAtTime(0,t);
        vg.gain.linearRampToValueAtTime(0,t+dur*0.55);
        vg.gain.linearRampToValueAtTime(2.6,t+dur*0.9);
        vib.connect(vg);vg.connect(o.frequency);
        vib.start(t);vib.stop(t+dur+0.05);
        var g=ac.createGain();
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.13*vel,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0008,t+dur*1.25);
        o.connect(g);g.connect(melBus);
        o.start(t);o.stop(t+dur*1.35);
      }catch(e){}
    }

    function kick(amp){
      if(_muted||amp<0.02)return;
      try{
        var t=ac.currentTime;
        var o=ac.createOscillator();o.type='sine';
        o.frequency.setValueAtTime(115,t);
        o.frequency.exponentialRampToValueAtTime(42,t+0.14);
        var g=ac.createGain();
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.26*amp,t+0.014);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
        o.connect(g);g.connect(pulseBus);
        o.start(t);o.stop(t+0.36);
      }catch(e){}
    }

    /* One clock at eighth notes runs the whole arrangement. Everything that
       happens is a function of the step, which is what keeps the parts in
       time with each other without a second timer to drift against. */
    function tick(){
      if(!_music)return;
      var bar=Math.floor(step/8), beat=step%8, cyc=bar%4;
      var amp=_music.intensity;

      if(beat===0){
        var k=Math.floor(bar/2)%_PROG.length;
        if(k!==chordIdx){chordIdx=k;setChord(k);}
      }
      // beats one and three carry the pulse; the off-beat only at full tilt
      if(beat===0||beat===4)kick(amp);
      else if(beat===2||beat===6)kick(amp*0.45);

      if(cyc===0){
        // the hook, one note every eighth for its six notes
        if(beat<6)note(_PENTA[_HOOK[beat]],_BEAT*0.9,beat===0?1:0.82);
      }else if(cyc===3){
        // the bar of silence
      }else{
        // sparse: a couple of notes, placed off the beat as often as on it
        if(beat===1||beat===5||(beat===3&&Math.random()<0.5)){
          var deg=_FILL[Math.floor(Math.random()*_FILL.length)];
          note(_PENTA[deg],_BEAT*(beat===5?1.6:1.0),0.6+Math.random()*0.25);
        }
      }

      step++;
      timers.step=setTimeout(tick,_STEP*1000);
    }
    timers.step=setTimeout(tick,900);

    /* Air. This used to be a 5.8 kHz noise burst, which on headphones is close
       to an ice pick; it is band-limited and much quieter now. */
    function shimmer(){
      if(!_music)return;
      if(!_muted){
        try{
          var t=ac.currentTime,nLen=Math.ceil(sr*0.6);
          var nBuf=ac.createBuffer(1,nLen,sr),nd=nBuf.getChannelData(0);
          for(var i=0;i<nLen;i++)nd[i]=(Math.random()*2-1)*Math.pow(1-i/nLen,1.1);
          var ns=ac.createBufferSource();ns.buffer=nBuf;
          var hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=3200;hp.Q.value=0.5;
          var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=8000;lp.Q.value=0.5;
          var sg=ac.createGain();
          sg.gain.setValueAtTime(0,t);
          sg.gain.linearRampToValueAtTime(0.018,t+0.25);
          sg.gain.exponentialRampToValueAtTime(0.0005,t+0.6);
          ns.connect(hp);hp.connect(lp);lp.connect(sg);sg.connect(bus);
          ns.start(t);
        }catch(e){}
      }
      timers.shimmer=setTimeout(shimmer,4200+Math.random()*5200);
    }
    timers.shimmer=setTimeout(shimmer,2600);

    _music={
      bus:bus,conv:conv,padOscs:padOscs,
      intensity:_wantIntensity,
      setIntensity:function(v){
        this.intensity=v;
        /* the pad opens up a little under fire, which reads as more energy
           without adding a part */
        try{padLP.frequency.setTargetAtTime(1700+v*900,ac.currentTime,0.8);}catch(e){}
      },
      stop:function(){
        clearTimeout(timers.step);clearTimeout(timers.shimmer);
        padOscs.forEach(function(o){try{o.stop();}catch(e){}});
        try{breathLFO.stop();}catch(e){}
        try{bassLFO.stop();}catch(e){}
      }
    };
    _music.setIntensity(_wantIntensity);
  }catch(e){console.warn('Music error:',e);}
}

function musicStop(){
  if(!_music)return;
  try{
    var t=AC.currentTime;
    _music.bus.gain.cancelScheduledValues(t);
    _music.bus.gain.setValueAtTime(_music.bus.gain.value,t);
    _music.bus.gain.linearRampToValueAtTime(0,t+1.5);
    var m=_music;_music=null;
    setTimeout(function(){try{m.stop();}catch(e){}},1600);
  }catch(e){}
}
function setVolume(v){
  _vol=Math.max(0,Math.min(1,v));
  try{localStorage.setItem('vs_vol',_vol);}catch(e){}
  if(_masterGain)_masterGain.gain.value=_muted?0:_vol;
}
function setMusicVolume(v){
  _volMusic=Math.max(0,Math.min(1,v));
  try{localStorage.setItem('vs_vol_music',_volMusic);}catch(e){}
  if(_musicBus)_musicBus.gain.value=_volMusic;
}
function setSfxVolume(v){
  _volSfx=Math.max(0,Math.min(1,v));
  try{localStorage.setItem('vs_vol_sfx',_volSfx);}catch(e){}
  if(_sfxBus)_sfxBus.gain.value=0.8*_volSfx;
}
function setMute(m){
  _muted=m;
  try{localStorage.setItem('vs_mute',m?'1':'0');}catch(e){}
  if(_masterGain)_masterGain.gain.value=_muted?0:_vol;
  if(!_muted&&_ready&&!_music&&gs&&(gs.phase==='title'||gs.phase==='playing'))musicStart();
}

// ─── SFX ─────────────────────────────────────────────────────────────────────
var SFX={
  /*
    Each shot is a click for the attack and a pitched core for the weapon's
    identity. The low thump each one used to carry is gone from the rapid
    weapons: at eight shots a second it was not weight, it was mud, and it is
    the single biggest reason the game was tiring to listen to. It survives on
    the slow, heavy weapons, where there is room for it.

    `_repGain` is what holds the volume down while the trigger is held, and
    lets it back up the moment the player stops firing.
  */
  shoot:function(w){
    var r=_repGain('shoot',0.34);
    if(w==='normal'){osc(640,'square',0.035,0.05*r,230);noise(0.016,0.03*r,2400);}
    else if(w==='spread'){osc(450,'square',0.035,0.045*r,170);osc(580,'square',0.03,0.03*r,210);noise(0.018,0.028*r,2100);}
    else if(w==='laser'){osc(1220,'sawtooth',0.055,0.05*r,260);noise(0.012,0.022*r,3600);}
    else if(w==='plasma'){osc(230,'sawtooth',0.09,0.07*r,700);osc(96,'sine',0.11,0.075*r,46);noise(0.026,0.032*r,1400);}
    else if(w==='missile'){osc(275,'sawtooth',0.065,0.055*r,92);osc(112,'sine',0.10,0.07*r,48);noise(0.045,0.04*r,1000);}
    else if(w==='beam'){osc(1480,'sine',0.042,0.055*r,760);noise(0.011,0.02*r,4200);}
  },
  hit:function(){var r=_repGain('hit',0.3);osc(240,'square',0.02,0.045*r,100);noise(0.016,0.035*r,1200);},
  kill:function(t){
    var r=_repGain('kill',0.35);
    var ff=[440,380,320,500,280,560,420,360];
    var f=ff[t%ff.length];
    osc(f,'sine',0.05,0.085*r,f*0.4);noise(0.035,0.055*r,1400);
  },
  explode:function(big){
    if(big){duckMusic(0.5,0.9);osc(30,'sine',1.3,0.34);osc(48,'sine',0.95,0.4);noise(0.8,0.34,170);}
    else   {var r=_repGain('exp',0.4);osc(60,'sine',0.3,0.2*r);noise(0.22,0.16*r,650);}
  },
  comboUp:function(n){osc(220+n*55,'sine',0.07,0.09,440+n*80);},
  power:function(){osc(330,'sine',0.08,0.1,660);osc(440,'sine',0.1,0.085,880);osc(660,'sine',0.12,0.075,1320);},
  shield:function(){osc(800,'sawtooth',0.15,0.1,60);noise(0.1,0.06,1000);},
  bomb:function(){duckMusic(0.72,1.5);osc(22,'sine',1.7,0.44);osc(35,'sine',1.3,0.55);noise(0.85,0.36,130);},
  wave:function(){duckMusic(0.3,0.8);osc(60,'sine',0.7,0.13,110);osc(110,'sine',0.55,0.1,220);setTimeout(function(){osc(220,'sine',0.4,0.08,440);},280);},
  boss:function(){duckMusic(0.45,1.1);osc(40,'sawtooth',0.45,0.16,160);noise(0.25,0.09,340);},
  upgrade:function(){osc(440,'sine',0.09,0.11);osc(550,'sine',0.11,0.1,880);osc(660,'sine',0.13,0.085,1320);},
  gameover:function(){duckMusic(0.8,2.0);osc(32,'sawtooth',1.5,0.4,16);noise(0.6,0.14,170);},
  menuClick:function(){osc(420,'sine',0.05,0.075,840);}
};

// ─── BEST RUN ─────────────────────────────────────────────────────────────────
/*
  The leaderboard already persists the top ten, but nothing surfaced a personal
  best where it motivates — on the title screen, before the run starts.
*/
var BESTK='vs_best';
var _best={s:0,w:0};
try{_best=JSON.parse(localStorage.getItem(BESTK)||'{"s":0,"w":0}');}catch(e){}
function recordBest(score,wave){
  if(score>(_best.s||0)){
    _best={s:score,w:wave};
    try{localStorage.setItem(BESTK,JSON.stringify(_best));}catch(e){}
    return true;
  }
  return false;
}

// ─── LEADERBOARD ─────────────────────────────────────────────────────────────
var LBK='vs_lb';
function lbLoad(){try{return JSON.parse(localStorage.getItem(LBK)||'[]');}catch(e){return[];}}
function lbSave(r){try{localStorage.setItem(LBK,JSON.stringify(r));}catch(e){}return r;}
function lbAdd(name,score,wave){
  var r=lbLoad();
  r.push({n:name.toUpperCase().slice(0,10)||'ACE',s:score,w:wave});
  r.sort(function(a,b){return b.s-a.s;});
  return lbSave(r.slice(0,10));
}

// ─── PILOT PROGRESSION ─────────────────────────────────────────────────────
/*
  A second currency and a lifetime XP total, both persistent, on top of the
  credits a single run already earns and spends in its own wave-to-wave shop.
  That shop's balance was tuned carefully in an earlier pass and this does not
  touch it: SCRAP is a slower, separate meter, paid out once at game over from
  that run's score, spent on permanent weapon levels and ship skins that carry
  into every run after — rather than the in-run credits, which still reset to
  zero the moment a run ends, exactly as before.
*/
var SCRAPK='vs_scrap',XPK='vs_xp',WLVLK='vs_wlvl',SKINK='vs_skin',SKINSK='vs_skins',DAILYK='vs_daily';
var _scrap=0,_xp=0;
try{_scrap=parseInt(localStorage.getItem(SCRAPK)||'0',10)||0;}catch(e){}
try{_xp=parseInt(localStorage.getItem(XPK)||'0',10)||0;}catch(e){}
function saveScrap(){try{localStorage.setItem(SCRAPK,String(_scrap));}catch(e){}}
function saveXp(){try{localStorage.setItem(XPK,String(_xp));}catch(e){}}

var WPN_TYPES=[
  {id:'spread', name:'SPREAD SHOT',   icon:'\u2726'},
  {id:'laser',  name:'LASER CANNON',  icon:'\u26a1'},
  {id:'plasma', name:'PLASMA TORPEDO',icon:'\u2604'},
  {id:'missile',name:'MISSILE POD',   icon:'\u25b2'},
  {id:'beam',   name:'BEAM CANNON',   icon:'\u25ae'},
];
var WPN_MAXLV=5;
var _wlvl={};try{_wlvl=JSON.parse(localStorage.getItem(WLVLK)||'{}');}catch(e){}
WPN_TYPES.forEach(function(w){if(!_wlvl[w.id])_wlvl[w.id]=1;});
function saveWlvl(){try{localStorage.setItem(WLVLK,JSON.stringify(_wlvl));}catch(e){}}
function wpnCost(level){return Math.round(120*Math.pow(level,1.7));}
// A meta-progression bonus, applied on top of the in-run fire-rate stacking
// that already exists (dc.fireM, gs.fireBonus) — up to 20% faster at max
// level, so it is felt but does not dwarf what a good run already earns.
function wpnLevelMul(type){var lv=_wlvl[type]||1;return 1-0.05*(lv-1);}

var SKINS=[
  {id:'blue',   name:'STANDARD BLUE', hue:null,unlock:{type:'default'}},
  {id:'violet', name:'VOID VIOLET',   hue:265, unlock:{type:'level',v:5}},
  {id:'gold',   name:'SOLAR GOLD',    hue:45,  unlock:{type:'scrap',v:1500}},
  {id:'crimson',name:'CRIMSON ACE',   hue:350, unlock:{type:'scrap',v:3000}},
];
var _skin='blue',_skinsOwned=['blue'];
try{_skin=localStorage.getItem(SKINK)||'blue';}catch(e){}
try{_skinsOwned=JSON.parse(localStorage.getItem(SKINSK)||'[\"blue\"]');}catch(e){}
if(_skinsOwned.indexOf('blue')<0)_skinsOwned.push('blue');
function saveSkin(){try{localStorage.setItem(SKINK,_skin);}catch(e){}}
function saveSkinsOwned(){try{localStorage.setItem(SKINSK,JSON.stringify(_skinsOwned));}catch(e){}}
function skinUnlocked(id){return _skinsOwned.indexOf(id)>=0;}
var _shipSkinCache={};
/*
  Recolours the raster ship once per skin, onto an offscreen canvas, rather
  than per frame: 'hue' blend keeps the source art's own shading and metal
  highlights and only shifts the colour family, then 'destination-in' clips
  the fill back to the original silhouette's alpha so the recolour cannot
  bleed past the ship's own edges into the transparent frame around it.
*/
function _tintedShipCanvas(skin){
  if(!_shipImgReady||skin.hue==null)return null;
  if(_shipSkinCache[skin.id])return _shipSkinCache[skin.id];
  var c=document.createElement('canvas');c.width=SHIP_IMG_W;c.height=SHIP_IMG_H;
  var cx=c.getContext('2d');
  cx.drawImage(_shipImg,0,0);
  cx.globalCompositeOperation='hue';
  cx.fillStyle='hsl('+skin.hue+',85%,55%)';
  cx.fillRect(0,0,c.width,c.height);
  cx.globalCompositeOperation='destination-in';
  cx.drawImage(_shipImg,0,0);
  cx.globalCompositeOperation='source-over';
  _shipSkinCache[skin.id]=c;
  return c;
}

/*
  Level and rank both read from lifetime XP rather than store their own
  number, so neither can drift out of sync with it. The curve is quadratic —
  300*level\u00b2 — so early levels come fast, where a new player notices
  them, and it stretches out rather than becoming a wall.
*/
function pilotLevel(){return 1+Math.floor(Math.sqrt(_xp/300));}
var RANKS=[
  {min:1, name:'ROOKIE'},{min:5, name:'CADET'},{min:10,name:'VETERAN'},
  {min:15,name:'ELITE'}, {min:25,name:'ACE'},  {min:40,name:'LEGEND'},
];
function pilotRank(){
  var lv=pilotLevel(),r=RANKS[0];
  RANKS.forEach(function(x){if(lv>=x.min)r=x;});
  return r.name;
}
function xpForLevel(lv){return 300*lv*lv;}
function _syncSkinUnlocks(){
  var lv=pilotLevel(),changed=false;
  SKINS.forEach(function(sk){
    if(sk.unlock.type==='level'&&lv>=sk.unlock.v&&_skinsOwned.indexOf(sk.id)<0){_skinsOwned.push(sk.id);changed=true;}
  });
  if(changed)saveSkinsOwned();
}
_syncSkinUnlocks();

/*
  Awarded once, at game over, from that run's score and depth — not from
  whatever was left in the run's own credits, which is that system's business
  alone and stays at whatever it was (spent or not).
*/
function awardMeta(score,wave){
  var scrap=Math.round(score/30)+wave*20;
  _scrap+=scrap;_xp+=score;
  saveScrap();saveXp();_syncSkinUnlocks();
  return scrap;
}

function dailyState(){
  var d={last:0};
  try{d=JSON.parse(localStorage.getItem(DAILYK)||'{\"last\":0}');}catch(e){}
  return d;
}
function dailyReady(){return Date.now()-dailyState().last>=86400000;}
function dailyAmount(){return 250+pilotLevel()*10;}
function dailyClaim(){
  if(!dailyReady())return 0;
  var amt=dailyAmount();
  _scrap+=amt;saveScrap();
  try{localStorage.setItem(DAILYK,JSON.stringify({last:Date.now()}));}catch(e){}
  return amt;
}
function dailyRemainMs(){return Math.max(0,86400000-(Date.now()-dailyState().last));}
function fmtCountdown(ms){
  var s2=Math.floor(ms/1000),h=Math.floor(s2/3600),m=Math.floor((s2%3600)/60),ss=s2%60;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}

var _modalStack=[];
function openModal(id,html,closeable){
  initAC();
  _modalStack.push({id:id,html:html,closeable:closeable!==false});
  _renderModal();
}
/*
  Every screen except the two that must not be escaped — the game-over score
  entry, and the name prompt behind it — offers a way back from the top bar.
  On the pilot hub that means leaving to the title screen, since the hub is
  itself a modal over it and popping the last one closes the stack.
*/
var _NO_BACK={gameover:1};
function _backLabel(id){
  if(id==='main')return 'TITLE';
  if(id==='pause')return 'RESUME';
  return 'BACK';
}
function _renderModal(){
  var m=_modalStack[_modalStack.length-1];
  if(!m){closeAllModals();return;}
  document.getElementById('modal-body').innerHTML=m.html;
  document.getElementById('modal-close').style.display=m.closeable?'block':'none';
  var back=document.getElementById('modal-back');
  back.classList.toggle('on',!_NO_BACK[m.id]);
  back.querySelector('b').textContent=_backLabel(m.id);
  back.setAttribute('aria-label',_backLabel(m.id));
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-box').scrollTop=0;
  _attachModalEvents(m.id);
}
function popModal(){
  var m=_modalStack.pop();
  // Dismissing the pause screen is what resumes the run — including when the
  // dismissal comes from Android's back button through the native shim.
  if(m&&m.id==='pause')gs.paused=false;
  if(_modalStack.length)_renderModal();
  else closeAllModals();
}
function closeAllModals(){_modalStack=[];document.getElementById('modal').classList.remove('open');}
document.getElementById('modal-close').addEventListener('click',function(){popModal();SFX.menuClick();});
document.getElementById('modal-back').addEventListener('click',function(){popModal();SFX.menuClick();});

var _dailyTick=null;
function _clearDailyTick(){if(_dailyTick){clearInterval(_dailyTick);_dailyTick=null;}}

function _attachModalEvents(id){
  _clearDailyTick();
  if(id==='main'){
    // difficulty buttons
    [0,1,2].forEach(function(i){
      var b=document.getElementById('diff-'+i);
      if(b)b.addEventListener('click',function(){
        _sel=i;_renderDiffBtns();SFX.menuClick();
      });
    });
    var sp=document.getElementById('btn-start');
    if(sp)sp.addEventListener('click',function(){
      closeAllModals();startGame(_sel);
    });
    var lb=document.getElementById('btn-lb');
    if(lb)lb.addEventListener('click',function(){SFX.menuClick();openModal('lb',buildLBHtml());});
    var ach=document.getElementById('btn-ach');
    if(ach)ach.addEventListener('click',function(){SFX.menuClick();openModal('ach',buildAchHtml());});
    var wpn=document.getElementById('btn-wpn');
    if(wpn)wpn.addEventListener('click',function(){SFX.menuClick();openModal('weapons',buildWeaponsHtml());});
    var hg=document.getElementById('btn-hangar');
    if(hg)hg.addEventListener('click',function(){SFX.menuClick();openModal('hangar',buildHangarHtml());});
    var dc2=document.getElementById('daily-claim');
    if(dc2)dc2.addEventListener('click',function(){
      var amt=dailyClaim();
      if(amt){SFX.power();showToast('+'+amt+' SCRAP');_modalStack[_modalStack.length-1].html=buildMainHtml();_renderModal();}
    });
    var cdEl=document.getElementById('daily-cd');
    if(cdEl){
      _dailyTick=setInterval(function(){
        var el=document.getElementById('daily-cd');
        if(!el){_clearDailyTick();return;}
        if(dailyReady()){
          _clearDailyTick();
          if(_modalStack.length&&_modalStack[_modalStack.length-1].id==='main'){
            _modalStack[_modalStack.length-1].html=buildMainHtml();_renderModal();
          }
          return;
        }
        el.textContent=fmtCountdown(dailyRemainMs());
      },1000);
    }
    _renderDiffBtns();
    _wireVolume();
  }
  if(id==='weapons'){
    Array.prototype.forEach.call(document.querySelectorAll('.wpn-buy[data-wpn]'),function(b){
      b.addEventListener('click',function(){
        var t=b.getAttribute('data-wpn'),lv=_wlvl[t]||1,cost=wpnCost(lv);
        if(lv>=WPN_MAXLV||_scrap<cost)return;
        _scrap-=cost;_wlvl[t]=lv+1;saveScrap();saveWlvl();SFX.power();
        _modalStack[_modalStack.length-1].html=buildWeaponsHtml();_renderModal();
      });
    });
  }
  if(id==='hangar'){
    var prev=document.getElementById('hg-prev'),next=document.getElementById('hg-next');
    if(prev)prev.addEventListener('click',function(){if(_hangarSel>0){_hangarSel--;SFX.menuClick();_renderHangar();}});
    if(next)next.addEventListener('click',function(){if(_hangarSel<SKINS.length-1){_hangarSel++;SFX.menuClick();_renderHangar();}});
    var act=document.getElementById('hangar-action');
    if(act)act.addEventListener('click',function(){
      var skin=SKINS[_hangarSel];
      if(!skinUnlocked(skin.id)){
        if(skin.unlock.type==='scrap'&&_scrap>=skin.unlock.v){
          _scrap-=skin.unlock.v;_skinsOwned.push(skin.id);saveScrap();saveSkinsOwned();SFX.power();
        }else return;
      }else if(skin.id!==_skin){
        _skin=skin.id;saveSkin();SFX.menuClick();
      }
      _renderHangar();
    });
    _renderHangar();
  }
  if(id==='pause'){
    var pr=document.getElementById('pz-resume');
    if(pr)pr.addEventListener('click',function(){SFX.menuClick();resumeGame();});
    var pq=document.getElementById('pz-quit');
    if(pq)pq.addEventListener('click',function(){SFX.menuClick();quitToMenu();});
    _wireVolume();
  }
  if(id==='gameover'){
    var ni=document.getElementById('go-name');
    var sb=document.getElementById('go-submit');
    var rb=document.getElementById('go-retry');
    if(sb)sb.addEventListener('click',function(){
      var nm=ni?ni.value.trim():'ACE';
      lbAdd(nm,gs.score,gs.wave);
      SFX.menuClick();
      openModal('lb',buildLBHtml());
    });
    if(rb)rb.addEventListener('click',function(){closeAllModals();openModal('main',buildMainHtml(),false);});
    if(ni)ni.addEventListener('keydown',function(e){if(e.key==='Enter'&&sb)sb.click();});
    _wireVolume();
  }
}

  [0,1,2].forEach(function(i){

function _renderHangar(){
  var skin=SKINS[_hangarSel];
  var cv=document.getElementById('hangar-canvas');
  if(cv){
    var cx=cv.getContext('2d');cx.clearRect(0,0,cv.width,cv.height);
    var img=(skin.hue!=null)?_tintedShipCanvas(skin):_shipImg;
    if(img&&_shipImgReady){
      var s2=Math.min(cv.width/SHIP_IMG_W,cv.height/SHIP_IMG_H)*0.85;
      var dw=SHIP_IMG_W*s2,dh=SHIP_IMG_H*s2;
      cx.drawImage(img,(cv.width-dw)/2,(cv.height-dh)/2,dw,dh);
    }
  }
  var nameEl=document.getElementById('hangar-name');if(nameEl)nameEl.textContent=skin.name;
  var lockEl=document.getElementById('hangar-lock');
  var btn=document.getElementById('hangar-action');
  var owned=skinUnlocked(skin.id);
  if(owned){
    if(lockEl)lockEl.textContent='';
    if(btn){
      if(skin.id===_skin){btn.textContent='EQUIPPED';btn.className='mbtn';btn.disabled=true;}
      else{btn.textContent='EQUIP';btn.className='mbtn green';btn.disabled=false;}
    }
  }else{
    var lockedByLevel=skin.unlock.type==='level';
    if(lockEl)lockEl.textContent=lockedByLevel
      ?('UNLOCKS AT LEVEL '+skin.unlock.v)
      :('UNLOCK FOR '+skin.unlock.v+' SCRAP');
    if(btn){
      if(lockedByLevel){btn.textContent='LOCKED';btn.className='mbtn';btn.disabled=true;}
      else{btn.textContent='UNLOCK ('+skin.unlock.v+')';btn.className='mbtn yellow';btn.disabled=_scrap<skin.unlock.v;}
    }
  }
  var prevBtn=document.getElementById('hg-prev'),nextBtn=document.getElementById('hg-next');
  if(prevBtn)prevBtn.disabled=_hangarSel<=0;
  if(nextBtn)nextBtn.disabled=_hangarSel>=SKINS.length-1;
}

// ─── BALANCE ──────────────────────────────────────────────────────────────────
/*
  Every difficulty curve in the game is bounded and lives here rather than as a
  magic number inside the update loop. The old curves were linear and open-ended
  — enemy drift was `dx*(1+wave*0.06)`, which is 3.4x by wave 40 and still
  climbing — so a long run stopped being hard and became arithmetic.

  waveRamp approaches `cap` and never passes it: wave 1 adds nothing, the curve
  is steep early where the player notices progression, and it flattens into a
  ceiling that is reachable and survivable. Difficulty then scales the ceiling
  rather than the slope, so EASY and HARD differ in where they settle, not in
  whether they eventually become unplayable.
*/
function waveRamp(wave,per,cap){return cap*(1-Math.exp(-per*Math.max(0,wave-1)));}

var CREDITS_BASE=50,CREDITS_PER_WAVE=12,CLEAN_WAVE_BONUS=1.2;

var BAL={
  enemyDrift  :function(w){return 1+waveRamp(w,.09,.85);},      // -> 1.85x
  enemyFireGap:function(w){return 88-waveRamp(w,.10,52);},      // -> 36 frames
  enemyBullet :function(w){return 2.4+waveRamp(w,.08,2.2);},    // -> 4.6 px/frame
  bossFireGap :function(w){return 54-waveRamp(w,.07,30);},      // -> 24 frames
  bossBullet  :function(w){return 2.8+waveRamp(w,.07,2.4);},    // -> 5.2 px/frame
};

// Ceilings for stacked upgrades, so a long run compounds without trivialising.
var CAP={fire:.45,score:3,speed:1.8,pierce:4,wpn:3,lives:8,shield:640,bombs:3};

var DCFG=[
  {name:'EASY',  col:'#00ff88',lives:7, spdM:0.7,  fireM:0.5,  hpM:0.6,  scM:0.7, bulletM:0.78},
  {name:'NORMAL',col:'#ffee00',lives:5, spdM:1.0,  fireM:1.0,  hpM:1.0,  scM:1.0, bulletM:1.00},
  {name:'HARD',  col:'#ff4060',lives:3, spdM:1.6,  fireM:1.8,  hpM:1.6,  scM:1.6, bulletM:1.25},
];

/*
  The pilot hub. It replaced a plain difficulty-select menu on his
  instruction to use a supplied reference image of a much busier game-hub
  screen as the new home page. That reference was a landscape desktop
  layout — a pilot panel and a live gameplay panel side by side; this
  game's canvas is 520x720, locked in by the App Store stills, the demo clip
  and the site's phone frame, so the same ideas (a pilot identity with rank
  and level, a daily reward, permanent weapon and ship progression reachable
  from the front screen) are stacked into one column instead of arranged
  side by side, and it stays exactly what it already was: a modal over the
  title screen's own animated hero ship, not a second rendering surface.
*/

      xpBase=xpForLevel(lv-1),xpNext=xpForLevel(lv),

    '<div class="hub-head">'+
      '<div class="hub-avatar">🚀</div>'+
      '<div class="hub-id">'+
        '<div class="hub-name">PILOT</div>'+
        '<div class="hub-rank">'+rk+' &middot; LV '+lv+'</div>'+
        '<div class="hub-xpbar"><div class="hub-xpfill" style="width:'+xpPct+'%;"></div></div>'+
      '</div>'+
      '<div class="hub-lv">'+lv+'</div>'+
    '</div>'+
    '<div class="hub-scrap">⬡ '+_scrap.toLocaleString()+' SCRAP</div>'+
    '<div class="hub-daily">'+
      '<div><div class="hub-daily-lbl">DAILY REWARD</div>'+
      '<div class="hub-daily-amt">+'+dailyAmount()+' SCRAP</div></div>'+
      (ready
        ? '<button id="daily-claim" class="hub-daily-btn">CLAIM</button>'
        : '<div class="hub-daily-cd" id="daily-cd">'+fmtCountdown(dailyRemainMs())+'</div>')+
    '</div>'+
    '<div style="font-size:11px;color:rgba(0,165,205,0.55);letter-spacing:3px;margin-bottom:10px;">SELECT DIFFICULTY</div>'+
    '<div class="diff-row" style="margin:0 0 20px;"><button id="diff-0" class="diff-btn">EASY</button><button id="diff-1" class="diff-btn sel-normal">NORMAL</button><button id="diff-2" class="diff-btn">HARD</button></div>'+
    '<button id="btn-start" class="mbtn" style="font-size:14px;padding:20px 0;margin-bottom:18px;">▶  START MISSION</button>'+
    '<div class="hub-nav">'+
      '<button id="btn-wpn" class="mbtn">🔫 WEAPONS</button>'+

    var lv=_wlvl[w.id]||1,maxed=lv>=WPN_MAXLV;

/*
  There was no pause at all, which is also why Android's back button had to
  minimise the app: mid-run there was nowhere to go, so backing out would have
  silently destroyed the run. There is somewhere to go now, and the shim points
  back here.
*/
function pauseGame(){
  if(gs.phase!=='playing'||gs.paused||gs.upgradePhase)return false;
  gs.paused=true;
  gs.keys={};gs.mactive=false;gs.firebtnHeld=false;_steerId=null;   // don't resume mid-input
  SFX.menuClick();
  openModal('pause',buildPauseHtml(),true);
  return true;
}
function resumeGame(){
  if(!gs.paused)return false;
  popModal();
  return true;
}
function togglePause(){return gs.paused?resumeGame():pauseGame();}

function quitToMenu(){
  gs.paused=false;gs.phase='title';
  musicIntensity(0);
  closeAllModals();
  openModal('main',buildMainHtml(),false);
}

function addFloat(x,y,txt,col,big){
  gs.floats.push({x:x,y:y,txt:txt,col:col||'#ffff66',sz:big?13:10,life:1,decay:big?0.02:0.026,vy:big?-1.8:-1.4});

// ─── MATH ─────────────────────────────────────────────────────────────────────
var TAU=Math.PI*2;
function rand(a,b){return Math.random()*(b-a)+a;}
function lerp(a,b,t){return a+(b-a)*t;}
function dist(ax,ay,bx,by){return Math.sqrt((ax-bx)**2+(ay-by)**2);}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v;}
function rGrad(x,y,r0,r1,s){var g=ctx.createRadialGradient(x,y,r0,x,y,r1);s.forEach(function(st){g.addColorStop(st[0],st[1]);});return g;}
function lGrad(x1,y1,x2,y2,s){var g=ctx.createLinearGradient(x1,y1,x2,y2);s.forEach(function(st){g.addColorStop(st[0],st[1]);});return g;}

// ─── PARTICLES ────────────────────────────────────────────────────────────────
function burst(x,y,col,n,spd){
  for(var i=0;i<(n||16);i++){
    var a=rand(0,TAU),s=rand(1,spd||5);
    gs.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(1,3.5),col:col,life:1,dec:rand(0.025,0.055),type:'dot'});
  }
}
function ring(x,y,col){
  gs.parts.push({x:x,y:y,r:6,maxR:90,col:col,life:1,dec:0.05,type:'ring',vx:0,vy:0});
}
function trail(x,y,col){
  gs.parts.push({x:x,y:y,vx:rand(-0.4,0.4),vy:rand(0.8,1.8),r:1.5,col:col,life:0.5,dec:0.08,type:'dot'});
}

// ─── STARS ────────────────────────────────────────────────────────────────────
function makeStars(){
  var layers=[];
  [[100,0.15,0.65],[50,0.4,1.1],[18,1.0,1.9]].forEach(function(cfg){
    var arr=[];
    for(var i=0;i<cfg[0];i++)arr.push({x:rand(0,W),y:rand(0,H),s:rand(cfg[1],cfg[2]),sp:cfg[1],col:['#223344','#334455','#445566','#99aacc'][Math.floor(rand(0,4))]});
    layers.push(arr);
  });
  return layers;
}

/*
  A handful of bright "hero" stars, drawn with a four-point flare rather than a
  filled square. The plain star layers read as texture; these read as light —
  three or four of them is enough to give the field depth without it costing
  anything close to what a real starfield would.
*/
function makeFlareStars(){
  var arr=[];
  for(var i=0;i<5;i++){
    arr.push({x:rand(30,W-30),y:rand(20,H*.62),s:rand(1.6,2.6),
      col:[ '#bfe6ff','#ffe9c2','#d8c8ff','#ffffff','#c8f0ff' ][i%5],
      ph:rand(0,TAU),sp:rand(.012,.026)});
  }
  return arr;
}
function drawFlareStar(fs,t){
  var tw=.55+Math.sin(t*fs.sp+fs.ph)*.45;
  var r=fs.s*(2.2+tw*1.6);
  ctx.save();ctx.translate(fs.x,fs.y);ctx.globalAlpha=.35+tw*.65;
  ctx.fillStyle=fs.col;ctx.shadowBlur=8+tw*6;ctx.shadowColor=fs.col;
  ctx.beginPath();ctx.arc(0,0,fs.s*.9,0,TAU);ctx.fill();
  ctx.globalAlpha=(.18+tw*.3);
  ctx.fillRect(-r,-.55,r*2,1.1);
  ctx.fillRect(-.55,-r,1.1,r*2);
  ctx.restore();
}
var _nebula=null;
var NEB_M=34; // margin baked around the nebula canvas, so a slow drift never exposes an edge
/*
  Rebuilt at W+2*margin so drawBG can drift the draw position a few pixels each
  frame — the nebula was one static image before, which read as a photo backdrop
  rather than a place the camera was sitting in. More colour and more blobs too:
  four flat blobs read as a gradient test pattern, seven overlapping ones at
  varied radii and warmth read as gas.
*/
function buildNebula(){
  var w=W+NEB_M*2,h=H+NEB_M*2;
  var nc=document.createElement('canvas');nc.width=w;nc.height=h;
  var nx=nc.getContext('2d');
  var bgg=nx.createLinearGradient(0,0,0,h);
  bgg.addColorStop(0,'#050214');bgg.addColorStop(.55,'#020108');bgg.addColorStop(1,'#010005');
  nx.fillStyle=bgg;nx.fillRect(0,0,w,h);
  [
    [w*.18,h*.12,150,'rgba(46,0,110,.5)'],
    [w*.5,h*.08,120,'rgba(0,60,140,.32)'],
    [w*.82,h*.28,170,'rgba(0,20,100,.4)'],
    [w*.62,h*.58,190,'rgba(70,0,55,.34)'],
    [w*.14,h*.62,140,'rgba(0,40,110,.32)'],
    [w*.9,h*.78,130,'rgba(90,0,120,.28)'],
    [w*.38,h*.86,160,'rgba(0,10,60,.4)']
  ].forEach(function(c){
    var g=nx.createRadialGradient(c[0],c[1],0,c[0],c[1],c[2]);g.addColorStop(0,c[3]);g.addColorStop(.6,c[3].replace(/,[.\d]+\)/,',.12)'));g.addColorStop(1,'rgba(0,0,0,0)');
    nx.fillStyle=g;nx.beginPath();nx.arc(c[0],c[1],c[2],0,TAU);nx.fill();
  });
  // Faint dust-lane streaks, so the gas reads as structured rather than smooth blobs
  nx.save();nx.globalAlpha=.5;
  for(var i=0;i<5;i++){
    var yy=rand(h*.1,h*.9),amp=rand(20,50),len=rand(w*.4,w*.75),x0=rand(-20,w*.3);
    var g2=nx.createLinearGradient(x0,yy,x0+len,yy);
    g2.addColorStop(0,'rgba(0,0,0,0)');g2.addColorStop(.5,'rgba(120,60,200,.10)');g2.addColorStop(1,'rgba(0,0,0,0)');
    nx.strokeStyle=g2;nx.lineWidth=rand(30,70);nx.beginPath();
    nx.moveTo(x0,yy);nx.quadraticCurveTo(x0+len*.5,yy+amp,x0+len,yy-amp*.4);nx.stroke();
  }
  nx.restore();
  _nebula=nc;
}

/*
  A distant moon, baked once like the nebula. It anchors the scene the way a
  flat starfield cannot: something large, lit from one side, that the rest of
  the composition can sit in front of.
*/
var _moon=null;
function buildMoon(){
  var r=132,pad=18,d=(r+pad)*2;
  var mc=document.createElement('canvas');mc.width=d;mc.height=d;
  var mx=mc.getContext('2d');
  mx.translate(pad+r,pad+r);
  var body=mx.createRadialGradient(-r*.35,-r*.35,r*.15,0,0,r);
  body.addColorStop(0,'#3a3550');body.addColorStop(.45,'#211d34');body.addColorStop(.8,'#0e0c1c');body.addColorStop(1,'#050410');
  mx.fillStyle=body;mx.beginPath();mx.arc(0,0,r,0,TAU);mx.fill();
  // Craters — a few soft dark circles, off the lit edge
  [[r*.2,r*.1,r*.16],[-r*.1,r*.35,r*.1],[r*.42,-r*.18,r*.09],[-r*.35,-r*.28,r*.13]].forEach(function(c){
    var cg=mx.createRadialGradient(c[0]-c[2]*.3,c[1]-c[2]*.3,0,c[0],c[1],c[2]);
    cg.addColorStop(0,'rgba(0,0,0,.38)');cg.addColorStop(1,'rgba(0,0,0,0)');
    mx.fillStyle=cg;mx.beginPath();mx.arc(c[0],c[1],c[2],0,TAU);mx.fill();
  });
  // Rim light from the upper-left, where the wordmark's own glow "lights" it
  mx.save();mx.globalCompositeOperation='lighter';
  var rim=mx.createRadialGradient(-r*.55,-r*.55,0,-r*.55,-r*.55,r*1.15);
  rim.addColorStop(0,'rgba(150,190,255,.55)');rim.addColorStop(.35,'rgba(90,140,255,.16)');rim.addColorStop(1,'rgba(0,0,0,0)');
  mx.fillStyle=rim;mx.beginPath();mx.arc(0,0,r,0,TAU);mx.fill();
  mx.restore();
  // Atmosphere haze just outside the disc
  var haze=mx.createRadialGradient(0,0,r*.97,0,0,r*1.14);
  haze.addColorStop(0,'rgba(120,160,255,.22)');haze.addColorStop(1,'rgba(0,0,0,0)');
  mx.fillStyle=haze;mx.beginPath();mx.arc(0,0,r*1.14,0,TAU);mx.fill();
  _moon={c:mc,r:r,pad:pad};
}

// ─── DRAW HELPERS ─────────────────────────────────────────────────────────────
function drawBG(){
  ctx.fillStyle='#010005';ctx.fillRect(0,0,W,H);

  // The nebula breathes: a slow sine drift inside the margin baked around it,
  // so the backdrop never sits perfectly still without ever showing a seam.
  if(_nebula){
    var dx=Math.sin(gs.t*.0021)*NEB_M*.85, dy=Math.cos(gs.t*.0016)*NEB_M*.7;
    ctx.drawImage(_nebula,-NEB_M+dx,-NEB_M+dy);
  }

  // The moon sits behind the stars and drifts slower still — the classic
  // parallax cue that something in the scene is much further away than the rest.
  if(_moon){
    var mx=W*.78+Math.sin(gs.t*.0009)*10, my=H*.2+Math.cos(gs.t*.0007)*8;
    ctx.drawImage(_moon.c,mx-_moon.r-_moon.pad,my-_moon.r-_moon.pad);
  }

  gs.stars.forEach(function(layer){
    layer.forEach(function(s){
      s.y+=s.sp;if(s.y>H){s.y=-2;s.x=rand(0,W);}
      ctx.save();ctx.globalAlpha=0.4+Math.sin(s.x*.1+gs.t*.008)*.4;
      ctx.fillStyle=s.col;
      if(s.s>1){ctx.shadowBlur=3;ctx.shadowColor='#556677';}
      ctx.fillRect(s.x,s.y,s.s,s.s);ctx.restore();
    });
  });

  if(gs.flareStars)gs.flareStars.forEach(function(fs){drawFlareStar(fs,gs.t);});
}

  below — kept as drawShipVector(), since a data: URI still has to decode
  once before the first frame can use it, and this game draws its own ship
  from the very first frame after startGame().

  (alpha bounding box: 1535x1009, so there was nothing worth cropping) and

  game draws it — up to the title screen's large hero shot — at ~92KB, roughly

  ctx.beginPath();ctx.moveTo(0,-28);ctx.bezierCurveTo(4,-22,10,-12,14,-4);ctx.stroke();

  ctx.fillStyle=rGrad(-1,-16,0,9,[[0,'rgba(140,220,255,.9)'],[.5,'rgba(40,130,255,.65)'],[1,'rgba(0,15,80,.3)']]);
  ctx.beginPath();ctx.moveTo(0,-24);ctx.bezierCurveTo(5,-20,7,-10,6,-2);ctx.bezierCurveTo(3,0,0,0,0,0);ctx.bezierCurveTo(0,0,-3,0,-6,-2);ctx.bezierCurveTo(-7,-10,-5,-20,0,-24);ctx.fill();
}

function drawShipBody(flicker){
  if(_shipImgReady)drawShipRaster();
  else drawShipVector(flicker);
}

function drawShip(){
  var p=gs.player;
  if(p.inv>0&&Math.floor(p.inv/4)%2)return;
  ctx.save();ctx.translate(p.x,p.y);
  drawShipBody(gs.t*.28);
  // Shield
  if(p.shield>0){
    ctx.save();ctx.strokeStyle='rgba(0,200,255,'+(0.4+(p.shield/320)*.35)+')';ctx.lineWidth=1.8;
    ctx.beginPath();for(var hi=0;hi<6;hi++){var ha=hi/6*TAU-Math.PI/2,hr=48;if(!hi)ctx.moveTo(Math.cos(ha)*hr,Math.sin(ha)*hr);else ctx.lineTo(Math.cos(ha)*hr,Math.sin(ha)*hr);}
    ctx.closePath();ctx.stroke();ctx.restore();
  }
  ctx.restore();
}
