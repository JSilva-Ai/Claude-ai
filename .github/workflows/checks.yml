name: checks

# Every push and every pull request. The visual and accessibility suites are
# the ones that actually catch regressions here — a type error is rarely how
# this site breaks; a shifted baseline or a silent contrast drop is.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# Build and test at the base path the site is actually deployed under. Building
# at "/" here while deploy.yml builds at "/<repo>/" would leave every
# base-relative URL — which is all of them, since links go through lib/url.ts —
# untested in exactly the configuration that ships.
# scripts/ci.mjs defaults to this base and passes it to both the build and the
# preview server. It is repeated here so the value is visible in the run's log
# and so any step added later inherits it rather than guessing.
env:
  BASE_PATH: /Claude-ai/

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # The media is committed as ordinary blobs — the clip and stills are a
      # little over a megabyte and only change when the game is re-captured, so
      # LFS earns nothing here. lfs:true is kept purely as a safety net: if
      # anyone does route *.webm/*.mp4 through LFS later, checkout defaults to
      # false and CI would silently test 130-byte pointer files while the deploy
      # published them as "videos".
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only Chromium; the suites all drive it directly.
      - run: npx playwright install --with-deps chromium

      # One command, and the same one a person runs locally.
      #
      # This used to be five separate steps — check, build, serve, a11y over a
      # hand-written route list, then the visual sweep — which is how the
      # accessibility step came to be checking eight routes months after there
      # were thirteen, and how a base-path bug reached main: every local run had
      # been at "/" while this file quietly built at /Claude-ai/. Both failures
      # were the same failure, a second definition drifting from the first.
      #
      # scripts/ci.mjs is now the only definition. `npm run ci` here and `npm
      # run ci` on a laptop do the same work, at the same base, over the same
      # routes — which is the only arrangement where "it passed locally" is
      # worth anything.
      - name: Checks
        run: npm run ci

      # Informational: prints Core Web Vitals and measured frame rate so a
      # regression is visible in the log without failing the run on the noise
      # of a shared CI runner.
      # Informational, and outside `npm run ci` on purpose: it needs its own
      # server and it must never fail the run on the noise of a shared runner.
      - name: Performance
        run: |
          BASE_PATH=/Claude-ai/ npx vite preview --port 4173 --host 127.0.0.1 &
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4173/Claude-ai/ && break; sleep 1; done
          npm run qa:perf
        continue-on-error: true

      # The screenshots are the useful artefact when a visual check fails.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: .qa/
          retention-days: 7
          if-no-files-found: ignore
