name: deploy

# Publishes the built site to GitHub Pages from whichever branch is the
# repository default, so this keeps working after the branch is merged and
# renamed. Enable it once under Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a run that is
# already publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A Pages project site is served from /<repo>/, so the build needs that
      # prefix or every runtime-built media URL 404s. A CNAME in public/ means
      # a custom domain is in use and the site sits at the root instead.
      - name: Resolve base path
        id: base
        run: |
          if [ -f public/CNAME ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
            echo "Custom domain present — building for the domain root."
          else
            echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
            echo "Project site — building for /${GITHUB_REPOSITORY#*/}/"
          fi

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      # enablement turns Pages on if it is not already, so the first deploy
      # does not require someone to visit the settings page first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
