<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VOID STRIKER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;}
body{overflow:hidden;touch-action:none;user-select:none;}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
canvas{display:block;image-rendering:crisp-edges;}

/* Modal overlay */
#modal{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(0,0,10,0.88);
  align-items:center;justify-content:center;
}
#modal.open{display:flex;}
#modal-box{
  background:linear-gradient(160deg,#000d28,#000820);
  border:1px solid rgba(0,180,255,0.35);
  box-shadow:0 0 60px rgba(0,80,200,0.25),inset 0 0 40px rgba(0,20,80,0.4);
  border-radius:4px;
  padding:48px 52px;
  min-width:320px;max-width:min(480px,90vw);
  max-height:90vh;overflow-y:auto;
  position:relative;text-align:center;font-family:'Share Tech Mono',monospace;
}
#modal-close{
  position:absolute;top:16px;right:20px;
  background:none;border:none;cursor:pointer;
  font-size:22px;color:rgba(0,160,200,0.5);
  transition:color .2s;line-height:1;
}
#modal-close:hover{color:#00e5ff;}
.modal-title{
  font-family:'Orbitron',monospace;font-size:20px;font-weight:900;
  letter-spacing:4px;margin-bottom:32px;
  color:#00e5ff;text-shadow:0 0 18px rgba(0,180,255,0.6);
}
/* Big action buttons */
.mbtn{
  display:block;width:100%;margin:12px 0;
  padding:16px 0;
  font-family:'Orbitron',monospace;font-size:14px;
  letter-spacing:3px;text-transform:uppercase;cursor:pointer;
  background:rgba(0,20,60,0.7);
  border:1px solid rgba(0,180,255,0.3);
  color:#00ccff;
  transition:all .18s;
}
.mbtn:hover,.mbtn:active{
  background:rgba(0,50,140,0.8);
  border-color:rgba(0,220,255,0.7);
  color:#fff;box-shadow:0 0 16px rgba(0,180,255,0.4);
}
.mbtn.danger{border-color:rgba(255,60,80,0.4);color:#ff7090;}
.mbtn.danger:hover{background:rgba(80,0,30,0.8);border-color:#ff4060;box-shadow:0 0 16px rgba(255,0,60,0.4);}
.mbtn.green{border-color:rgba(0,255,140,0.3);color:#00ffaa;}
.mbtn.green:hover{background:rgba(0,60,40,0.8);border-color:#00ffaa;}
.mbtn.yellow{border-color:rgba(255,200,0,0.3);color:#ffdd44;}
.mbtn.yellow:hover{background:rgba(60,40,0,0.8);border-color:#ffdd44;}
.mbtn:disabled{opacity:.4;cursor:default;box-shadow:none;}
.mbtn:disabled:hover{background:rgba(0,20,60,0.7);border-color:rgba(0,180,255,0.3);color:#00ccff;}
.mbtn.green:disabled:hover{background:rgba(0,20,60,0.7);border-color:rgba(0,255,140,0.3);color:#00ffaa;}
.mbtn.yellow:disabled:hover{background:rgba(0,20,60,0.7);border-color:rgba(255,200,0,0.3);color:#ffdd44;}

/* Leaderboard table */
.lb-table{width:100%;border-collapse:collapse;margin:8px 0 20px;}
.lb-table th{
  font-size:11px;letter-spacing:2px;color:rgba(0,180,255,0.6);
  padding:8px 10px;text-align:left;
  border-bottom:1px solid rgba(0,120,180,0.2);
}
.lb-table td{padding:11px 10px;font-size:14px;color:rgba(165,215,255,0.85);}
.lb-table tr:first-child td{color:#ffd700;}
.lb-table tr:nth-child(2) td{color:#c0c0c0;}
.lb-table tr:nth-child(3) td{color:#cd7f32;}
.lb-table tr.me td{color:#ffe566;font-weight:bold;}
.lb-table .rank{color:inherit!important;font-size:16px;width:40px;}
.lb-table .sc{text-align:right;font-family:'Orbitron',monospace;font-size:13px;}
.lb-empty{padding:30px;color:rgba(0,150,205,0.5);font-size:13px;letter-spacing:2px;}

/* Name input */
.name-wrap{margin:20px 0 28px;}
.name-input{
  background:rgba(0,16,44,0.85);border:1px solid rgba(0,180,255,0.4);
  color:#00e5ff;font-family:'Share Tech Mono',monospace;
  font-size:17px;letter-spacing:4px;text-align:center;
  padding:14px 16px;width:100%;outline:none;text-transform:uppercase;
  margin-bottom:16px;
}
.name-input::placeholder{color:rgba(0,120,180,0.25);}

/* Achievement grid */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 20px;}
.ach-card{
  background:rgba(0,10,30,0.7);
  border:1px solid rgba(255,140,0,0.2);
  border-radius:3px;padding:14px 12px;text-align:left;
}
.ach-card.done{border-color:rgba(255,140,0,0.5);}
.ach-card.locked{opacity:0.35;}
.ach-icon{font-size:24px;margin-bottom:7px;}
.ach-name{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:.5px;color:#ffcc66;margin-bottom:5px;}
.ach-desc{font-size:11px;color:rgba(225,140,40,0.8);line-height:1.5;}

/* Diff selector */
.diff-row{display:flex;gap:10px;margin:24px 0 32px;}
.diff-btn{
  flex:1;padding:18px 0;cursor:pointer;
  font-family:'Orbitron',monospace;font-size:13px;letter-spacing:1px;
  background:rgba(0,12,36,0.7);border:1px solid rgba(0,120,180,0.25);
  color:rgba(140,180,220,0.55);transition:all .18s;
}
.diff-btn.sel-easy{background:rgba(0,50,30,0.8);border-color:#00ff88;color:#00ff88;box-shadow:0 0 14px rgba(0,255,130,0.2);}
.diff-btn.sel-normal{background:rgba(50,40,0,0.8);border-color:#ffee00;color:#ffee00;box-shadow:0 0 14px rgba(255,220,0,0.2);}
.diff-btn.sel-hard{background:rgba(60,0,20,0.8);border-color:#ff4060;color:#ff4060;box-shadow:0 0 14px rgba(255,30,60,0.2);}
.diff-btn:hover{opacity:.85;}

/* Volume slider pill */
.vol-row{display:flex;align-items:center;gap:14px;margin-top:28px;padding-top:24px;border-top:1px solid rgba(0,100,160,0.2);}
.vol-label{font-size:12px;letter-spacing:2px;color:rgba(0,165,205,0.65);min-width:38px;}
.vol-slider{
  flex:1;-webkit-appearance:none;appearance:none;height:3px;
  background:rgba(0,100,160,0.4);outline:none;border-radius:2px;cursor:pointer;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:#00ccff;cursor:pointer;box-shadow:0 0 8px rgba(0,180,255,0.6);
}
.mute-btn{
  background:none;border:none;cursor:pointer;font-size:18px;
  color:rgba(0,180,255,0.55);transition:all .15s;
}
.mute-btn:hover{color:#00e5ff;}

/* Pause screen stats */
.pz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 18px;}
.pz-cell{background:rgba(0,10,30,.7);border:1px solid rgba(0,140,200,.22);padding:12px 10px;border-radius:3px;}
.pz-k{font-size:11px;letter-spacing:2px;color:rgba(0,175,220,.6);margin-bottom:6px;}
.pz-v{font-family:'Orbitron',monospace;font-size:17px;color:#9fdcff;letter-spacing:1px;}

/* Toast */
.hub-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;text-align:left;}
.hub-avatar{
  width:52px;height:52px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#2a6fff,#050c24);
  border:2px solid rgba(0,200,255,.55);box-shadow:0 0 16px rgba(0,160,255,.35);
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.hub-id{flex:1;min-width:0;}
.hub-name{font-family:'Orbitron',monospace;font-size:14px;letter-spacing:2px;color:#eaf6ff;}
.hub-rank{font-size:11px;letter-spacing:2px;color:#ffcc44;margin:3px 0 6px;}
.hub-xpbar{height:5px;background:rgba(0,60,100,.5);border-radius:3px;overflow:hidden;}
.hub-xpfill{height:100%;background:linear-gradient(90deg,#00ccff,#7a5cff);}
.hub-lv{
  font-family:'Orbitron',monospace;font-size:13px;color:#00e5ff;text-align:center;
  border:1px solid rgba(0,200,255,.4);border-radius:50%;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.hub-scrap{
  display:flex;align-items:center;justify-content:flex-end;gap:6px;
  font-family:'Orbitron',monospace;font-size:13px;color:#ffdd44;margin-bottom:16px;
}
.hub-daily{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:rgba(0,16,40,.7);border:1px solid rgba(0,180,255,.25);
  border-radius:3px;padding:12px 14px;margin-bottom:20px;text-align:left;
}
.hub-daily-lbl{font-size:11px;letter-spacing:2px;color:rgba(0,180,255,.7);}
.hub-daily-amt{font-family:'Orbitron',monospace;font-size:15px;color:#ffdd44;margin-top:3px;}
.hub-daily-cd{font-family:'Orbitron',monospace;font-size:13px;color:rgba(160,200,230,.6);}
.hub-daily-btn{
  font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;
  padding:9px 14px;background:rgba(0,60,40,.7);border:1px solid #00ffaa;color:#00ffaa;
  cursor:pointer;white-space:nowrap;
}
.hub-daily-btn:disabled{opacity:.35;cursor:default;border-color:rgba(0,150,205,.3);color:rgba(0,150,205,.5);}
.hub-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
.hub-nav .mbtn{margin:0;font-size:12px;padding:15px 6px;}
.wpn-row{
  display:flex;align-items:center;gap:12px;
  background:rgba(0,10,30,.7);border:1px solid rgba(0,140,200,.22);
  border-radius:3px;padding:12px 14px;margin-bottom:10px;text-align:left;
}
.wpn-icon{font-size:20px;flex:none;width:26px;text-align:center;color:#00e5ff;text-shadow:0 0 8px rgba(0,180,255,.5);}
.wpn-info{flex:1;min-width:0;}
.wpn-name{font-family:'Orbitron',monospace;font-size:12px;letter-spacing:1px;color:#9fdcff;}
.wpn-lv{font-size:11px;color:rgba(160,200,230,.55);margin:4px 0 6px;}
.wpn-bar{height:4px;background:rgba(0,60,100,.5);border-radius:2px;overflow:hidden;}
.wpn-fill{height:100%;background:linear-gradient(90deg,#00ccff,#00ffaa);}
.wpn-buy{
  flex:none;font-family:'Orbitron',monospace;font-size:11px;letter-spacing:1px;
  padding:10px 12px;background:rgba(0,50,140,.7);border:1px solid rgba(0,200,255,.5);
  color:#00e5ff;cursor:pointer;white-space:nowrap;
}
.wpn-buy:disabled{opacity:.35;cursor:default;}
.wpn-buy.maxed{background:rgba(0,60,40,.6);border-color:#00ffaa;color:#00ffaa;}
.hangar-stage{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px;}
.hangar-arrow{
  background:rgba(0,20,60,.7);border:1px solid rgba(0,180,255,.35);color:#00ccff;
  font-size:20px;width:38px;height:64px;cursor:pointer;flex:none;
}
.hangar-arrow:disabled{opacity:.25;cursor:default;}
.hangar-canvas{background:radial-gradient(circle at 50% 40%,#160a3e,#04010c);border-radius:4px;}
.hangar-name{font-family:'Orbitron',monospace;font-size:14px;letter-spacing:2px;color:#eaf6ff;margin-bottom:4px;}
.hangar-lock{font-size:12px;color:rgba(160,200,230,.6);margin-bottom:16px;min-height:16px;}

/* Toast */
#toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
  background:rgba(10,4,0,0.97);border:1px solid rgba(255,140,0,0.55);
  color:#ffcc44;font-family:'Share Tech Mono',monospace;
  font-size:14px;letter-spacing:2px;padding:14px 26px;
  z-index:200;display:none;white-space:nowrap;
  box-shadow:0 0 24px rgba(255,100,0,0.25);
}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="modal">
  <div id="modal-box">
    <button id="modal-close">&#10005;</button>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){'use strict';

// ─── CANVAS SETUP ────────────────────────────────────────────────────────────
var W=520,H=720;
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var DPR=Math.min(window.devicePixelRatio||1,3);
canvas.width=W*DPR;canvas.height=H*DPR;
ctx.scale(DPR,DPR);

/*
  The canvas is a fixed 520x720 that gets letterboxed to fit, so a phone does not
  give the game a different layout — it gives it the same layout, smaller. _scale
  records how much smaller, which is what turns a size in game units into a size
  in points: on a 390pt-wide iPhone it is 0.75, so a 60-unit button is 45pt and a
  10-unit caption is 7.5pt. Every type decision in this file is made against it.
*/
var _scale=1;
function resize(){
  _scale=Math.min(window.innerWidth/W,window.innerHeight/H);
  canvas.style.width=Math.floor(W*_scale)+'px';
  canvas.style.height=Math.floor(H*_scale)+'px';
}
resize();
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});

// ─── AUDIO ENGINE ─────────────────────────────────────────────────────────────
var AC=null,_ready=false,_vol=0.65;
var _muted=false;
try{_muted=localStorage.getItem('vs_mute')==='1';_vol=parseFloat(localStorage.getItem('vs_vol')||'0.65');}catch(e){}

function initAC(){
  if(_ready)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    _ready=true;
    if(gs.phase==='title')setTimeout(musicStart,200);
  }catch(e){}
}
function _wake(){if(AC&&AC.state==='suspended')AC.resume();}

/* master vol */
var _masterGain=null;
function _master(){
  if(!_ready)return null;
  if(!_masterGain){_masterGain=AC.createGain();_masterGain.connect(AC.destination);}
  _masterGain.gain.value=_muted?0:_vol;
  return _masterGain;
}

function osc(freq,type,dur,vol,freq2){
  if(!_ready||_muted)return;_wake();
  var m=_master();if(!m)return;
  try{
    var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    if(freq2)o.frequency.exponentialRampToValueAtTime(freq2,t+dur*0.7);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(m);
    o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function noise(dur,vol,cutoff){
  if(!_ready||_muted)return;_wake();
  var m=_master();if(!m)return;
  try{
    var t=AC.currentTime,sr=AC.sampleRate,n=Math.ceil(sr*dur);
    var buf=AC.createBuffer(1,n,sr),d=buf.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    var src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    f.type='lowpass';f.frequency.value=cutoff||2000;
    src.buffer=buf;src.connect(f);f.connect(g);g.connect(m);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.start(t);
  }catch(e){}
}

// ─── SPACE MUSIC — cinematic ambient with melody ───────────────────────────
/*
  Architecture:
  A. Reverb tail  — synthetic IR convolver, ~3 s decay, used by pads + melody
  B. Pad layer    — 4-note chord (Am pentatonic: A3 C4 E4 G4) voiced across
                    8 slightly-detuned sines. Slow volume LFO for breathing.
                    LP-filtered to keep it airy, no bass rumble.
  C. Bell melody  — triangle oscillator, short sharp attack, long release,
                    plays a 24-note repeating phrase in A minor pentatonic.
                    Each note has vibrato + tiny pitch-envelope for realism.
  D. Shimmer      — very high-pass-filtered noise trickle for "space air".
                    Low gain, adds presence without harshness.
  No sub-bass. No heavy rumble. Clean, light, cinematic.
*/
var _music=null;
var _wantIntensity=0;   // 0 = ambient (title/menus), 1 = driving (in a run)

/*
  Intensity is remembered outside _music so that a track started later — the
  player unmutes mid-run, or the audio context only unlocks on the first tap —
  comes up at the right intensity rather than as title music over a firefight.
*/
function musicIntensity(v){
  _wantIntensity=v;
  if(_music)_music.intensity=v;
}

// A-minor pentatonic: A C D E G  (two octaves for melody range)
var _PENTA=[220,261.6,293.7,329.6,392,440,523.3,587.3,659.3,784,880];

// 24-note melody phrase (indices into _PENTA). Chosen for a hopeful-melancholy feel.
var _PHRASE=[4,5,6,5,4,2,3,4,3,2,0,2,3,5,4,3,2,4,6,5,4,3,5,4];

// Chord: Am7 voicing — A3 C4 E4 G4 (no bass, just upper harmony)
var _CHORD_FREQS=[220,261.6,329.6,392];

function musicStart(){
  if(!_ready||_music||_muted)return;
  try{
    var ac=AC;
    var m=_master();if(!m)return;

    // ── Music master bus (fade in over 3s) ──
    var bus=ac.createGain();
    bus.gain.setValueAtTime(0,ac.currentTime);
    bus.gain.linearRampToValueAtTime(0.42,ac.currentTime+3.0);
    bus.connect(m);

    // ── A. Reverb (3-second exponential IR) ──
    var sr=ac.sampleRate;
    var revSecs=3.0, revLen=Math.ceil(sr*revSecs);
    var revBuf=ac.createBuffer(2,revLen,sr);
    for(var ch=0;ch<2;ch++){
      var d=revBuf.getChannelData(ch);
      for(var i=0;i<revLen;i++){
        // exponential decay envelope on white noise
        d[i]=(Math.random()*2-1)*Math.pow(1-i/revLen,2.2)*0.9;
      }
    }
    var conv=ac.createConvolver();conv.buffer=revBuf;
    var convGain=ac.createGain();convGain.gain.value=0.55;
    conv.connect(convGain);convGain.connect(bus);

    // ── B. Pad layer ──
    // 8 slightly detuned sines across the 4 chord tones, triangle waveshape for softness
    var padBus=ac.createGain();padBus.gain.value=1;
    // LP filter to remove any harshness, cutoff ~1800 Hz
    var padLP=ac.createBiquadFilter();padLP.type='lowpass';padLP.frequency.value=1800;padLP.Q.value=0.5;
    padBus.connect(padLP);padLP.connect(bus);padLP.connect(conv);

    // Slow breathing LFO on pad volume (0.06 Hz → period ~16s)
    var breathLFO=ac.createOscillator();breathLFO.type='sine';breathLFO.frequency.value=0.062;
    var breathLFOG=ac.createGain();breathLFOG.gain.value=0.055; // ±5.5% amplitude swing
    breathLFO.connect(breathLFOG);breathLFOG.connect(padBus.gain);
    breathLFO.start();

    var padOscs=[];
    _CHORD_FREQS.forEach(function(baseFreq,ci){
      // Two detuned sines per chord note (in tune and +8 cents sharp)
      [1.0, 1.0046].forEach(function(detune,di){
        var o=ac.createOscillator();
        o.type='triangle'; // triangle = sine-like but with light odd harmonics, softer than square
        o.frequency.value=baseFreq*detune;
        var g=ac.createGain();
        // Outer notes quieter for natural voicing
        g.gain.value=ci===0||ci===3 ? 0.11 : 0.09;
        o.connect(g);g.connect(padBus);
        o.start();
        padOscs.push(o);
      });
    });

    // ── C. Bell/lead melody ──
    var melBus=ac.createGain();melBus.gain.value=1;
    melBus.connect(bus);melBus.connect(conv); // wet + dry

    var _timers={mel:null,melStart:null,shimmer:null,pulse:null};

    var _melIdx=0;
    // BPM=72, 1 beat=833ms. Melody uses varied note lengths.
    var _NOTE_DUR=[833,833,1250,833,833,1250,1083,833,833,1250,833,1083,833,833,1666,833,833,833,1250,833,833,1083,833,1250];

    function playMelNote(){
      if(!_music)return;
      var idx=_melIdx%_PHRASE.length;
      var freq=_PENTA[_PHRASE[idx]];
      var dur=(_NOTE_DUR[idx%_NOTE_DUR.length])/1000;

      if(!_muted){
        var t=ac.currentTime;
        var o=ac.createOscillator();
        o.type='triangle';
        o.frequency.setValueAtTime(freq*0.998,t);
        o.frequency.linearRampToValueAtTime(freq,t+0.02);

        var vibLFO=ac.createOscillator();vibLFO.type='sine';vibLFO.frequency.value=5.2;
        var vibG=ac.createGain();vibG.gain.setValueAtTime(0,t);
        vibG.gain.linearRampToValueAtTime(0,t+dur*0.6);
        vibG.gain.linearRampToValueAtTime(3.5,t+dur*0.85);
        vibLFO.connect(vibG);vibG.connect(o.frequency);
        vibLFO.start(t);vibLFO.stop(t+dur+0.05);

        var g=ac.createGain();
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.22,t+0.018);
        g.gain.exponentialRampToValueAtTime(0.001,t+dur*1.6);

        o.connect(g);g.connect(melBus);
        o.start(t);o.stop(t+dur*1.7);
      }

      _melIdx++;
      _timers.mel=setTimeout(playMelNote,_NOTE_DUR[idx%_NOTE_DUR.length]);
    }
    _timers.melStart=setTimeout(playMelNote,4000);

    // ── E. Sub-bass ──
    /*
      The original arrangement deliberately had no low end at all. On a laptop it
      reads as airy; on a phone speaker it reads as thin, and on anything with a
      woofer it reads as missing. This adds a root-A sub (55 Hz sine) with a
      110 Hz triangle above it for the harmonic that small speakers can actually
      reproduce, low-passed so it never muddies the pad.
    */
    var bassBus=ac.createGain();
    var bassLP=ac.createBiquadFilter();bassLP.type='lowpass';bassLP.frequency.value=190;bassLP.Q.value=0.7;
    bassBus.connect(bassLP);bassLP.connect(bus);
    bassBus.gain.setValueAtTime(0,ac.currentTime);
    bassBus.gain.linearRampToValueAtTime(0.5,ac.currentTime+4.0);
    [[55,'sine',0.30],[110,'triangle',0.10]].forEach(function(cfg){
      var o=ac.createOscillator();o.type=cfg[1];o.frequency.value=cfg[0];
      var g=ac.createGain();g.gain.value=cfg[2];
      o.connect(g);g.connect(bassBus);o.start();padOscs.push(o);
    });
    // A slow swell so the low end breathes with the pad instead of droning flat.
    var bassLFO=ac.createOscillator();bassLFO.type='sine';bassLFO.frequency.value=0.045;
    var bassLFOG=ac.createGain();bassLFOG.gain.value=0.22;
    bassLFO.connect(bassLFOG);bassLFOG.connect(bassBus.gain);bassLFO.start();

    // ── F. Pulse ──
    /*
      A kick on the beat, gated by intensity: silent on the title screen, driving
      during a run. It is what makes the same bed feel like menu music in one
      place and combat music in the other, without a second composition or a cut.
    */
    function pulseTick(){
      if(!_music)return;
      var amp=_music.intensity;
      if(!_muted&&amp>0.01){
        try{
          var t=ac.currentTime;
          var o=ac.createOscillator();o.type='sine';
          o.frequency.setValueAtTime(125,t);
          o.frequency.exponentialRampToValueAtTime(44,t+0.13);
          var g=ac.createGain();
          g.gain.setValueAtTime(0.0001,t);
          g.gain.exponentialRampToValueAtTime(0.40*amp,t+0.012);
          g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
          o.connect(g);g.connect(bus);
          o.start(t);o.stop(t+0.42);
        }catch(e){}
      }
      _timers.pulse=setTimeout(pulseTick,833); // BPM 72 — the melody's own grid
    }
    _timers.pulse=setTimeout(pulseTick,833);

    // ── D. Shimmer (high-frequency air texture) ──
    function shimmerTick(){
      if(!_music)return;
      if(!_muted){
        try{
          var t=ac.currentTime;
          var nLen=Math.ceil(sr*0.18);
          var nBuf=ac.createBuffer(1,nLen,sr);
          var nd=nBuf.getChannelData(0);
          for(var i=0;i<nLen;i++)nd[i]=(Math.random()*2-1)*Math.pow(1-i/nLen,1.4);
          var nsrc=ac.createBufferSource();nsrc.buffer=nBuf;
          var hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=5800;hp.Q.value=0.6;
          var sg=ac.createGain();sg.gain.setValueAtTime(0.04,t);sg.gain.exponentialRampToValueAtTime(0.001,t+0.18);
          nsrc.connect(hp);hp.connect(sg);sg.connect(bus);
          nsrc.start(t);
        }catch(e){}
      }
      _timers.shimmer=setTimeout(shimmerTick,1800+Math.random()*3200);
    }
    shimmerTick();

    _music={
      bus:bus,conv:conv,
      padOscs:padOscs,breathLFO:breathLFO,
      intensity:_wantIntensity,
      stop:function(){
        clearTimeout(_timers.mel);clearTimeout(_timers.melStart);
        clearTimeout(_timers.shimmer);clearTimeout(_timers.pulse);
        padOscs.forEach(function(o){try{o.stop();}catch(e){}});
        try{breathLFO.stop();}catch(e){}
        try{bassLFO.stop();}catch(e){}
      }
    };
  }catch(e){console.warn('Music error:',e);}
}

function musicStop(){
  if(!_music)return;
  try{
    var t=AC.currentTime;
    _music.bus.gain.cancelScheduledValues(t);
    _music.bus.gain.setValueAtTime(_music.bus.gain.value,t);
    _music.bus.gain.linearRampToValueAtTime(0,t+1.5);
    var m=_music;_music=null;
    setTimeout(function(){try{m.stop();}catch(e){}},1600);
  }catch(e){}
}
function setVolume(v){
  _vol=Math.max(0,Math.min(1,v));

function setMute(m){

}

var SFX={
  /*
    Each shot is three layers: a noise click for the attack, a pitched core for
    the weapon's identity, and a short low thump for weight. The originals were
    a single thin oscillator each, which on a phone speaker is the one part of
    the spectrum that does not survive.
  */
  shoot:function(w){
    if(w==='normal'){osc(620,'square',0.045,0.075,190);osc(150,'sine',0.075,0.10,58);noise(0.02,0.05,2800);}
    else if(w==='spread'){osc(430,'square',0.045,0.07,140);osc(560,'square',0.038,0.05,175);osc(130,'sine',0.07,0.08,52);noise(0.022,0.045,2400);}

  shield:function(){osc(800,'sawtooth',0.15,0.14,60);noise(0.1,0.08,1200);},

  wave:function(){osc(60,'sine',0.7,0.16,110);osc(110,'sine',0.55,0.12,220);setTimeout(function(){osc(220,'sine',0.4,0.1,440);},280);},
  boss:function(){osc(40,'sawtooth',0.45,0.2,160);noise(0.25,0.12,380);},
  upgrade:function(){osc(440,'sine',0.09,0.15);osc(550,'sine',0.11,0.13,880);osc(660,'sine',0.13,0.11,1320);},
  gameover:function(){osc(32,'sawtooth',1.6,0.5,16);noise(0.6,0.18,180);},
  menuClick:function(){osc(400,'sine',0.06,0.12,800);}
};

// ─── PILOT PROGRESSION ─────────────────────────────────────────────────────
/*
  A second currency and a lifetime XP total, both persistent, on top of the
  credits a single run already earns and spends in its own wave-to-wave shop.
  That shop's balance was tuned carefully in an earlier pass and this does not
  touch it: SCRAP is a slower, separate meter, paid out once at game over from
  that run's score, spent on permanent weapon levels and ship skins that carry
  into every run after — rather than the in-run credits, which still reset to
  zero the moment a run ends, exactly as before.
*/
var SCRAPK='vs_scrap',XPK='vs_xp',WLVLK='vs_wlvl',SKINK='vs_skin',SKINSK='vs_skins',DAILYK='vs_daily';
var _scrap=0,_xp=0;
try{_scrap=parseInt(localStorage.getItem(SCRAPK)||'0',10)||0;}catch(e){}
try{_xp=parseInt(localStorage.getItem(XPK)||'0',10)||0;}catch(e){}
function saveScrap(){try{localStorage.setItem(SCRAPK,String(_scrap));}catch(e){}}
function saveXp(){try{localStorage.setItem(XPK,String(_xp));}catch(e){}}

var WPN_TYPES=[
  {id:'spread', name:'SPREAD SHOT',   icon:'\u2726'},
  {id:'laser',  name:'LASER CANNON',  icon:'\u26a1'},
  {id:'plasma', name:'PLASMA TORPEDO',icon:'\u2604'},
  {id:'missile',name:'MISSILE POD',   icon:'\u25b2'},
  {id:'beam',   name:'BEAM CANNON',   icon:'\u25ae'},
];
var WPN_MAXLV=5;
var _wlvl={};try{_wlvl=JSON.parse(localStorage.getItem(WLVLK)||'{}');}catch(e){}
WPN_TYPES.forEach(function(w){if(!_wlvl[w.id])_wlvl[w.id]=1;});
function saveWlvl(){try{localStorage.setItem(WLVLK,JSON.stringify(_wlvl));}catch(e){}}
function wpnCost(level){return Math.round(120*Math.pow(level,1.7));}
// A meta-progression bonus, applied on top of the in-run fire-rate stacking
// that already exists (dc.fireM, gs.fireBonus) — up to 20% faster at max
// level, so it is felt but does not dwarf what a good run already earns.
function wpnLevelMul(type){var lv=_wlvl[type]||1;return 1-0.05*(lv-1);}

var SKINS=[
  {id:'blue',   name:'STANDARD BLUE', hue:null,unlock:{type:'default'}},
  {id:'violet', name:'VOID VIOLET',   hue:265, unlock:{type:'level',v:5}},
  {id:'gold',   name:'SOLAR GOLD',    hue:45,  unlock:{type:'scrap',v:1500}},
  {id:'crimson',name:'CRIMSON ACE',   hue:350, unlock:{type:'scrap',v:3000}},
];
var _skin='blue',_skinsOwned=['blue'];
try{_skin=localStorage.getItem(SKINK)||'blue';}catch(e){}
try{_skinsOwned=JSON.parse(localStorage.getItem(SKINSK)||'[\"blue\"]');}catch(e){}
if(_skinsOwned.indexOf('blue')<0)_skinsOwned.push('blue');
function saveSkin(){try{localStorage.setItem(SKINK,_skin);}catch(e){}}
function saveSkinsOwned(){try{localStorage.setItem(SKINSK,JSON.stringify(_skinsOwned));}catch(e){}}
function skinUnlocked(id){return _skinsOwned.indexOf(id)>=0;}
var _shipSkinCache={};
/*
  Recolours the raster ship once per skin, onto an offscreen canvas, rather
  than per frame: 'hue' blend keeps the source art's own shading and metal
  highlights and only shifts the colour family, then 'destination-in' clips
  the fill back to the original silhouette's alpha so the recolour cannot
  bleed past the ship's own edges into the transparent frame around it.
*/
function _tintedShipCanvas(skin){
  if(!_shipImgReady||skin.hue==null)return null;
  if(_shipSkinCache[skin.id])return _shipSkinCache[skin.id];
  var c=document.createElement('canvas');c.width=SHIP_IMG_W;c.height=SHIP_IMG_H;
  var cx=c.getContext('2d');
  cx.drawImage(_shipImg,0,0);
  cx.globalCompositeOperation='hue';
  cx.fillStyle='hsl('+skin.hue+',85%,55%)';
  cx.fillRect(0,0,c.width,c.height);
  cx.globalCompositeOperation='destination-in';
  cx.drawImage(_shipImg,0,0);
  cx.globalCompositeOperation='source-over';
  _shipSkinCache[skin.id]=c;
  return c;
}

/*
  Level and rank both read from lifetime XP rather than store their own
  number, so neither can drift out of sync with it. The curve is quadratic —
  300*level\u00b2 — so early levels come fast, where a new player notices
  them, and it stretches out rather than becoming a wall.
*/
function pilotLevel(){return 1+Math.floor(Math.sqrt(_xp/300));}
var RANKS=[
  {min:1, name:'ROOKIE'},{min:5, name:'CADET'},{min:10,name:'VETERAN'},
  {min:15,name:'ELITE'}, {min:25,name:'ACE'},  {min:40,name:'LEGEND'},
];
function pilotRank(){
  var lv=pilotLevel(),r=RANKS[0];
  RANKS.forEach(function(x){if(lv>=x.min)r=x;});
  return r.name;
}
function xpForLevel(lv){return 300*lv*lv;}
function _syncSkinUnlocks(){
  var lv=pilotLevel(),changed=false;
  SKINS.forEach(function(sk){
    if(sk.unlock.type==='level'&&lv>=sk.unlock.v&&_skinsOwned.indexOf(sk.id)<0){_skinsOwned.push(sk.id);changed=true;}
  });
  if(changed)saveSkinsOwned();
}
_syncSkinUnlocks();

/*
  Awarded once, at game over, from that run's score and depth — not from
  whatever was left in the run's own credits, which is that system's business
  alone and stays at whatever it was (spent or not).
*/
function awardMeta(score,wave){
  var scrap=Math.round(score/30)+wave*20;
  _scrap+=scrap;_xp+=score;
  saveScrap();saveXp();_syncSkinUnlocks();
  return scrap;
}

function dailyState(){
  var d={last:0};
  try{d=JSON.parse(localStorage.getItem(DAILYK)||'{\"last\":0}');}catch(e){}
  return d;
}
function dailyReady(){return Date.now()-dailyState().last>=86400000;}
function dailyAmount(){return 250+pilotLevel()*10;}
function dailyClaim(){
  if(!dailyReady())return 0;
  var amt=dailyAmount();
  _scrap+=amt;saveScrap();
  try{localStorage.setItem(DAILYK,JSON.stringify({last:Date.now()}));}catch(e){}
  return amt;
}
function dailyRemainMs(){return Math.max(0,86400000-(Date.now()-dailyState().last));}
function fmtCountdown(ms){
  var s2=Math.floor(ms/1000),h=Math.floor(s2/3600),m=Math.floor((s2%3600)/60),ss=s2%60;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}

// ─── MODAL SYSTEM ─────────────────────────────────────────────────────────────
var _modalStack=[];
function openModal(id,html,closeable){
  initAC();
  _modalStack.push({id:id,html:html,closeable:closeable!==false});
  _renderModal();
}
function _renderModal(){
  var m=_modalStack[_modalStack.length-1];
  if(!m){closeAllModals();return;}
  document.getElementById('modal-body').innerHTML=m.html;
  document.getElementById('modal-close').style.display=m.closeable?'block':'none';
  document.getElementById('modal').classList.add('open');
  _attachModalEvents(m.id);
}
function popModal(){
  var m=_modalStack.pop();
  // Dismissing the pause screen is what resumes the run — including when the
  // dismissal comes from Android's back button through the native shim.
  if(m&&m.id==='pause')gs.paused=false;
  if(_modalStack.length)_renderModal();
  else closeAllModals();
}
function closeAllModals(){_modalStack=[];document.getElementById('modal').classList.remove('open');}
document.getElementById('modal-close').addEventListener('click',function(){popModal();SFX.menuClick();});

var _dailyTick=null;
function _clearDailyTick(){if(_dailyTick){clearInterval(_dailyTick);_dailyTick=null;}}

function _attachModalEvents(id){
  _clearDailyTick();
  if(id==='main'){
    // difficulty buttons
    [0,1,2].forEach(function(i){
      var b=document.getElementById('diff-'+i);
      if(b)b.addEventListener('click',function(){
        _sel=i;_renderDiffBtns();SFX.menuClick();
      });
    });
    var sp=document.getElementById('btn-start');
    if(sp)sp.addEventListener('click',function(){
      closeAllModals();startGame(_sel);
    });
    var lb=document.getElementById('btn-lb');
    if(lb)lb.addEventListener('click',function(){SFX.menuClick();openModal('lb',buildLBHtml());});
    var ach=document.getElementById('btn-ach');
    if(ach)ach.addEventListener('click',function(){SFX.menuClick();openModal('ach',buildAchHtml());});
    var wpn=document.getElementById('btn-wpn');
    if(wpn)wpn.addEventListener('click',function(){SFX.menuClick();openModal('weapons',buildWeaponsHtml());});
    var hg=document.getElementById('btn-hangar');
    if(hg)hg.addEventListener('click',function(){SFX.menuClick();openModal('hangar',buildHangarHtml());});
    var dc2=document.getElementById('daily-claim');
    if(dc2)dc2.addEventListener('click',function(){
      var amt=dailyClaim();
      if(amt){SFX.power();showToast('+'+amt+' SCRAP');_modalStack[_modalStack.length-1].html=buildMainHtml();_renderModal();}
    });
    var cdEl=document.getElementById('daily-cd');
    if(cdEl){
      _dailyTick=setInterval(function(){
        var el=document.getElementById('daily-cd');
        if(!el){_clearDailyTick();return;}
        if(dailyReady()){
          _clearDailyTick();
          if(_modalStack.length&&_modalStack[_modalStack.length-1].id==='main'){
            _modalStack[_modalStack.length-1].html=buildMainHtml();_renderModal();
          }
          return;
        }
        el.textContent=fmtCountdown(dailyRemainMs());
      },1000);
    }
    _renderDiffBtns();
    _wireVolume();
  }
  if(id==='weapons'){
    Array.prototype.forEach.call(document.querySelectorAll('.wpn-buy[data-wpn]'),function(b){
      b.addEventListener('click',function(){
        var t=b.getAttribute('data-wpn'),lv=_wlvl[t]||1,cost=wpnCost(lv);
        if(lv>=WPN_MAXLV||_scrap<cost)return;
        _scrap-=cost;_wlvl[t]=lv+1;saveScrap();saveWlvl();SFX.power();
        _modalStack[_modalStack.length-1].html=buildWeaponsHtml();_renderModal();
      });
    });
  }
  if(id==='hangar'){
    var prev=document.getElementById('hg-prev'),next=document.getElementById('hg-next');
    if(prev)prev.addEventListener('click',function(){if(_hangarSel>0){_hangarSel--;SFX.menuClick();_renderHangar();}});
    if(next)next.addEventListener('click',function(){if(_hangarSel<SKINS.length-1){_hangarSel++;SFX.menuClick();_renderHangar();}});
    var act=document.getElementById('hangar-action');
    if(act)act.addEventListener('click',function(){
      var skin=SKINS[_hangarSel];
      if(!skinUnlocked(skin.id)){
        if(skin.unlock.type==='scrap'&&_scrap>=skin.unlock.v){
          _scrap-=skin.unlock.v;_skinsOwned.push(skin.id);saveScrap();saveSkinsOwned();SFX.power();
        }else return;
      }else if(skin.id!==_skin){
        _skin=skin.id;saveSkin();SFX.menuClick();
      }
      _renderHangar();
    });
    _renderHangar();
  }
  if(id==='pause'){
    var pr=document.getElementById('pz-resume');
    if(pr)pr.addEventListener('click',function(){SFX.menuClick();resumeGame();});
    var pq=document.getElementById('pz-quit');
    if(pq)pq.addEventListener('click',function(){SFX.menuClick();quitToMenu();});
    _wireVolume();
  }
  if(id==='gameover'){
    var ni=document.getElementById('go-name');
    var sb=document.getElementById('go-submit');
    var rb=document.getElementById('go-retry');
    if(sb)sb.addEventListener('click',function(){
      var nm=ni?ni.value.trim():'ACE';
      lbAdd(nm,gs.score,gs.wave);
      SFX.menuClick();
      openModal('lb',buildLBHtml());
    });
    if(rb)rb.addEventListener('click',function(){closeAllModals();openModal('main',buildMainHtml(),false);});
    if(ni)ni.addEventListener('keydown',function(e){if(e.key==='Enter'&&sb)sb.click();});
    _wireVolume();
  }
}

// ─── BALANCE ──────────────────────────────────────────────────────────────────
/*
  Every difficulty curve in the game is bounded and lives here rather than as a
  magic number inside the update loop. The old curves were linear and open-ended
  — enemy drift was `dx*(1+wave*0.06)`, which is 3.4x by wave 40 and still
  climbing — so a long run stopped being hard and became arithmetic.

  waveRamp approaches `cap` and never passes it: wave 1 adds nothing, the curve
  is steep early where the player notices progression, and it flattens into a
  ceiling that is reachable and survivable. Difficulty then scales the ceiling
  rather than the slope, so EASY and HARD differ in where they settle, not in
  whether they eventually become unplayable.
*/
function waveRamp(wave,per,cap){return cap*(1-Math.exp(-per*Math.max(0,wave-1)));}

var CREDITS_BASE=50,CREDITS_PER_WAVE=12,CLEAN_WAVE_BONUS=1.2;

var BAL={
  enemyDrift  :function(w){return 1+waveRamp(w,.09,.85);},      // -> 1.85x
  enemyFireGap:function(w){return 88-waveRamp(w,.10,52);},      // -> 36 frames
  enemyBullet :function(w){return 2.4+waveRamp(w,.08,2.2);},    // -> 4.6 px/frame
  bossFireGap :function(w){return 54-waveRamp(w,.07,30);},      // -> 24 frames
  bossBullet  :function(w){return 2.8+waveRamp(w,.07,2.4);},    // -> 5.2 px/frame
};

// Ceilings for stacked upgrades, so a long run compounds without trivialising.

// ─── MATH ─────────────────────────────────────────────────────────────────────
var TAU=Math.PI*2;
function rand(a,b){return Math.random()*(b-a)+a;}
function lerp(a,b,t){return a+(b-a)*t;}
function dist(ax,ay,bx,by){return Math.sqrt((ax-bx)**2+(ay-by)**2);}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v;}
function rGrad(x,y,r0,r1,s){var g=ctx.createRadialGradient(x,y,r0,x,y,r1);s.forEach(function(st){g.addColorStop(st[0],st[1]);});return g;}
function lGrad(x1,y1,x2,y2,s){var g=ctx.createLinearGradient(x1,y1,x2,y2);s.forEach(function(st){g.addColorStop(st[0],st[1]);});return g;}

// ─── PARTICLES ────────────────────────────────────────────────────────────────
function burst(x,y,col,n,spd){
  for(var i=0;i<(n||16);i++){
    var a=rand(0,TAU),s=rand(1,spd||5);
    gs.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(1,3.5),col:col,life:1,dec:rand(0.025,0.055),type:'dot'});
  }
}
function ring(x,y,col){
  gs.parts.push({x:x,y:y,r:6,maxR:90,col:col,life:1,dec:0.05,type:'ring',vx:0,vy:0});
}

// ─── STARS ────────────────────────────────────────────────────────────────────
function makeStars(){
  var layers=[];
  [[100,0.15,0.65],[50,0.4,1.1],[18,1.0,1.9]].forEach(function(cfg){
    var arr=[];
    for(var i=0;i<cfg[0];i++)arr.push({x:rand(0,W),y:rand(0,H),s:rand(cfg[1],cfg[2]),sp:cfg[1],col:['#223344','#334455','#445566','#99aacc'][Math.floor(rand(0,4))]});
    layers.push(arr);
  });
  return layers;
}

/*
  A handful of bright "hero" stars, drawn with a four-point flare rather than a
  filled square. The plain star layers read as texture; these read as light —
  three or four of them is enough to give the field depth without it costing
  anything close to what a real starfield would.
*/
function makeFlareStars(){
  var arr=[];
  for(var i=0;i<5;i++){
    arr.push({x:rand(30,W-30),y:rand(20,H*.62),s:rand(1.6,2.6),
      col:[ '#bfe6ff','#ffe9c2','#d8c8ff','#ffffff','#c8f0ff' ][i%5],
      ph:rand(0,TAU),sp:rand(.012,.026)});
  }
  return arr;
}
function drawFlareStar(fs,t){
  var tw=.55+Math.sin(t*fs.sp+fs.ph)*.45;
  var r=fs.s*(2.2+tw*1.6);
  ctx.save();ctx.translate(fs.x,fs.y);ctx.globalAlpha=.35+tw*.65;
  ctx.fillStyle=fs.col;ctx.shadowBlur=8+tw*6;ctx.shadowColor=fs.col;
  ctx.beginPath();ctx.arc(0,0,fs.s*.9,0,TAU);ctx.fill();
  ctx.globalAlpha=(.18+tw*.3);
  ctx.fillRect(-r,-.55,r*2,1.1);
  ctx.fillRect(-.55,-r,1.1,r*2);
  ctx.restore();
}
var _nebula=null;
var NEB_M=34; // margin baked around the nebula canvas, so a slow drift never exposes an edge
/*
  Rebuilt at W+2*margin so drawBG can drift the draw position a few pixels each
  frame — the nebula was one static image before, which read as a photo backdrop
  rather than a place the camera was sitting in. More colour and more blobs too:
  four flat blobs read as a gradient test pattern, seven overlapping ones at
  varied radii and warmth read as gas.
*/
function buildNebula(){
  var w=W+NEB_M*2,h=H+NEB_M*2;
  var nc=document.createElement('canvas');nc.width=w;nc.height=h;
  var nx=nc.getContext('2d');
  var bgg=nx.createLinearGradient(0,0,0,h);
  bgg.addColorStop(0,'#050214');bgg.addColorStop(.55,'#020108');bgg.addColorStop(1,'#010005');
  nx.fillStyle=bgg;nx.fillRect(0,0,w,h);
  [
    [w*.18,h*.12,150,'rgba(46,0,110,.5)'],
    [w*.5,h*.08,120,'rgba(0,60,140,.32)'],
    [w*.82,h*.28,170,'rgba(0,20,100,.4)'],
    [w*.62,h*.58,190,'rgba(70,0,55,.34)'],
    [w*.14,h*.62,140,'rgba(0,40,110,.32)'],
    [w*.9,h*.78,130,'rgba(90,0,120,.28)'],
    [w*.38,h*.86,160,'rgba(0,10,60,.4)']
  ].forEach(function(c){
    var g=nx.createRadialGradient(c[0],c[1],0,c[0],c[1],c[2]);g.addColorStop(0,c[3]);g.addColorStop(.6,c[3].replace(/,[.\d]+\)/,',.12)'));g.addColorStop(1,'rgba(0,0,0,0)');
    nx.fillStyle=g;nx.beginPath();nx.arc(c[0],c[1],c[2],0,TAU);nx.fill();
  });
  // Faint dust-lane streaks, so the gas reads as structured rather than smooth blobs
  nx.save();nx.globalAlpha=.5;
  for(var i=0;i<5;i++){
    var yy=rand(h*.1,h*.9),amp=rand(20,50),len=rand(w*.4,w*.75),x0=rand(-20,w*.3);
    var g2=nx.createLinearGradient(x0,yy,x0+len,yy);
    g2.addColorStop(0,'rgba(0,0,0,0)');g2.addColorStop(.5,'rgba(120,60,200,.10)');g2.addColorStop(1,'rgba(0,0,0,0)');
    nx.strokeStyle=g2;nx.lineWidth=rand(30,70);nx.beginPath();
    nx.moveTo(x0,yy);nx.quadraticCurveTo(x0+len*.5,yy+amp,x0+len,yy-amp*.4);nx.stroke();
  }
  nx.restore();
  _nebula=nc;
}

/*
  A distant moon, baked once like the nebula. It anchors the scene the way a
  flat starfield cannot: something large, lit from one side, that the rest of
  the composition can sit in front of.
*/
var _moon=null;
function buildMoon(){
  var r=132,pad=18,d=(r+pad)*2;
  var mc=document.createElement('canvas');mc.width=d;mc.height=d;
  var mx=mc.getContext('2d');
  mx.translate(pad+r,pad+r);
  var body=mx.createRadialGradient(-r*.35,-r*.35,r*.15,0,0,r);
  body.addColorStop(0,'#3a3550');body.addColorStop(.45,'#211d34');body.addColorStop(.8,'#0e0c1c');body.addColorStop(1,'#050410');
  mx.fillStyle=body;mx.beginPath();mx.arc(0,0,r,0,TAU);mx.fill();
  // Craters — a few soft dark circles, off the lit edge
  [[r*.2,r*.1,r*.16],[-r*.1,r*.35,r*.1],[r*.42,-r*.18,r*.09],[-r*.35,-r*.28,r*.13]].forEach(function(c){
    var cg=mx.createRadialGradient(c[0]-c[2]*.3,c[1]-c[2]*.3,0,c[0],c[1],c[2]);
    cg.addColorStop(0,'rgba(0,0,0,.38)');cg.addColorStop(1,'rgba(0,0,0,0)');
    mx.fillStyle=cg;mx.beginPath();mx.arc(c[0],c[1],c[2],0,TAU);mx.fill();
  });
  // Rim light from the upper-left, where the wordmark's own glow "lights" it
  mx.save();mx.globalCompositeOperation='lighter';
  var rim=mx.createRadialGradient(-r*.55,-r*.55,0,-r*.55,-r*.55,r*1.15);
  rim.addColorStop(0,'rgba(150,190,255,.55)');rim.addColorStop(.35,'rgba(90,140,255,.16)');rim.addColorStop(1,'rgba(0,0,0,0)');
  mx.fillStyle=rim;mx.beginPath();mx.arc(0,0,r,0,TAU);mx.fill();
  mx.restore();
  // Atmosphere haze just outside the disc
  var haze=mx.createRadialGradient(0,0,r*.97,0,0,r*1.14);
  haze.addColorStop(0,'rgba(120,160,255,.22)');haze.addColorStop(1,'rgba(0,0,0,0)');
  mx.fillStyle=haze;mx.beginPath();mx.arc(0,0,r*1.14,0,TAU);mx.fill();
  _moon={c:mc,r:r,pad:pad};
}

// ─── DRAW HELPERS ─────────────────────────────────────────────────────────────
function drawBG(){
  ctx.fillStyle='#010005';ctx.fillRect(0,0,W,H);

  // The nebula breathes: a slow sine drift inside the margin baked around it,
  // so the backdrop never sits perfectly still without ever showing a seam.
  if(_nebula){
    var dx=Math.sin(gs.t*.0021)*NEB_M*.85, dy=Math.cos(gs.t*.0016)*NEB_M*.7;
    ctx.drawImage(_nebula,-NEB_M+dx,-NEB_M+dy);
  }

  // The moon sits behind the stars and drifts slower still — the classic
  // parallax cue that something in the scene is much further away than the rest.
  if(_moon){
    var mx=W*.78+Math.sin(gs.t*.0009)*10, my=H*.2+Math.cos(gs.t*.0007)*8;
    ctx.drawImage(_moon.c,mx-_moon.r-_moon.pad,my-_moon.r-_moon.pad);
  }

  gs.stars.forEach(function(layer){
    layer.forEach(function(s){
      s.y+=s.sp;if(s.y>H){s.y=-2;s.x=rand(0,W);}
      ctx.save();ctx.globalAlpha=0.4+Math.sin(s.x*.1+gs.t*.008)*.4;
      ctx.fillStyle=s.col;
      if(s.s>1){ctx.shadowBlur=3;ctx.shadowColor='#556677';}
      ctx.fillRect(s.x,s.y,s.s,s.s);ctx.restore();
    });
  });

  if(gs.flareStars)gs.flareStars.forEach(function(fs){drawFlareStar(fs,gs.t);});
}

/*
  The ship's art. A supplied raster asset now, in place of the drawn hull
  below — kept as drawShipVector(), since a data: URI still has to decode
  once before the first frame can use it, and this game draws its own ship
  from the very first frame after startGame().

  The source PNG was 1536x1024 with the ship filling almost the entire frame
  (alpha bounding box: 1535x1009, so there was nothing worth cropping) and
  weighed 1.97MB. Re-encoded as WebP at 900x600 it holds up at every size this
  game draws it — up to the title screen's large hero shot — at ~92KB, roughly
  a fifth of the same dimensions as PNG. That is the one lever available on an
  image this detailed without visibly softening it: format, not resolution.

  The source art's nose pointed the wrong way — toward positive y, the same
  end this game's engine trail and the title screen's ember spawn point
  already assumed was the engine. Drawn as supplied, the ship flew backwards:
  nose toward the player, engine glow toward the enemies. Caught by screenshot
  comparison against the game's own "nose up, engine down" convention, not by
  reading the art — fixed once, by rotating the source asset 180° before the
  WebP re-encode, so no draw call needed a compensating transform.
*/
