<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VOID STRIKER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;}
body{overflow:hidden;touch-action:none;user-select:none;}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
canvas{display:block;image-rendering:crisp-edges;}

/* Modal overlay */
#modal{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(0,0,10,0.88);
  align-items:center;justify-content:center;
}
#modal.open{display:flex;}
#modal-box{
  background:linear-gradient(160deg,#000d28,#000820);
  border:1px solid rgba(0,180,255,0.35);
  box-shadow:0 0 60px rgba(0,80,200,0.25),inset 0 0 40px rgba(0,20,80,0.4);
  border-radius:4px;
  padding:48px 52px;
  min-width:320px;max-width:min(480px,90vw);
  max-height:90vh;overflow-y:auto;
  position:relative;text-align:center;font-family:'Share Tech Mono',monospace;
}
#modal-close{
  position:absolute;top:16px;right:20px;
  background:none;border:none;cursor:pointer;
  font-size:22px;color:rgba(0,160,200,0.5);
  transition:color .2s;line-height:1;
}
#modal-close:hover{color:#00e5ff;}
.modal-title{
  font-family:'Orbitron',monospace;font-size:18px;font-weight:900;
  letter-spacing:5px;margin-bottom:36px;
  color:#00e5ff;text-shadow:0 0 18px rgba(0,180,255,0.6);
}
/* Big action buttons */
.mbtn{
  display:block;width:100%;margin:12px 0;
  padding:16px 0;
  font-family:'Orbitron',monospace;font-size:12px;
  letter-spacing:4px;text-transform:uppercase;cursor:pointer;
  background:rgba(0,20,60,0.7);
  border:1px solid rgba(0,180,255,0.3);
  color:#00ccff;
  transition:all .18s;
}
.mbtn:hover,.mbtn:active{
  background:rgba(0,50,140,0.8);
  border-color:rgba(0,220,255,0.7);
  color:#fff;box-shadow:0 0 16px rgba(0,180,255,0.4);
}
.mbtn.danger{border-color:rgba(255,60,80,0.4);color:#ff7090;}
.mbtn.danger:hover{background:rgba(80,0,30,0.8);border-color:#ff4060;box-shadow:0 0 16px rgba(255,0,60,0.4);}
.mbtn.green{border-color:rgba(0,255,140,0.3);color:#00ffaa;}
.mbtn.green:hover{background:rgba(0,60,40,0.8);border-color:#00ffaa;}
.mbtn.yellow{border-color:rgba(255,200,0,0.3);color:#ffdd44;}
.mbtn.yellow:hover{background:rgba(60,40,0,0.8);border-color:#ffdd44;}

/* Leaderboard table */
.lb-table{width:100%;border-collapse:collapse;margin:8px 0 20px;}
.lb-table th{
  font-size:9px;letter-spacing:3px;color:rgba(0,180,255,0.55);
  padding:8px 10px;text-align:left;
  border-bottom:1px solid rgba(0,120,180,0.2);
}
.lb-table td{padding:10px 10px;font-size:11px;color:rgba(150,210,255,0.8);}
.lb-table tr:first-child td{color:#ffd700;}
.lb-table tr:nth-child(2) td{color:#c0c0c0;}
.lb-table tr:nth-child(3) td{color:#cd7f32;}
.lb-table tr.me td{color:#ffe566;font-weight:bold;}
.lb-table .rank{color:inherit!important;font-size:13px;width:36px;}
.lb-table .sc{text-align:right;font-family:'Orbitron',monospace;font-size:11px;}
.lb-empty{padding:30px;color:rgba(0,140,195,0.35);font-size:11px;letter-spacing:2px;}

/* Name input */
.name-wrap{margin:20px 0 28px;}
.name-input{
  background:rgba(0,16,44,0.85);border:1px solid rgba(0,180,255,0.4);
  color:#00e5ff;font-family:'Share Tech Mono',monospace;
  font-size:15px;letter-spacing:4px;text-align:center;
  padding:12px 16px;width:100%;outline:none;text-transform:uppercase;
  margin-bottom:16px;
}
.name-input::placeholder{color:rgba(0,120,180,0.25);}

/* Achievement grid */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 20px;}
.ach-card{
  background:rgba(0,10,30,0.7);
  border:1px solid rgba(255,140,0,0.2);
  border-radius:3px;padding:14px 12px;text-align:left;
}
.ach-card.done{border-color:rgba(255,140,0,0.5);}
.ach-card.locked{opacity:0.35;}
.ach-icon{font-size:20px;margin-bottom:6px;}
.ach-name{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:1px;color:#ffcc66;margin-bottom:4px;}
.ach-desc{font-size:9px;color:rgba(200,100,0,0.65);line-height:1.5;}

/* Diff selector */
.diff-row{display:flex;gap:10px;margin:24px 0 32px;}
.diff-btn{
  flex:1;padding:18px 0;cursor:pointer;
  font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;
  background:rgba(0,12,36,0.7);border:1px solid rgba(0,120,180,0.25);
  color:rgba(140,180,220,0.55);transition:all .18s;
}
.diff-btn.sel-easy{background:rgba(0,50,30,0.8);border-color:#00ff88;color:#00ff88;box-shadow:0 0 14px rgba(0,255,130,0.2);}
.diff-btn.sel-normal{background:rgba(50,40,0,0.8);border-color:#ffee00;color:#ffee00;box-shadow:0 0 14px rgba(255,220,0,0.2);}
.diff-btn.sel-hard{background:rgba(60,0,20,0.8);border-color:#ff4060;color:#ff4060;box-shadow:0 0 14px rgba(255,30,60,0.2);}
.diff-btn:hover{opacity:.85;}

/* Volume slider pill */
.vol-row{display:flex;align-items:center;gap:14px;margin-top:28px;padding-top:24px;border-top:1px solid rgba(0,100,160,0.2);}
.vol-label{font-size:10px;letter-spacing:2px;color:rgba(0,160,200,0.55);min-width:36px;}
.vol-slider{
  flex:1;-webkit-appearance:none;appearance:none;height:3px;
  background:rgba(0,100,160,0.4);outline:none;border-radius:2px;cursor:pointer;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:#00ccff;cursor:pointer;box-shadow:0 0 8px rgba(0,180,255,0.6);
}
.mute-btn{
  background:none;border:none;cursor:pointer;font-size:18px;
  color:rgba(0,180,255,0.55);transition:all .15s;
}
.mute-btn:hover{color:#00e5ff;}

/* Toast */
#toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
  background:rgba(10,4,0,0.97);border:1px solid rgba(255,140,0,0.55);
  color:#ffcc44;font-family:'Share Tech Mono',monospace;
  font-size:12px;letter-spacing:2px;padding:12px 24px;
  z-index:200;display:none;white-space:nowrap;
  box-shadow:0 0 24px rgba(255,100,0,0.25);
}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="modal">
  <div id="modal-box">
    <button id="modal-close">&#10005;</button>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){'use strict';

// ─── CANVAS SETUP ────────────────────────────────────────────────────────────
var W=520,H=720;
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var DPR=Math.min(window.devicePixelRatio||1,3);
canvas.width=W*DPR;canvas.height=H*DPR;
ctx.scale(DPR,DPR);

function resize(){
  var s=Math.min(window.innerWidth/W,window.innerHeight/H);
  canvas.style.width=Math.floor(W*s)+'px';
  canvas.style.height=Math.floor(H*s)+'px';
}
resize();
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});

// ─── AUDIO ENGINE ─────────────────────────────────────────────────────────────
var AC=null,_ready=false,_vol=0.65;
var _muted=false;
try{_muted=localStorage.getItem('vs_mute')==='1';_vol=parseFloat(localStorage.getItem('vs_vol')||'0.65');}catch(e){}

function initAC(){
  if(_ready)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    _ready=true;
    if(gs.phase==='title')setTimeout(musicStart,200);
  }catch(e){}
}
function _wake(){if(AC&&AC.state==='suspended')AC.resume();}

/* master vol */
var _masterGain=null;
function _master(){
  if(!_ready)return null;
  if(!_masterGain){_masterGain=AC.createGain();_masterGain.connect(AC.destination);}
  _masterGain.gain.value=_muted?0:_vol;
  return _masterGain;
}

function osc(freq,type,dur,vol,freq2){
  if(!_ready||_muted)return;_wake();
  var m=_master();if(!m)return;
  try{
    var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    if(freq2)o.frequency.exponentialRampToValueAtTime(freq2,t+dur*0.7);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(m);
    o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function noise(dur,vol,cutoff){
  if(!_ready||_muted)return;_wake();
  var m=_master();if(!m)return;
  try{
    var t=AC.currentTime,sr=AC.sampleRate,n=Math.ceil(sr*dur);
    var buf=AC.createBuffer(1,n,sr),d=buf.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    var src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    f.type='lowpass';f.frequency.value=cutoff||2000;
    src.buffer=buf;src.connect(f);f.connect(g);g.connect(m);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.start(t);
  }catch(e){}
}

// ─── SPACE MUSIC — cinematic ambient with melody ───────────────────────────
/*
  Architecture:
  A. Reverb tail  — synthetic IR convolver, ~3 s decay, used by pads + melody
  B. Pad layer    — 4-note chord (Am pentatonic: A3 C4 E4 G4) voiced across
                    8 slightly-detuned sines. Slow volume LFO for breathing.
                    LP-filtered to keep it airy, no bass rumble.
  C. Bell melody  — triangle oscillator, short sharp attack, long release,
                    plays a 24-note repeating phrase in A minor pentatonic.
                    Each note has vibrato + tiny pitch-envelope for realism.
  D. Shimmer      — very high-pass-filtered noise trickle for "space air".
                    Low gain, adds presence without harshness.
  No sub-bass. No heavy rumble. Clean, light, cinematic.
*/
var _music=null;

// A-minor pentatonic: A C D E G  (two octaves for melody range)
var _PENTA=[220,261.6,293.7,329.6,392,440,523.3,587.3,659.3,784,880];

// 24-note melody phrase (indices into _PENTA). Chosen for a hopeful-melancholy feel.
var _PHRASE=[4,5,6,5,4,2,3,4,3,2,0,2,3,5,4,3,2,4,6,5,4,3,5,4];

// Chord: Am7 voicing — A3 C4 E4 G4 (no bass, just upper harmony)
var _CHORD_FREQS=[220,261.6,329.6,392];

function musicStart(){
  if(!_ready||_music||_muted)return;
  try{
    var ac=AC;
    var m=_master();if(!m)return;

    // ── Music master bus (fade in over 3s) ──
    var bus=ac.createGain();
    bus.gain.setValueAtTime(0,ac.currentTime);
    bus.gain.linearRampToValueAtTime(0.42,ac.currentTime+3.0);
    bus.connect(m);

    // ── A. Reverb (3-second exponential IR) ──
    var sr=ac.sampleRate;
    var revSecs=3.0, revLen=Math.ceil(sr*revSecs);
    var revBuf=ac.createBuffer(2,revLen,sr);
    for(var ch=0;ch<2;ch++){
      var d=revBuf.getChannelData(ch);
      for(var i=0;i<revLen;i++){
        // exponential decay envelope on white noise
        d[i]=(Math.random()*2-1)*Math.pow(1-i/revLen,2.2)*0.9;
      }
    }
    var conv=ac.createConvolver();conv.buffer=revBuf;
    var convGain=ac.createGain();convGain.gain.value=0.55;
    conv.connect(convGain);convGain.connect(bus);

    // ── B. Pad layer ──
    // 8 slightly detuned sines across the 4 chord tones, triangle waveshape for softness
    var padBus=ac.createGain();padBus.gain.value=1;
    // LP filter to remove any harshness, cutoff ~1800 Hz
    var padLP=ac.createBiquadFilter();padLP.type='lowpass';padLP.frequency.value=1800;padLP.Q.value=0.5;
    padBus.connect(padLP);padLP.connect(bus);padLP.connect(conv);

    // Slow breathing LFO on pad volume (0.06 Hz → period ~16s)
    var breathLFO=ac.createOscillator();breathLFO.type='sine';breathLFO.frequency.value=0.062;
    var breathLFOG=ac.createGain();breathLFOG.gain.value=0.055; // ±5.5% amplitude swing
    breathLFO.connect(breathLFOG);breathLFOG.connect(padBus.gain);
    breathLFO.start();

    var padOscs=[];
    _CHORD_FREQS.forEach(function(baseFreq,ci){
      // Two detuned sines per chord note (in tune and +8 cents sharp)
      [1.0, 1.0046].forEach(function(detune,di){
        var o=ac.createOscillator();
        o.type='triangle'; // triangle = sine-like but with light odd harmonics, softer than square
        o.frequency.value=baseFreq*detune;
        var g=ac.createGain();
        // Outer notes quieter for natural voicing
        g.gain.value=ci===0||ci===3 ? 0.11 : 0.09;
        o.connect(g);g.connect(padBus);
        o.start();
        padOscs.push(o);
      });
    });

    // ── C. Bell/lead melody ──
    var melBus=ac.createGain();melBus.gain.value=1;
    melBus.connect(bus);melBus.connect(conv); // wet + dry

    var _timers={mel:null,melStart:null,shimmer:null};

    var _melIdx=0;
    // BPM=72, 1 beat=833ms. Melody uses varied note lengths.
    var _NOTE_DUR=[833,833,1250,833,833,1250,1083,833,833,1250,833,1083,833,833,1666,833,833,833,1250,833,833,1083,833,1250];

    function playMelNote(){
      if(!_music)return;
      var idx=_melIdx%_PHRASE.length;
      var freq=_PENTA[_PHRASE[idx]];
      var dur=(_NOTE_DUR[idx%_NOTE_DUR.length])/1000;

      if(!_muted){
        var t=ac.currentTime;
        var o=ac.createOscillator();
        o.type='triangle';
        o.frequency.setValueAtTime(freq*0.998,t);
        o.frequency.linearRampToValueAtTime(freq,t+0.02);

        var vibLFO=ac.createOscillator();vibLFO.type='sine';vibLFO.frequency.value=5.2;
        var vibG=ac.createGain();vibG.gain.setValueAtTime(0,t);
        vibG.gain.linearRampToValueAtTime(0,t+dur*0.6);
        vibG.gain.linearRampToValueAtTime(3.5,t+dur*0.85);
        vibLFO.connect(vibG);vibG.connect(o.frequency);
        vibLFO.start(t);vibLFO.stop(t+dur+0.05);

        var g=ac.createGain();
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.22,t+0.018);
        g.gain.exponentialRampToValueAtTime(0.001,t+dur*1.6);

        o.connect(g);g.connect(melBus);
        o.start(t);o.stop(t+dur*1.7);
      }

      _melIdx++;
      _timers.mel=setTimeout(playMelNote,_NOTE_DUR[idx%_NOTE_DUR.length]);
    }
    _timers.melStart=setTimeout(playMelNote,4000);

    // ── D. Shimmer (high-frequency air texture) ──
    function shimmerTick(){
      if(!_music)return;
      if(!_muted){
        try{
          var t=ac.currentTime;
          var nLen=Math.ceil(sr*0.18);
          var nBuf=ac.createBuffer(1,nLen,sr);
          var nd=nBuf.getChannelData(0);
          for(var i=0;i<nLen;i++)nd[i]=(Math.random()*2-1)*Math.pow(1-i/nLen,1.4);
          var nsrc=ac.createBufferSource();nsrc.buffer=nBuf;
          var hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=5800;hp.Q.value=0.6;
          var sg=ac.createGain();sg.gain.setValueAtTime(0.04,t);sg.gain.exponentialRampToValueAtTime(0.001,t+0.18);
          nsrc.connect(hp);hp.connect(sg);sg.connect(bus);
          nsrc.start(t);
        }catch(e){}
      }
      _timers.shimmer=setTimeout(shimmerTick,1800+Math.random()*3200);
    }
    shimmerTick();

    _music={
      bus:bus,conv:conv,
      padOscs:padOscs,breathLFO:breathLFO,
      stop:function(){
        clearTimeout(_timers.mel);clearTimeout(_timers.melStart);clearTimeout(_timers.shimmer);
        padOscs.forEach(function(o){try{o.stop();}catch(e){}});
        try{breathLFO.stop();}catch(e){}
      }
    };
  }catch(e){console.warn('Music error:',e);}
}

function musicStop(){
  if(!_music)return;
  try{
    var t=AC.currentTime;
    _music.bus.gain.cancelScheduledValues(t);
    _music.bus.gain.setValueAtTime(_music.bus.gain.value,t);
    _music.bus.gain.linearRampToValueAtTime(0,t+1.5);
    var m=_music;_music=null;
    setTimeout(function(){try{m.stop();}catch(e){}},1600);
  }catch(e){}
}
function setVolume(v){
  _vol=Math.max(0,Math.min(1,v));
  try{localStorage.setItem('vs_vol',_vol);}catch(e){}
  if(_masterGain)_masterGain.gain.value=_muted?0:_vol;
}
function setMute(m){
  _muted=m;
  try{localStorage.setItem('vs_mute',m?'1':'0');}catch(e){}
  if(_masterGain)_masterGain.gain.value=_muted?0:_vol;
  if(!_muted&&_ready&&!_music&&gs&&(gs.phase==='title'||gs.phase==='playing'))musicStart();
}

// ─── SFX ─────────────────────────────────────────────────────────────────────
var SFX={
  shoot:function(w){
    if(w==='normal'){osc(560,'square',0.04,0.07,200);osc(280,'sine',0.03,0.04,120);}
    else if(w==='spread'){osc(400,'square',0.04,0.07,140);osc(520,'square',0.035,0.05,170);}
    else if(w==='laser'){osc(1100,'sawtooth',0.07,0.09,200);}
    else if(w==='plasma'){osc(220,'sawtooth',0.09,0.1,680);osc(110,'sine',0.07,0.06,340);}
    else if(w==='missile'){osc(260,'sawtooth',0.06,0.07,90);}
    else if(w==='beam'){osc(1400,'sine',0.05,0.1,700);}
  },
  hit:function(){osc(220,'square',0.025,0.07,90);noise(0.02,0.06,1400);},
  kill:function(t){
    var ff=[440,380,320,500,280,560,420,360];
    var f=ff[t%ff.length];
    osc(f,'sine',0.05,0.12,f*0.4);noise(0.04,0.08,1600);
  },
  explode:function(big){
    if(big){osc(30,  'sine',1.4,0.45);osc(48,'sine',1.0,0.55);noise(0.9,0.48,180);}
    else   {osc(60,'sine',0.32,0.28);noise(0.24,0.22,700);}
  },
  comboUp:function(n){osc(220+n*55,'sine',0.07,0.12,440+n*80);},
  power:function(){osc(330,'sine',0.08,0.13,660);osc(440,'sine',0.1,0.11,880);osc(660,'sine',0.12,0.1,1320);},
  shield:function(){osc(800,'sawtooth',0.15,0.14,60);noise(0.1,0.08,1200);},
  bomb:function(){osc(22,'sine',1.8,0.6);osc(35,'sine',1.4,0.75);noise(0.9,0.5,140);},
  wave:function(){osc(60,'sine',0.7,0.16,110);osc(110,'sine',0.55,0.12,220);setTimeout(function(){osc(220,'sine',0.4,0.1,440);},280);},
  boss:function(){osc(40,'sawtooth',0.45,0.2,160);noise(0.25,0.12,380);},
  upgrade:function(){osc(440,'sine',0.09,0.15);osc(550,'sine',0.11,0.13,880);osc(660,'sine',0.13,0.11,1320);},
  gameover:function(){osc(32,'sawtooth',1.6,0.5,16);noise(0.6,0.18,180);},
  menuClick:function(){osc(400,'sine',0.06,0.12,800);}
};

// ─── ACHIEVEMENTS ─────────────────────────────────────────────────────────────
var ACHS=[
  {id:'first',   name:'FIRST BLOOD',   desc:'Destroy your first enemy',  icon:'💀'},
  {id:'combo5',  name:'COMBO KING',    desc:'Reach a 5x combo',           icon:'⚡'},
  {id:'wave5',   name:'DEEP SPACE',    desc:'Reach wave 5',               icon:'🌌'},
  {id:'wave10',  name:'VOID WALKER',   desc:'Reach wave 10',              icon:'🔮'},
  {id:'boss',    name:'BOSS SLAYER',   desc:'Defeat your first boss',     icon:'💥'},
  {id:'weapons', name:'ARSENAL',       desc:'Collect all weapon types',   icon:'🔫'},
  {id:'50k',     name:'HIGH SCORER',   desc:'Score 50,000 points',        icon:'⭐'},
  {id:'nohit',   name:'UNTOUCHABLE',   desc:'Clear a wave without damage',icon:'✨'},
];
var _ach={};try{_ach=JSON.parse(localStorage.getItem('vs_ach')||'{}');}catch(e){}
function saveAch(){try{localStorage.setItem('vs_ach',JSON.stringify(_ach));}catch(e){}}
function unlock(id){
  if(_ach[id])return;_ach[id]=Date.now();saveAch();
  var a=ACHS.find(function(x){return x.id===id;});
  if(a)showToast(a.icon+'  '+a.name);SFX.power();
}

// ─── LEADERBOARD ─────────────────────────────────────────────────────────────
var LBK='vs_lb';
function lbLoad(){try{return JSON.parse(localStorage.getItem(LBK)||'[]');}catch(e){return[];}}
function lbSave(r){try{localStorage.setItem(LBK,JSON.stringify(r));}catch(e){}return r;}
function lbAdd(name,score,wave){
  var r=lbLoad();
  r.push({n:name.toUpperCase().slice(0,10)||'ACE',s:score,w:wave});
  r.sort(function(a,b){return b.s-a.s;});
  return lbSave(r.slice(0,10));
}

var _toastT=null;
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(_toastT);_toastT=setTimeout(function(){t.style.display='none';},3200);

// ─── MODAL SYSTEM ─────────────────────────────────────────────────────────────
var _modalStack=[];
function openModal(id,html,closeable){
  initAC();
  _modalStack.push({id:id,html:html,closeable:closeable!==false});
  _renderModal();
}
function _renderModal(){
  var m=_modalStack[_modalStack.length-1];
  if(!m){closeAllModals();return;}
  document.getElementById('modal-body').innerHTML=m.html;
  document.getElementById('modal-close').style.display=m.closeable?'block':'none';
  document.getElementById('modal').classList.add('open');
  _attachModalEvents(m.id);
}
function popModal(){
  _modalStack.pop();
  if(_modalStack.length)_renderModal();
  else closeAllModals();
}
function closeAllModals(){_modalStack=[];document.getElementById('modal').classList.remove('open');}
document.getElementById('modal-close').addEventListener('click',function(){popModal();});

function _attachModalEvents(id){
  if(id==='main'){
    // difficulty buttons
    [0,1,2].forEach(function(i){
      var b=document.getElementById('diff-'+i);
      if(b)b.addEventListener('click',function(){
        _sel=i;_renderDiffBtns();SFX.menuClick();
      });
    });
    var sp=document.getElementById('btn-start');
    if(sp)sp.addEventListener('click',function(){
      closeAllModals();startGame(_sel);
    });
    var lb=document.getElementById('btn-lb');
    if(lb)lb.addEventListener('click',function(){SFX.menuClick();openModal('lb',buildLBHtml());});
    var ach=document.getElementById('btn-ach');
    if(ach)ach.addEventListener('click',function(){SFX.menuClick();openModal('ach',buildAchHtml());});
    _renderDiffBtns();
    // volume
    var vs=document.getElementById('vol-slider');
    if(vs){vs.value=_vol;vs.addEventListener('input',function(){setVolume(parseFloat(this.value));});}
    var mb=document.getElementById('mute-btn');
    if(mb){mb.textContent=_muted?'🔇':'🔊';mb.addEventListener('click',function(){setMute(!_muted);this.textContent=_muted?'🔇':'🔊';});}
  }
  if(id==='gameover'){
    var ni=document.getElementById('go-name');
    var sb=document.getElementById('go-submit');
    var rb=document.getElementById('go-retry');
    if(sb)sb.addEventListener('click',function(){
      var nm=ni?ni.value.trim():'ACE';
      lbAdd(nm,gs.score,gs.wave);
      SFX.menuClick();
      openModal('lb',buildLBHtml());
    });
    if(rb)rb.addEventListener('click',function(){closeAllModals();openModal('main',buildMainHtml(),false);});
    if(ni)ni.addEventListener('keydown',function(e){if(e.key==='Enter'&&sb)sb.click();});
    // vol/mute
    var vs2=document.getElementById('vol-slider');
    if(vs2){vs2.value=_vol;vs2.addEventListener('input',function(){setVolume(parseFloat(this.value));});}
    var mb2=document.getElementById('mute-btn');
    if(mb2){mb2.textContent=_muted?'🔇':'🔊';mb2.addEventListener('click',function(){setMute(!_muted);this.textContent=_muted?'🔇':'🔊';});}
  }
}

var _sel=1; // default difficulty
function _renderDiffBtns(){
  var labels=['EASY','NORMAL','HARD'];
  var cols=['easy','normal','hard'];
  [0,1,2].forEach(function(i){
    var b=document.getElementById('diff-'+i);
    if(!b)return;
    b.className='diff-btn'+(i===_sel?' sel-'+cols[i]:'');
    b.textContent=labels[i];
  });
}

function addFloat(x,y,txt,col,big){
  gs.floats.push({x:x,y:y,txt:txt,col:col||'#ffff66',sz:big?13:10,life:1,decay:big?0.02:0.026,vy:big?-1.8:-1.4});

// ─── MATH ─────────────────────────────────────────────────────────────────────
var TAU=Math.PI*2;
function rand(a,b){return Math.random()*(b-a)+a;}
function lerp(a,b,t){return a+(b-a)*t;}
function dist(ax,ay,bx,by){return Math.sqrt((ax-bx)**2+(ay-by)**2);}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v;}
function rGrad(x,y,r0,r1,s){var g=ctx.createRadialGradient(x,y,r0,x,y,r1);s.forEach(function(st){g.addColorStop(st[0],st[1]);});return g;}
function lGrad(x1,y1,x2,y2,s){var g=ctx.createLinearGradient(x1,y1,x2,y2);s.forEach(function(st){g.addColorStop(st[0],st[1]);});return g;}

// ─── PARTICLES ────────────────────────────────────────────────────────────────
function burst(x,y,col,n,spd){
  for(var i=0;i<(n||16);i++){
    var a=rand(0,TAU),s=rand(1,spd||5);
    gs.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(1,3.5),col:col,life:1,dec:rand(0.025,0.055),type:'dot'});
  }
}
function ring(x,y,col){
  gs.parts.push({x:x,y:y,r:6,maxR:90,col:col,life:1,dec:0.05,type:'ring',vx:0,vy:0});
}
function trail(x,y,col){
  gs.parts.push({x:x,y:y,vx:rand(-0.4,0.4),vy:rand(0.8,1.8),r:1.5,col:col,life:0.5,dec:0.08,type:'dot'});
}

// ─── STARS ────────────────────────────────────────────────────────────────────
function makeStars(){
  var layers=[];
  [[100,0.15,0.65],[50,0.4,1.1],[18,1.0,1.9]].forEach(function(cfg){
    var arr=[];
    for(var i=0;i<cfg[0];i++)arr.push({x:rand(0,W),y:rand(0,H),s:rand(cfg[1],cfg[2]),sp:cfg[1],col:['#223344','#334455','#445566','#99aacc'][Math.floor(rand(0,4))]});
    layers.push(arr);
  });
  return layers;
}
var _nebula=null;
function buildNebula(){
  var nc=document.createElement('canvas');nc.width=W;nc.height=H;
  var nx=nc.getContext('2d');nx.fillStyle='#000012';nx.fillRect(0,0,W,H);
  [[W*.2,H*.15,110,'rgba(28,0,65,.45)'],[W*.78,H*.3,90,'rgba(0,14,65,.4)'],[W*.5,H*.65,140,'rgba(48,0,32,.35)'],[W*.12,H*.55,80,'rgba(0,28,65,.28)']].forEach(function(c){
    var g=nx.createRadialGradient(c[0],c[1],0,c[0],c[1],c[2]);g.addColorStop(0,c[3]);g.addColorStop(1,'rgba(0,0,0,0)');
    nx.fillStyle=g;nx.beginPath();nx.arc(c[0],c[1],c[2],0,TAU);nx.fill();
  });
  _nebula=nc;
}

// ─── DRAW HELPERS ─────────────────────────────────────────────────────────────
function drawBG(){
  ctx.fillStyle='#000012';ctx.fillRect(0,0,W,H);
  if(_nebula)ctx.drawImage(_nebula,0,0);
  gs.stars.forEach(function(layer){
    layer.forEach(function(s){
      s.y+=s.sp;if(s.y>H){s.y=-2;s.x=rand(0,W);}
      ctx.save();ctx.globalAlpha=0.4+Math.sin(s.x*.1+gs.t*.008)*.4;
      ctx.fillStyle=s.col;
      if(s.s>1){ctx.shadowBlur=3;ctx.shadowColor='#556677';}
      ctx.fillRect(s.x,s.y,s.s,s.s);ctx.restore();
    });
  });
}

function drawShip(){
  var p=gs.player;
  if(p.inv>0&&Math.floor(p.inv/4)%2)return;
  ctx.save();ctx.translate(p.x,p.y);
  // Thruster
  var fl=14+Math.sin(gs.t*.28)*5;
  var fg=lGrad(0,12,0,12+fl,[[0,'rgba(255,255,255,.9)'],[.2,'rgba(100,180,255,.8)'],[.65,'rgba(40,80,255,.5)'],[1,'rgba(0,0,60,0)']]);
  ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(-3.5,12);ctx.quadraticCurveTo(-5,12+fl*.5,0,12+fl);ctx.quadraticCurveTo(5,12+fl*.5,3.5,12);ctx.fill();
  // Wings
  ctx.fillStyle=lGrad(-30,-5,0,18,[[0,'rgba(20,55,145,.95)'],[1,'rgba(8,25,70,.75)']]);
  ctx.beginPath();ctx.moveTo(10,-5);ctx.lineTo(22,6);ctx.lineTo(38,16);ctx.lineTo(30,20);ctx.lineTo(18,18);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-10,-5);ctx.lineTo(-22,6);ctx.lineTo(-38,16);ctx.lineTo(-30,20);ctx.lineTo(-18,18);ctx.closePath();ctx.fill();
  // Hull
  ctx.fillStyle=lGrad(-14,-26,14,20,[[0,'#1a3e8a'],[.4,'#2560cc'],[1,'#0a1c54']]);
  ctx.beginPath();ctx.moveTo(0,-28);ctx.bezierCurveTo(4,-22,10,-12,14,-4);ctx.lineTo(20,6);ctx.bezierCurveTo(22,10,20,14,18,16);ctx.lineTo(12,20);ctx.bezierCurveTo(8,22,4,22,4,18);ctx.lineTo(-4,18);ctx.bezierCurveTo(-4,22,-8,22,-12,20);ctx.lineTo(-18,16);ctx.bezierCurveTo(-20,14,-22,10,-20,6);ctx.lineTo(-14,-4);ctx.bezierCurveTo(-10,-12,-4,-22,0,-28);ctx.fill();
  // Canopy
  ctx.fillStyle=rGrad(-1,-16,0,9,[[0,'rgba(140,220,255,.9)'],[.5,'rgba(40,130,255,.65)'],[1,'rgba(0,15,80,.3)']]);
  ctx.beginPath();ctx.moveTo(0,-24);ctx.bezierCurveTo(5,-20,7,-10,6,-2);ctx.bezierCurveTo(3,0,0,0,0,0);ctx.bezierCurveTo(0,0,-3,0,-6,-2);ctx.bezierCurveTo(-7,-10,-5,-20,0,-24);ctx.fill();
  // Shield
  if(p.shield>0){
    ctx.save();ctx.strokeStyle='rgba(0,200,255,'+(0.4+(p.shield/320)*.35)+')';ctx.lineWidth=1.8;
    ctx.beginPath();for(var hi=0;hi<6;hi++){var ha=hi/6*TAU-Math.PI/2,hr=48;if(!hi)ctx.moveTo(Math.cos(ha)*hr,Math.sin(ha)*hr);else ctx.lineTo(Math.cos(ha)*hr,Math.sin(ha)*hr);}
    ctx.closePath();ctx.stroke();ctx.restore();
  }
  ctx.restore();
}

var EC=['#d855ff','#ffe030','#ff7020','#20ffb0','#aa55ff','#ff2244'];
function drawEnemy(e){
  if(!e.alive)return;
  ctx.save();ctx.translate(e.x,e.y);
  var c=EC[e.type%EC.length];
  var pulse=.82+Math.sin(gs.t*.1)*.18;
  if(e.boss){
    ctx.fillStyle=rGrad(0,0,5,65,[[0,'rgba(255,80,60,.95)'],[.5,'rgba(180,20,0,.88)'],[1,'rgba(50,0,0,.55)']]);
    ctx.beginPath();ctx.moveTo(0,-52);ctx.lineTo(28,-36);ctx.lineTo(52,-18);ctx.lineTo(60,8);ctx.lineTo(52,32);ctx.lineTo(28,48);ctx.lineTo(0,52);ctx.lineTo(-28,48);ctx.lineTo(-52,32);ctx.lineTo(-60,8);ctx.lineTo(-52,-18);ctx.lineTo(-28,-36);ctx.closePath();ctx.fill();
    ctx.fillStyle=rGrad(0,0,0,18,[[0,'rgba(255,220,100,.9)'],[.5,'rgba(255,80,0,.65)'],[1,'rgba(0,0,0,0)']]);
    ctx.beginPath();ctx.arc(0,0,18,0,TAU);ctx.fill();
    // Boss HP
    var bw=96,bh=5;
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(-bw/2-1,62,bw+2,bh+2);
    var hp_r=e.hp/e.maxhp;
    ctx.fillStyle=hp_r>.5?'rgba(0,255,100,.88)':hp_r>.25?'rgba(255,178,0,.88)':'rgba(255,38,38,.88)';
    ctx.fillRect(-bw/2,63,bw*hp_r,bh);
    ctx.font='bold 8px Share Tech Mono';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('BOSS',0,63+bh+11);
  } else {
    ctx.fillStyle=rGrad(0,0,2,14,[[0,c+'ee'],[.5,c+'aa'],[1,c+'44']]);
    ctx.beginPath();
    if(e.type%3===0){ctx.moveTo(0,-14);ctx.lineTo(11,8);ctx.lineTo(-11,8);ctx.closePath();}
    else if(e.type%3===1){for(var i=0;i<6;i++){var a=i/6*TAU;ctx.lineTo(Math.cos(a)*14,Math.sin(a)*14);}}
    else{ctx.arc(0,0,12,0,TAU);}
    ctx.fill();
    ctx.shadowBlur=10;ctx.shadowColor=c;
    ctx.strokeStyle=c;ctx.lineWidth=.8;ctx.globalAlpha=.6*pulse;ctx.stroke();
    if(e.maxhp>1){
      var pw=5,pgap=3,tw=e.maxhp*(pw+pgap);
      for(var pi=0;pi<e.maxhp;pi++){
        ctx.globalAlpha=1;ctx.fillStyle=pi<e.hp?c:'rgba(60,60,60,.4)';
        ctx.fillRect(-tw/2+pi*(pw+pgap),17,pw,3);
      }
    }
  }
  ctx.restore();
}

var BCOLS={normal:'rgba(0,195,255,.88)',spread:'rgba(0,210,185,.88)',laser:'rgba(255,200,0,.9)',plasma:'rgba(210,0,245,.9)',missile:'rgba(255,178,58,.9)',beam:'rgba(155,225,255,.9)'};
function drawBullet(b){
  ctx.save();
  if(b.enemy){
    ctx.shadowBlur=7;ctx.shadowColor=b.col||'#ff88aa';ctx.fillStyle=b.col||'#ff88aa';
    ctx.beginPath();ctx.moveTo(b.x,b.y-5);ctx.lineTo(b.x+2.5,b.y+2);ctx.lineTo(b.x,b.y+5);ctx.lineTo(b.x-2.5,b.y+2);ctx.closePath();ctx.fill();
  } else {
    var c=BCOLS[b.type]||BCOLS.normal;
    ctx.shadowBlur=11;ctx.shadowColor=c;ctx.fillStyle=c;
    if(b.type==='plasma'){ctx.beginPath();ctx.arc(b.x,b.y,6,0,TAU);ctx.fill();}
    else if(b.type==='beam'){ctx.fillRect(b.x-2.5,b.y-18,5,20);}
    else{ctx.fillRect(b.x-1.8,b.y-9,3.5,12);}
  }
  ctx.restore();
}

function drawPowerup(pu){
  ctx.save();ctx.translate(pu.x,pu.y);
  var c=PU_COLS[pu.type];var lab=PU_LABS[pu.type];
  var spin=gs.t*.04,bob=Math.sin(gs.t*.07)*3;
  ctx.translate(0,bob);ctx.save();ctx.rotate(spin);
  ctx.strokeStyle=c;ctx.lineWidth=1.4;ctx.shadowBlur=9;ctx.shadowColor=c;ctx.globalAlpha=.55+Math.sin(gs.t*.09)*.2;
  ctx.beginPath();ctx.arc(0,0,13,0,TAU);ctx.stroke();
  ctx.restore();
  var gg=rGrad(0,0,0,9,[[0,'rgba(255,255,255,.95)'],[.3,c+'ee'],[.8,c+'66'],[1,'rgba(0,0,0,0)']]);
  ctx.fillStyle=gg;ctx.shadowBlur=15;ctx.shadowColor=c;
  ctx.beginPath();for(var i=0;i<6;i++){var a=i/6*TAU+spin*.5;if(!i)ctx.moveTo(Math.cos(a)*9,Math.sin(a)*9);else ctx.lineTo(Math.cos(a)*9,Math.sin(a)*9);}
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.88)';ctx.font='bold 6px Share Tech Mono';ctx.textAlign='center';ctx.globalAlpha=1;
  ctx.fillText(lab,0,16);
  ctx.restore();
}

var PU_COLS=['#00ffaa','#ff8800','#4488ff','#ff2244','#ffee00','#ff44ff','#ffaa00','#ccffff'];
var PU_LABS=['SPREAD','LASER','SHIELD','BOMB','SPEED','PLASMA','MISSLE','BEAM'];

function drawHUD(){
  // Top bar
  ctx.fillStyle='rgba(0,3,16,.82)';ctx.fillRect(0,0,W,48);
  var tl=ctx.createLinearGradient(0,48,W,48);tl.addColorStop(0,'rgba(0,0,0,0)');tl.addColorStop(.3,'rgba(0,160,255,.3)');tl.addColorStop(.7,'rgba(0,160,255,.3)');tl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.strokeStyle=tl;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(0,48);ctx.lineTo(W,48);ctx.stroke();
  // Score
  ctx.save();ctx.shadowBlur=9;ctx.shadowColor='rgba(255,200,0,.5)';ctx.font='bold 15px Orbitron';ctx.textAlign='left';ctx.fillStyle='rgba(255,218,48,.96)';ctx.fillText(String(gs.score).padStart(8,'0'),14,28);ctx.restore();
  ctx.font='7px Share Tech Mono';ctx.fillStyle='rgba(0,140,195,.5)';ctx.textAlign='left';ctx.fillText('SCORE',14,40);
  // Wave
  ctx.save();ctx.shadowBlur=9;ctx.shadowColor='rgba(150,0,255,.5)';ctx.font='bold 13px Orbitron';ctx.textAlign='center';ctx.fillStyle='rgba(178,78,255,.9)';ctx.fillText('WAVE '+gs.wave,W/2,26);ctx.restore();
  ctx.font='7px Share Tech Mono';ctx.fillStyle='rgba(118,58,178,.55)';ctx.textAlign='center';ctx.fillText('SECTOR',W/2,38);
  // Credits (top bar, right of wave)
  ctx.save();
  ctx.font='bold 11px Orbitron';ctx.textAlign='right';
  ctx.fillStyle='rgba(255,220,50,.85)';ctx.shadowBlur=7;ctx.shadowColor='rgba(255,190,0,.5)';
  ctx.fillText('💰 '+gs.credits,W-14,26);ctx.restore();
  ctx.font='7px Share Tech Mono';ctx.fillStyle='rgba(200,160,0,.45)';ctx.textAlign='right';
  ctx.fillText('CREDITS',W-14,38);
  // Lives — shown right of score
  ctx.font='7px Share Tech Mono';ctx.fillStyle='rgba(0,140,195,.5)';ctx.textAlign='left';ctx.fillText('LIVES',120,40);
  for(var i=0;i<Math.max(0,gs.lives);i++){
    var lx=120+i*16;

function selectUpgrade(idx){
  if(idx==='skip'){
    gs.upgradePhase=false;gs.upgChoices=null;gs._upgCards=null;gs._skipCard=null;
    setTimeout(function(){gs.enemies=makeEnemyWave(gs.wave);gs.waveClearT=gs.t;},400);
    return;
  }
  var c=gs.upgChoices[idx];if(!c)return;
  var price=getUpgradePrice(c);
  if(gs.credits<price){
    addFloat(W/2,H*.6,'NOT ENOUGH CREDITS','#ff4466',false);
    SFX.shield();return;
  }
  gs.credits-=price;
  _upgBought[c.id]=(_upgBought[c.id]||0)+1;
  c.apply();SFX.upgrade();
  addFloat(W/2,H*.45,c.name+' ACTIVATED',c.col,true);
  // Allow buying again from same shop if credits remain
  // Refresh choices so prices update
  gs.upgChoices=getUpgrades();
  // If can't afford any, auto-close after short delay
  var anyAffordable=gs.upgChoices.some(function(u){return gs.credits>=getUpgradePrice(u);});
  if(!anyAffordable){
    setTimeout(function(){
      gs.upgradePhase=false;gs.upgChoices=null;gs._upgCards=null;gs._skipCard=null;
      setTimeout(function(){gs.enemies=makeEnemyWave(gs.wave);gs.waveClearT=gs.t;},400);
    },1200);
  }
}

// ─── WAVE FACTORY ─────────────────────────────────────────────────────────────
function makeEnemyWave(wave){
  var en=[];var dc=DCFG[gs.difficulty||1];
  if(wave%5===0){
    var bt=Math.min(Math.floor(wave/5)-1,2);
    var hp=Math.round((36+bt*28)*dc.hpM);
    en.push({x:W/2,y:-110,ty:130,type:0,hp:hp,maxhp:hp,alive:true,boss:true,
      st:48,ang:0,dx:(1.6+bt*.5)*dc.spdM,patT:0,pat:0,_raged:false});
  }else{
    var cols=Math.min(2+wave,7),rows=Math.min(1+Math.floor(wave/3),4);
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        var tp=Math.floor(rand(0,Math.min(EC.length,1+wave*.6)));
        var hp2=tp>3?2:1;hp2=Math.max(1,Math.round(hp2*dc.hpM));
        en.push({x:52+c*(412/Math.max(cols-1,1)),y:-40-r*54,ty:62+r*58,
          type:tp,hp:hp2,maxhp:hp2,alive:true,boss:false,
          st:Math.round((52+rand(0,44))/dc.fireM),dx:rand(-1,1)*dc.spdM});
      }
    }
  }
  return en;
}

// ─── UPDATE ───────────────────────────────────────────────────────────────────
function update(){
  gs.t++;
  if(!_ready&&gs.t===3)initAC();
  if(gs.phase!=='playing')return;
  if(gs.upgradePhase)return;
  if(gs.screenShake>0)gs.screenShake*=.75;

  var p=gs.player,dc=DCFG[gs.difficulty||1];
  var spd=5.5*dc.spdM*(gs.spdBonus||1)*(p.speedT>0?1.4:1);
  if(gs.keys['ArrowLeft']||gs.keys['a'])p.x=clamp(p.x-spd,22,W-22);
  if(gs.keys['ArrowRight']||gs.keys['d'])p.x=clamp(p.x+spd,22,W-22);
  if(gs.keys['ArrowUp']||gs.keys['w'])p.y=clamp(p.y-spd*.75,54,H-54);
  if(gs.keys['ArrowDown']||gs.keys['s'])p.y=clamp(p.y+spd*.75,54,H-54);
  if(gs.mactive)p.x=lerp(p.x,gs.mx,.14);

  if(p.inv>0)p.inv--;if(p.shield>0)p.shield--;if(p.speedT>0)p.speedT--;
  if(gs.weaponT>0){gs.weaponT--;if(!gs.weaponT)gs.weapon='normal';}
  if(gs.shootCD>0)gs.shootCD--;
  if(gs.comboTimer>0){gs.comboTimer--;if(!gs.comboTimer)gs.combo=0;}

  // Fire
  var fire=gs.keys[' ']||gs.keys['z']||gs.firebtnHeld;
  if(fire&&gs.shootCD===0){
    var sp=function(vx,vy,type,pi){
      gs.bullets.push({x:p.x+(vx?14*Math.sign(vx):0),y:p.y-18,vx:vx,vy:vy,type:type||gs.weapon,r:type==='plasma'?11:type==='beam'?12:8,pierce:pi||gs.pierce||0});
    };
    if(gs.weapon==='spread'){sp(-2.8,-11,'spread');sp(0,-13,'spread');sp(2.8,-11,'spread');gs.shootCD=Math.round(8/dc.fireM*(gs.fireBonus||1));}
    else if(gs.weapon==='laser'){sp(0,-20,'laser');gs.shootCD=Math.round(4/dc.fireM*(gs.fireBonus||1));}
    else if(gs.weapon==='plasma'){sp(-3,-10,'plasma');sp(0,-14,'plasma');sp(3,-10,'plasma');gs.shootCD=Math.round(14/dc.fireM*(gs.fireBonus||1));}
    else if(gs.weapon==='missile'){
      if(gs.missileN>0){
        var tgt=null,bestD=9999;
        gs.enemies.forEach(function(e){if(e.alive){var d=dist(e.x,e.y,p.x,p.y);if(d<bestD){bestD=d;tgt=e;}}});
        gs.bullets.push({x:p.x,y:p.y-18,vx:0,vy:-9,type:'missile',r:9,target:tgt,hstr:.18,pierce:0});
        gs.missileN--;gs.shootCD=Math.round(14/dc.fireM*(gs.fireBonus||1));
      }else{sp(0,-14,'normal');gs.shootCD=Math.round(9/dc.fireM*(gs.fireBonus||1));}
    }
    else if(gs.weapon==='beam'){sp(0,-24,'beam');gs.shootCD=Math.round(3/dc.fireM*(gs.fireBonus||1));}
    else{sp(0,-14,'normal');gs.shootCD=Math.round(9/dc.fireM*(gs.fireBonus||1));}
    SFX.shoot(gs.weapon);
    if(gs.t%3===0)trail(p.x,p.y+14,'rgba(70,130,255,.6)');
  }

  // Bullet movement
  var bAlive=[];
  gs.bullets.forEach(function(b){
    if(b.target&&b.target.alive){
      var ddx=b.target.x-b.x,ddy=b.target.y-b.y,dd=Math.sqrt(ddx*ddx+ddy*ddy)||1;
      b.vx=lerp(b.vx,ddx/dd*12,b.hstr);b.vy=lerp(b.vy,ddy/dd*12,b.hstr);
    }
    if(b.type==='missile')trail(b.x,b.y,'rgba(255,140,40,.65)');
    b.x+=b.vx;b.y+=b.vy;
    if(b.y>-60&&b.y<H+60&&b.x>-60&&b.x<W+60)bAlive.push(b);
  });
  gs.bullets=bAlive;

  // Enemy bullets movement
  var ebAlive=[];
  gs.bullets.forEach(function(b){if(b.enemy){b.x+=b.vx;b.y+=b.vy;if(b.y<H+30)ebAlive.push(b);}});
  gs.bullets=gs.bullets.filter(function(b){return!b.enemy;}).concat(ebAlive);

  // Powerups
  var puAlive=[];
  gs.powerups.forEach(function(pu){
    if(gs.magnet){var dx=p.x-pu.x,dy=p.y-pu.y,dd=Math.sqrt(dx*dx+dy*dy)||1;if(dd<200){pu.x+=dx/dd*4;pu.y+=dy/dd*4;}}
    pu.y+=pu.vy;pu.life--;
    if(dist(pu.x,pu.y,p.x,p.y)<22){
      _applyPU(pu);burst(pu.x,pu.y,PU_COLS[pu.type],14);ring(pu.x,pu.y,PU_COLS[pu.type]);
    }else if(pu.life>0&&pu.y<H+30)puAlive.push(pu);
  });
  gs.powerups=puAlive;

  function _applyPU(pu){
    SFX.power();
    if(pu.type===0){gs.weapon='spread';gs.weaponT=Math.round(580*(gs.wpnBonus||1));gs.achWeapons.spread=1;}
    else if(pu.type===1){gs.weapon='laser';gs.weaponT=Math.round(540*(gs.wpnBonus||1));gs.achWeapons.laser=1;}
    else if(pu.type===2){p.shield=320;SFX.shield();}
    else if(pu.type===3){_bomb();}
    else if(pu.type===4){p.speedT=440;}
    else if(pu.type===5){gs.weapon='plasma';gs.weaponT=Math.round(530*(gs.wpnBonus||1));gs.achWeapons.plasma=1;}
    else if(pu.type===6){gs.weapon='missile';gs.missileN=(gs.missileN||0)+8;gs.weaponT=Math.round(620*(gs.wpnBonus||1));gs.achWeapons.missile=1;}
    else if(pu.type===7){gs.weapon='beam';gs.weaponT=Math.round(470*(gs.wpnBonus||1));gs.achWeapons.beam=1;}
    if(Object.keys(gs.achWeapons).length>=5)unlock('weapons');
  }

  function _bomb(){
    gs.bullets=gs.bullets.filter(function(b){return!b.enemy;});
    gs.screenShake=22;SFX.bomb();ring(W/2,H/2,'rgba(255,100,0,.8)');burst(W/2,H/2,'rgba(255,140,50,.9)',48,11);
    gs.enemies.forEach(function(e){if(!e.alive)return;e.hp=Math.max(0,e.hp-3);burst(e.x,e.y,EC[e.type%EC.length],10);
      if(e.hp<=0){e.alive=false;gs.score+=100;gs.totalKills++;_onKill(e);}});
  }

  function _onKill(e){
    burst(e.x,e.y,EC[e.type%EC.length],e.boss?44:18,6);ring(e.x,e.y,EC[e.type%EC.length]+'aa');
    if(_spawnPU(e.x,e.y)&&e.boss)_spawnPU(e.x+20,e.y);
    SFX.kill(e.type);if(e.boss)SFX.explode(true);else SFX.explode();
    gs.totalKills++;
    if(gs.totalKills===1)unlock('first');
    if(gs.combo>=5)unlock('combo5');
    if(gs.score>=50000)unlock('50k');
    if(e.boss)unlock('boss');
    var ms=[10000,25000,50000,100000,200000];
    ms.forEach(function(m){if(gs.score>=m&&!gs._miles[m]){gs._miles[m]=1;addFloat(W/2,H*.28,'★ '+m.toLocaleString(),'#ffee00',true);SFX.power();}});
  }

  function _spawnPU(x,y){
    if(Math.random()>.32)return false;
    gs.powerups.push({x:x,y:y,vy:1.0,type:Math.floor(rand(0,PU_COLS.length)),life:480,r:14});
    return true;
  }

  // Enemies
  var allDead=true;
  gs.enemies.forEach(function(e){
    if(!e.alive)return;
    allDead=false;
    if(e.y<e.ty){e.y+=2;return;}

    if(e.boss){
      if(!e._raged&&e.hp/e.maxhp<=.5){e._raged=true;e.dx*=1.7;addFloat(e.x,e.y-55,'RAGE MODE!','#ff2040',true);gs.screenShake=18;SFX.boss();}
      e.patT++;if(e.patT>220){e.pat=(e.pat+1)%3;e.patT=0;}
      e.x+=Math.sin(gs.t*.016)*e.dx*1.6;e.x=clamp(e.x,80,W-80);
      e.st--;
      if(e.st<=0){
        e.st=Math.max(12,52-gs.wave*2)+rand(0,24);
        var sp=2.8+gs.wave*.12;
        if(e.pat===0){var dx=p.x-e.x,dy=p.y-e.y,dd=Math.sqrt(dx*dx+dy*dy)||1;gs.bullets.push({x:e.x,y:e.y,vx:dx/dd*sp,vy:dy/dd*sp,enemy:true,r:7,col:'#ff4488'});}
        else if(e.pat===1){for(var q=-2;q<=2;q++)gs.bullets.push({x:e.x,y:e.y,vx:q*1.4,vy:sp,enemy:true,r:7,col:'#ff8000'});}
        else{for(var q=0;q<8;q++){var qa=q/8*TAU+gs.t*.04;gs.bullets.push({x:e.x,y:e.y,vx:Math.cos(qa)*sp,vy:Math.sin(qa)*sp,enemy:true,r:7,col:'#ff2040'});}}
      }
    }else{
      e.x+=e.dx*(1+gs.wave*.06);if(e.x<22||e.x>W-22)e.dx*=-1;
      e.st--;
      if(e.st<=0){
        e.st=Math.max(18,85-gs.wave*5)+rand(0,36);
        var dx=p.x-e.x,dy=p.y-e.y,dd=Math.sqrt(dx*dx+dy*dy)||1,sp=2.4+gs.wave*.12;
        gs.bullets.push({x:e.x,y:e.y,vx:dx/dd*sp,vy:dy/dd*sp,enemy:true,r:7});
      }
      // Player contact
      if(p.inv===0&&dist(e.x,e.y,p.x,p.y)<22){e.alive=false;_hitPlayer();}
    }

    // Bullet vs enemy
    var nBullets=[];
    gs.bullets.filter(function(b){return!b.enemy;}).forEach(function(b){
      var hr=e.boss?42:17;
      if(dist(b.x,b.y,e.x,e.y)<hr+b.r){
        var dmg=b.type==='plasma'?2:b.type==='beam'?3:1;
        e.hp-=dmg;SFX.hit();burst(b.x,b.y,EC[e.type%EC.length],4,2);
        if((b.pierce||0)>0){b.pierce--;nBullets.push(b);}
        else if(b.type==='laser'||b.type==='beam')nBullets.push(b);
        if(e.hp<=0){
          e.alive=false;
          gs.combo++;gs.comboTimer=115;
          var pts=Math.round((e.type+1)*100*(e.boss?12:1)*Math.max(1,gs.combo)*(gs.scBonus||1)*dc.scM);
          gs.score+=pts;
          var ptStr=pts>=1000?(Math.round(pts/100)/10)+'K':String(pts);
          addFloat(e.x,e.y-10,'+'+ptStr,gs.combo>=5?'#ff8800':gs.combo>=3?'#ffee44':'#fff',gs.combo>=3);
          if(gs.combo>1)SFX.comboUp(gs.combo);
          _onKill(e);
        }
      }else{nBullets.push(b);}
    });
    gs.bullets=gs.bullets.filter(function(b){return b.enemy;}).concat(nBullets);
  });

  // Enemy bullets vs player
  if(p.inv===0){
    var ebRemaining=[];
    gs.bullets.filter(function(b){return b.enemy;}).forEach(function(b){
      if(dist(b.x,b.y,p.x,p.y)<15)_hitPlayer();
      else ebRemaining.push(b);
    });
    gs.bullets=gs.bullets.filter(function(b){return!b.enemy;}).concat(ebRemaining);
  }

  // Particles
  var pa=[];
  gs.parts.forEach(function(pt){
    if(pt.type==='ring'){pt.r=lerp(pt.r,pt.maxR,.12);pt.life-=pt.dec;if(pt.life>0)pa.push(pt);}
    else{pt.x+=pt.vx;pt.y+=pt.vy;pt.vx*=.9;pt.vy*=.9;pt.life-=pt.dec;if(pt.life>0)pa.push(pt);}
  });
  gs.parts=pa;

  if(allDead&&gs.phase==='playing')_nextWave();

  function _hitPlayer(){
    if(p.shield>0){p.shield=0;gs.screenShake=10;SFX.shield();burst(p.x,p.y,'rgba(0,175,255,.88)',14);ring(p.x,p.y,'rgba(0,195,255,.7)');return;}
    gs.lives--;p.inv=130;gs.combo=0;gs.screenShake=16;SFX.explode();
    burst(p.x,p.y,'rgba(70,140,255,.88)',24,6);ring(p.x,p.y,'rgba(0,140,255,.5)');
    if(gs.lives<=0){
      gs.phase='gameover';musicStop();SFX.gameover();
      setTimeout(function(){openModal('gameover',buildGameoverHtml(),false);},1600);
    }
  }
}

function _nextWave(){
  if(gs.lives===gs.prevLives&&gs.wave>1)unlock('nohit');
  gs.prevLives=gs.lives;
  var oldWave=gs.wave;gs.wave++;
  unlock(gs.wave>=5?'wave5':'');unlock(gs.wave>=10?'wave10':'');

  // Earn credits: base 50 + 15 per wave, +20% bonus for no damage taken
  var earned=50+gs.wave*15;
  if(gs.lives===gs.prevLives)earned=Math.round(earned*1.2);
  gs.credits+=earned;
  addFloat(W/2,H*.44,'+'+earned+' CREDITS','#ffdd44',false);

  SFX.wave();
  addFloat(W/2,H*.38,'WAVE '+gs.wave,gs.wave%5===0?'#ff4060':'#00ffcc',true);
  if(gs.wave%5===0){setTimeout(function(){SFX.boss();addFloat(W/2,H*.5,'BOSS INCOMING','#ff4060',true);},600);}
  if(oldWave%3===0){
    gs.upgradePhase=true;gs.upgChoices=getUpgrades();SFX.upgrade();
  }else{
    setTimeout(function(){gs.enemies=makeEnemyWave(gs.wave);gs.waveClearT=gs.t;},1400);
  }
}

// ─── DRAW LOOP ────────────────────────────────────────────────────────────────
function draw(){
  var sx=gs.screenShake>.5?rand(-gs.screenShake,gs.screenShake)*.45:0;
  var sy=gs.screenShake>.5?rand(-gs.screenShake,gs.screenShake)*.35:0;
  ctx.save();if(gs.screenShake>.5)ctx.translate(sx,sy);

  drawBG();

  if(gs.phase==='title'){drawTitle();ctx.restore();return;}
  if(gs.upgradePhase){drawUpgradeShop();ctx.restore();return;}

  // Particles: rings behind
  gs.parts.forEach(function(pt){
    if(pt.type==='ring'){
      ctx.save();ctx.globalAlpha=Math.max(0,pt.life);ctx.strokeStyle=pt.col;ctx.lineWidth=2;ctx.shadowBlur=7;ctx.shadowColor=pt.col;
      ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,TAU);ctx.stroke();ctx.restore();
    }
  });

  if(gs.phase==='playing'||gs.phase==='gameover'){
    gs.powerups.forEach(function(pu){drawPowerup(pu);});
    gs.bullets.forEach(function(b){drawBullet(b);});
    gs.enemies.forEach(function(e){drawEnemy(e);});
    if(gs.phase==='playing')drawShip();
  }

  // Particles: dots on top
  gs.parts.forEach(function(pt){
    if(pt.type!=='ring'){
      ctx.save();ctx.globalAlpha=Math.max(0,pt.life);ctx.fillStyle=pt.col;ctx.shadowBlur=5;ctx.shadowColor=pt.col;
      ctx.beginPath();ctx.arc(pt.x,pt.y,Math.max(.4,pt.r*pt.life),0,TAU);ctx.fill();ctx.restore();
    }
  });

  // Float texts
  gs.floats.forEach(function(ft){
    ctx.save();ctx.globalAlpha=Math.min(1,ft.life*1.8);ctx.shadowBlur=10;ctx.shadowColor=ft.col;ctx.fillStyle=ft.col;
    ctx.font='bold '+ft.sz+'px Orbitron';ctx.textAlign='center';ctx.fillText(ft.txt,ft.x,ft.y);ctx.restore();
    ft.y+=ft.vy;ft.life-=ft.decay;
  });
  gs.floats=gs.floats.filter(function(ft){return ft.life>0;});

  drawHUD();
  ctx.restore();
}

// ─── INPUT ────────────────────────────────────────────────────────────────────
window.addEventListener('keydown',function(e){
  gs.keys[e.key]=true;
  if(e.key===' ')e.preventDefault();
  if(gs.phase==='title'&&e.key===' '){initAC();openModal('main',buildMainHtml(),false);}
  if(gs.upgradePhase){if(e.key==='1')selectUpgrade(0);if(e.key==='2')selectUpgrade(1);if(e.key==='3')selectUpgrade(2);if(e.key==='4')selectUpgrade('skip');}
  if(e.key==='q'||e.key==='Q'){
    if(gs.phase==='playing'){
      gs.bullets=gs.bullets.filter(function(b){return!b.enemy;});
      gs.screenShake=22;SFX.bomb();ring(W/2,H/2,'rgba(255,100,0,.8)');burst(W/2,H/2,'rgba(255,140,50,.9)',48,11);
      gs.enemies.forEach(function(e){if(!e.alive)return;e.hp=Math.max(0,e.hp-3);if(e.hp<=0){e.alive=false;gs.score+=100;gs.totalKills++;}});
    }
  }
});
window.addEventListener('keyup',function(e){gs.keys[e.key]=false;});

// Touch input
function getCanvasPos(clientX,clientY){
  var r=canvas.getBoundingClientRect();
  return{x:(clientX-r.left)*(W/r.width),y:(clientY-r.top)*(H/r.height)};
}
canvas.addEventListener('touchstart',function(e){
  e.preventDefault();initAC();
  var pos=getCanvasPos(e.touches[0].clientX,e.touches[0].clientY);
  if(gs.phase==='title'){
    // volume icon zone
    if(pos.x>W-55&&pos.y>H-50){setMute(!_muted);SFX.menuClick();return;}
    openModal('main',buildMainHtml(),false);return;
  }
  if(gs.phase==='playing'){
    // volume icon bottom-right
    if(pos.x>W-55&&pos.y>H-50){setMute(!_muted);SFX.menuClick();return;}
    if(gs.upgradePhase&&gs._upgCards){
      gs._upgCards.forEach(function(cc,ci){
        if(pos.x>=cc.x-14&&pos.x<=cc.x+cc.w+14&&pos.y>=cc.y-14&&pos.y<=cc.y+cc.h+14)selectUpgrade(ci);
      });
      if(gs._skipCard){var sk=gs._skipCard;if(pos.x>=sk.x&&pos.x<=sk.x+sk.w&&pos.y>=sk.y&&pos.y<=sk.y+sk.h)selectUpgrade('skip');}
      return;
    }
    gs.mx=pos.x;gs.mactive=true;gs.firebtnHeld=true;
  }
},{passive:false});
canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(gs.phase==='playing'&&!gs.upgradePhase){gs.mx=getCanvasPos(e.touches[0].clientX,e.touches[0].clientY).x;gs.mactive=true;}
},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();gs.mactive=false;gs.firebtnHeld=false;},{passive:false});

canvas.addEventListener('click',function(ev){
  initAC();
  var pos=getCanvasPos(ev.clientX,ev.clientY);
  if(gs.phase==='title'){
    if(pos.x>W-55&&pos.y>H-50){setMute(!_muted);SFX.menuClick();return;}
    openModal('main',buildMainHtml(),false);return;
  }
  if(gs.phase==='playing'){
    if(pos.x>W-55&&pos.y>H-50){setMute(!_muted);SFX.menuClick();return;}
    if(gs.upgradePhase&&gs._upgCards){
      gs._upgCards.forEach(function(cc,ci){
        if(pos.x>=cc.x-14&&pos.x<=cc.x+cc.w+14&&pos.y>=cc.y-14&&pos.y<=cc.y+cc.h+14)selectUpgrade(ci);
      });
      if(gs._skipCard){var sk=gs._skipCard;if(pos.x>=sk.x&&pos.x<=sk.x+sk.w&&pos.y>=sk.y&&pos.y<=sk.y+sk.h)selectUpgrade('skip');}
    }
  }
});

document.getElementById('modal-close').addEventListener('click',function(){popModal();SFX.menuClick();});

// expose to onclick attrs
window.popModal=popModal;
window.selectDifficulty=function(d){_sel=d;_renderDiffBtns();SFX.menuClick();};
window.startGame=startGame;
window.submitScore=function(){
  var ni=document.getElementById('go-name');var nm=ni?ni.value.trim():'ACE';
  lbAdd(nm,gs.score,gs.wave);SFX.menuClick();
  openModal('lb',buildLBHtml());
};

// ─── LOOP ─────────────────────────────────────────────────────────────────────
buildNebula();
function loop(){update();draw();requestAnimationFrame(loop);}
loop();

})();
</script>
